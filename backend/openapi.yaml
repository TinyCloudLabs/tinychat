openapi: 3.1.0
info:
  title: "TinyChat API"
  version: 0.1.0
  description: "API contract for the TinyChat backend."

security:
  - bearerAuth: []

paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      security: []
      responses:
        "200":
          description: Backend is alive
          content:
            application/json:
              schema:
                type: object
                required: [ok, app]
                properties:
                  ok:
                    type: boolean
                  app:
                    type: string

  /api/manifest:
    get:
      operationId: getManifest
      summary: Runtime TinyCloud app manifest
      security: []
      responses:
        "200":
          description: Runtime manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Manifest"

  /api/server-info:
    get:
      operationId: getServerInfo
      summary: Backend delegation policy
      security: []
      responses:
        "200":
          description: Backend DID, status, policy, and policy hash
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerInfo"

  /api/auth/nonce:
    get:
      operationId: createNonce
      summary: Create SIWE nonce
      security: []
      parameters:
        - name: address
          in: query
          required: true
          schema:
            type: string
            pattern: "^0x[0-9a-fA-F]{40}$"
      responses:
        "200":
          description: Nonce created
          content:
            application/json:
              schema:
                type: object
                required: [nonce]
                properties:
                  nonce:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/auth/verify:
    post:
      operationId: verifySession
      summary: Verify SIWE session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message, signature]
              properties:
                message:
                  type: string
                signature:
                  type: string
      responses:
        "200":
          description: Backend session token
          content:
            application/json:
              schema:
                type: object
                required: [token, expiresIn, address]
                properties:
                  token:
                    type: string
                  expiresIn:
                    type: integer
                  address:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/delegations/status:
    get:
      operationId: getDelegationStatus
      summary: Check stored delegation status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Delegation status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DelegationResponse"
              examples:
                active:
                  value:
                    status: active
                    expiresAt: "2026-05-20T12:00:00.000Z"
                expired:
                  value:
                    status: expired
                    expiresAt: "2026-05-19T12:00:00.000Z"
                stale:
                  value:
                    status: stale
                    expiresAt: null
                none:
                  value:
                    status: none
                    expiresAt: null
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/delegations:
    post:
      operationId: storeDelegation
      summary: Store and activate a portable delegation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serialized]
              properties:
                serialized:
                  type: string
      responses:
        "200":
          description: Delegation active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DelegationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    delete:
      operationId: revokeDelegation
      summary: Remove stored delegation
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Delegation removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DelegationResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/chat:
    post:
      operationId: chat
      summary: Stream a chat completion from the RedPill LLM API
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: "Server-sent events stream (OpenAI SSE format). Each line is data: followed by JSON or [DONE]."
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /api/chat/models:
    get:
      operationId: getChatModels
      summary: List available LLM models from RedPill
      description: >-
        Each model is annotated with `allowed` and (when not allowed) the
        `requiredTier` for the calling user's subscription tier. When the
        paywall is disabled every model is returned with `allowed: true`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Available models
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelsResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /api/attestation/self:
    get:
      operationId: getBackendSelfAttestation
      summary: Create a fresh backend TDX quote
      description: >-
        Returns a dstack TDX quote whose report_data is bound to the backend
        identity and caller-provided nonce. Local development environments
        without the dstack socket return attestation_unavailable.
      security:
        - bearerAuth: []
      parameters:
        - name: nonce
          in: query
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{64}$"
      responses:
        "200":
          description: Fresh backend attestation quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackendSelfAttestation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          description: dstack attestation is unavailable in this environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/billing/config:
    get:
      operationId: getBillingConfig
      summary: Public pricing and tier configuration
      description: >-
        Public (unauthenticated) pricing payload. Display prices are integer
        cents; the frontend divides by 100 to render dollars.
      security: []
      responses:
        "200":
          description: Paywall flag and tier list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingConfig"

  /api/billing/rates:
    get:
      operationId: getBillingRates
      summary: Public per-model credit rates
      description: >-
        Public (unauthenticated) credit-rate table. Denominated in credits only —
        no dollar/USD fields appear in this payload. Served from the shared
        RedPill catalog and mirrors `/api/chat/models`' 500/502 error contract.
      security: []
      responses:
        "200":
          description: Baseline model id and per-model rates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatesResponse"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /api/billing/status:
    get:
      operationId: getBillingStatus
      summary: Caller's tier, usage, and subscription
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Billing status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/billing/checkout:
    post:
      operationId: createCheckout
      summary: Create a Stripe Checkout session for a paid tier
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
      responses:
        "200":
          description: Checkout URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/BillingNotConfigured"

  /api/billing/portal:
    post:
      operationId: createBillingPortal
      summary: Create a Stripe billing portal session
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Portal URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/BillingNotConfigured"

  /api/billing/webhook:
    post:
      operationId: stripeWebhook
      summary: Stripe webhook receiver (subscription change events)
      description: >-
        Receives Stripe events with a raw body and a `Stripe-Signature` header.
        Verified with STRIPE_WEBHOOK_SECRET. On customer.subscription.* events
        the in-memory tier cache for the affected address is invalidated.
        Stateless — no data is persisted.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Event acknowledged
          content:
            application/json:
              schema:
                type: object
                required: [received]
                properties:
                  received:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/BillingNotConfigured"

  # ── Connector webhooks (background sync) ──────────────────────────────
  # The whole group mounts ONLY when CONNECTOR_WEBHOOKS_ENABLED=true. While the
  # flag is off every path below 404s — that is what the post-deploy probe in
  # .github/workflows/deploy-backend-phala.yml asserts (mounted -> 401 on a
  # junk-signature POST; missing -> 404).
  /api/connectors/webhooks/{source}/{token}:
    post:
      operationId: receiveConnectorDelivery
      summary: Signed connector delivery (public; the per-user routing token rides in the URL)
      description: >-
        Unauthenticated and mounted ahead of the global JSON parser, CSRF and the
        global limiter: the raw body is HMAC-verified against
        `x-hub-signature: sha256={hex}` before it is parsed. The provider payload
        carries no user identity, so the URL token is what resolves the tenant.
        Every rejection — unknown source, malformed token, unknown token, bad
        signature — returns the identical 401 body, so the route is never an oracle.
        A 202 means the delivery was durably queued and nothing more — the
        provider learns the same thing either way, and the two paragraphs below are
        invisible to it. OUTSIDE the backend-ingest cohort (ingest shape C, the
        default and the only shape while the flag is dark) queueing the id IS the
        whole server-side job: nothing is fetched, nothing is drained after the
        response, and nothing is written to the user's space. For those addresses
        this server never receives the user's connector API key — the browser does
        the fetching and the writing on the user's next authenticated visit (POST
        /drain, then POST /ack). FOR A COHORT ADDRESS (CONNECTOR_BACKEND_INGEST_ENABLED
        plus the per-address allowlist) the same 202 additionally nudges the backend
        fetch worker: the server holds a per-user Fireflies OAuth credential for that
        address, fetches the meeting itself, and keeps an encrypted server-side copy
        for 90 days, which the user reads back over GET /api/connectors/meetings. The
        browser's /drain surfaces nothing for it and /ack is an idempotent no-op. What
        does NOT change either way is the delegation: this server holds no connector
        delegation for any address — cohort custody is out of band, so nothing is
        minted inside a user's space.
      security: []
      parameters:
        - name: source
          in: path
          required: true
          description: Connector registry id.
          schema:
            type: string
            enum: [fireflies]
        - name: token
          in: path
          required: true
          description: Opaque per-user routing token — 32 random bytes, base64url.
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{43}$"
        - name: x-hub-signature
          in: header
          required: true
          description: "`sha256={hex}` over the exact raw request body. No algorithm negotiation."
          schema:
            type: string
            pattern: "^sha256=[0-9a-fA-F]{64}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectorDelivery"
      responses:
        "200":
          description: >-
            Event verified but not one this connector handles. Answered 200 so the
            provider stops retrying an event that will never be processed.
          content:
            application/json:
              schema:
                type: object
                required: [status, event]
                properties:
                  status:
                    type: string
                    const: ignored
                  event:
                    type: string
        "202":
          description: >-
            Verified and durably queued. Byte-identical even when the queue cap
            dropped an older item — a drop count here would tell a token holder when
            a victim's queue is saturated; it goes to the log and to GET /pending.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: queued
        "400":
          description: >-
            Verified but unusable — `invalid_json`, `missing_meeting_id`,
            `invalid_meeting_id`, or `stale_delivery` (outside the ±24 h freshness
            window). Never a 5xx: a retry cannot fix any of them.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorError"
        "401":
          $ref: "#/components/responses/ConnectorDeliveryRejected"
        "429":
          $ref: "#/components/responses/ConnectorRateLimited"
        "503":
          $ref: "#/components/responses/ConnectorUnavailable"

  /api/connectors/webhooks/config:
    get:
      operationId: getConnectorWebhookConfig
      summary: Read the caller's background-sync config
      responses:
        "200":
          description: >-
            Current config. `enabled:false` with a null url/secret when never set up.
            `secret` is ALWAYS null here — it is returned only by a mint/rotate POST;
            use `hasSecret` to tell a configured connector from an unconfigured one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorWebhookConfig"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/ConnectorUnavailable"
    post:
      operationId: enableConnectorWebhook
      summary: Enable background sync (and rotate the routing token)
      description: >-
        Enabling clears the pending queue, the dead-letter and the abort flag for
        the address first, so re-enabling never replays the off-window. It does NOT
        clear the purge ledger — only DELETE /api/connectors/webhooks/purged does.
        A POST while already enabled is a read unless `rotate` is true or a
        different `source` is named. Rotation is deliberately hard-breaking: the old
        token stops resolving and the user must re-paste the URL.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                source:
                  type: string
                  enum: [fireflies]
                rotate:
                  type: boolean
                  default: false
      responses:
        "200":
          description: >-
            Background sync is enabled. A mint/rotate returns the delivery URL AND the derived
            secret — the only response that carries it. A no-op POST (already enabled, no
            `rotate`, same `source`) returns `secret: null` like `GET /config`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorWebhookEnabled"
        "400":
          description: "`unknown_source` — the source is not in the connector registry."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/ConnectorUnavailable"
    delete:
      operationId: disableConnectorWebhook
      summary: Disable background sync — the single idempotent teardown
      description: >-
        One call performs the whole teardown in the normative order: durable
        disabled marker, config + token delete, cache evictions, queue drop. Every
        crash point leaves a state the drain classifies as revoked. Retry the SAME
        call on a 503; there is never a second, different call to make. Under
        Option C the teardown touches NO delegation: the server holds no connector
        delegation, and the app's unrelated chat delegation — the one every
        authenticated TinyChat write depends on — is never removed by switching an
        optional connector off.
      responses:
        "200":
          description: Teardown complete.
          content:
            application/json:
              schema:
                type: object
                required: [status, queueDropped]
                properties:
                  status:
                    type: string
                    const: disabled
                  queueDropped:
                    type: integer
                    description: >-
                      Pending items discarded by the teardown, summed across every
                      registered source. Exact, not a lower bound: each count comes
                      from the clear itself, inside the per-address lock that makes
                      the delete atomic.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          description: >-
            `teardown_incomplete` — the disabled marker is already written, so the
            address is classified revoked. Retry this same idempotent call.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorError"

  /api/connectors/webhooks/pending:
    get:
      operationId: getConnectorWebhookPending
      summary: Pending queue, dead-letter and delivery rate-limit state
      responses:
        "200":
          description: Queue snapshot for the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorWebhookPending"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/ConnectorUnavailable"

  /api/connectors/webhooks/drain:
    post:
      operationId: drainConnectorWebhookQueue
      summary: Kick a drain for the caller and return the resulting queue snapshot
      description: >-
        Under Option C this is THE processing trigger — the authenticated
        user-visit drain. There is no post-delivery kick, no background drain and
        no stored connector delegation to gate it on; the only recurring backend
        job is a bounded TTL/dead-letter sweep that returns counts, never ids. It
        writes nothing to the user's space: the pending ids go back to the browser,
        which fetches each exact id with the user's own connector key, writes to
        the user's own space, and then settles them with POST
        /api/connectors/webhooks/ack. The response carries the DRAIN'S OWN surfaced
        list, not the raw queue: an aborted drain (revoked, ledger_unavailable)
        surfaces nothing and reports `surfaceBlocked`, because an id handed to the
        client resurrects the meeting just as surely as a server-side write would.
        A disabled address surfaces nothing either; a drain must never resurrect
        one. Forced kicks are floored per address — a repeat inside the floor
        returns the previous pass's result rather than re-reading the shared node.
        For an address enrolled in the dark backend-ingest cohort no drain pass runs
        at all: the backend fetch worker is the sole consumer of that queue, so the
        response surfaces nothing and reports `surfaceBlocked: backend_ingest`. Two
        consumers settling the same items is the double-drain race this excludes.
      responses:
        "200":
          description: Queue snapshot after the drain attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorWebhookPending"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          description: "`drain_unavailable` or `unavailable` — retryable."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorError"

  /api/connectors/webhooks/ack:
    post:
      operationId: acknowledgeConnectorWebhookItems
      summary: Settle queued ids the browser has already written to the user's space
      description: >-
        Under ingest shape C the BROWSER is the writer: it fetches the exact queued
        id with the user's own Fireflies key, writes SQL + KV into the user's own
        space, and only then calls this route. Ownership is derived from the session
        and the stored config — a body `address` is ignored and a body `source` may
        only confirm the configured one. Every id and kind is validated before
        anything is read or written, and one bad element rejects the whole batch.
        Only the exact `(meetingId, kind)` identities named are removed, so a
        summary item survives its transcript sibling's acknowledgement.
        Acknowledging an identity that is already gone SUCCEEDS — the browser stores
        the meeting and then acknowledges, so a lost response must converge on
        retry rather than duplicate the meeting. The disabled marker and the purge
        ledger are re-applied here: a revoked address and an unreadable or
        unparseable ledger settle nothing and report `surfaceBlocked`, and a
        tombstoned id is never counted as ingested. SUCCESSES ONLY in this version —
        `status` is accepted solely as the literal `done`, and no browser-supplied
        error string is read, logged or stored; a failed item stays queued until the
        retry schedule or the 14-day TTL deals with it. For an address enrolled in the
        dark backend-ingest cohort this route is an IDEMPOTENT NO-OP: the fetch worker
        owns that queue's removals, so nothing is settled and the counts come back
        zero rather than deleting an item the worker has not fetched yet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectorAckRequest"
      responses:
        "200":
          description: >-
            Settlement applied. The body is the caller's own queue snapshot plus the
            settlement counts — never another user's queue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorAckResult"
        "400":
          description: >-
            `invalid_body` (missing / empty / over-cap `items`, or a non-object
            entry), `invalid_meeting_id`, `invalid_kind`, `unsupported_ack_status`
            (only `done` is accepted), or `unknown_source`. Nothing is settled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/ConnectorUnavailable"

  /api/connectors/webhooks/purged:
    post:
      operationId: recordConnectorPurge
      summary: Record a purge — writes the tombstone ledger that suppresses resurrection
      description: >-
        The ledger is an AUTHORIZATION input (it suppresses writes), so this route
        carries the rigour of the delegation accept route: the address comes from
        the session and never the body, and every id goes through the shared
        meeting-id validator — one bad element rejects the whole call and nothing is
        written. `purgedThrough` advances monotonically; an older value never moves
        it backwards. The 200-id cap bounds `recentIds` (forensics) ONLY — the
        watermark tombstones a purge of any size, and an overflow is reported and
        logged, never silently truncated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectorPurgeRequest"
      responses:
        "200":
          description: >-
            Accepted with an overflow — more than 200 ids were submitted, so only
            the newest 200 are retained in `recentIds`. `purgedThrough` still
            covers every id, so nothing is left unprotected.
          content:
            application/json:
              schema:
                type: object
                required: [status, stored, dropped]
                properties:
                  status:
                    type: string
                    const: accepted
                  stored:
                    type: integer
                  dropped:
                    type: integer
        "204":
          description: >-
            Recorded. Also returned when background sync was never enabled for this
            address — an idempotent no-op.
        "400":
          description: >-
            `unknown_source`, `invalid_body`, `invalid_meeting_id`, or
            `invalid_purged_through` (unparseable or more than 24 h in the future).
            Nothing is written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/ConnectorUnavailable"
    delete:
      operationId: clearConnectorPurgeLedger
      summary: Clear the purge ledger — the explicit user-initiated re-sync
      description: >-
        Resets both `purgedThrough` and `recentIds`, so previously purged meetings
        become writable again. Fired by the reconnect / re-sync flow and by nothing
        else: never automatically on drain, never on enable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source]
              properties:
                source:
                  type: string
                  enum: [fireflies]
      responses:
        "204":
          description: Ledger cleared.
        "400":
          description: "`unknown_source` — the source is not in the connector registry."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/ConnectorUnavailable"

  # ── Google Meet OAuth proxy (WP-A) ───────────────────────────────────
  # The whole group mounts ONLY when GOOGLE_MEET_OAUTH_ENABLED=true. While the
  # flag is off every path below 404s, the same canary shape the connector
  # webhook group has. Two invariants hold across all five:
  #   1. The backend PERSISTS NOTHING. No KV, no SQL, no file, no in-process
  #      credential cache — it is a credential-shaped pipe between the SPA and
  #      Google, and the browser is the only place a Google token ever lands.
  #   2. The PKCE verifier never leaves the SPA. An authorization code
  #      intercepted anywhere on this surface is useless without it.
  /api/connectors/google/oauth/start:
    get:
      operationId: startGoogleOAuth
      summary: Redirect the consent popup to Google (public; no session, no token)
      description: >-
        A 302 to Google's authorize endpoint with the caller's `state` and PKCE
        `code_challenge` attached, plus `access_type=offline` and `prompt=consent`
        — both non-optional, because without either one Google mints no refresh
        token and the connector silently becomes single-session. Requests EXACTLY
        two scopes, `meetings.space.readonly` and `meetings.space.settings`; no
        Drive and no Calendar, which would pull the app into Restricted-scope
        verification. Unauthenticated by design: this is a top-level browser
        navigation and carries no Bearer, and CSRF exempts GET. The anti-forgery
        control is the `state` param, minted by the SPA and re-checked by it when
        the popup reports back. The server holds only the CHALLENGE, never the
        verifier, so it cannot complete an exchange on its own and has nothing to
        persist. Carries its own rate-limit bucket — an OAuth dance must not spend
        the global allowance /api/chat shares.
      security: []
      parameters:
        - name: state
          in: query
          required: true
          description: >-
            SPA-minted anti-forgery nonce, echoed back on the callback. A repeated
            `?state=` param is rejected rather than resolved to its first value.
          schema:
            type: string
            pattern: "^[A-Za-z0-9._~-]{16,512}$"
        - name: challenge
          in: query
          required: true
          description: >-
            RFC 7636 S256 code challenge — the base64url SHA-256 of a verifier the
            server never sees.
          schema:
            type: string
            pattern: "^[A-Za-z0-9._~-]{43,128}$"
      responses:
        "302":
          description: >-
            Redirect to Google's consent screen. `Location` only; the params are
            already in the URL the client is sent to.
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
        "400":
          description: >-
            `invalid_request` — a missing, duplicated, over-long or
            wrong-alphabet `state`/`challenge`. A shape check runs before
            anything else, so an absurd value is a 400 and never a redirect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleOAuthError"
        "429":
          $ref: "#/components/responses/GoogleOAuthRateLimited"

  /api/connectors/google/oauth/callback:
    get:
      operationId: googleOAuthCallback
      summary: Google's redirect target — hands {code, state} to the app origin (public)
      description: >-
        The tiny self-contained page the popup lands on. It runs one nonce'd inline
        script that postMessages `{code, state}` to the PINNED app origin — never
        `"*"`, never a token — and closes itself. Unauthenticated by necessity: a
        top-level navigation from Google carries no Bearer, so requiring one would
        401 the flow before the popup could report back. Harmless with it: the route
        holds no session, reads no store, and hands the code to exactly one origin,
        the same one the CORS allowlist is built from. A denial or a malformed return
        renders a cancelled page and postMessages NOTHING, which the SPA reads as
        cancelled. Responds `text/html` with `Cache-Control: no-store`,
        `Referrer-Policy: no-referrer` (the code is in this page's URL and must not
        ride a Referer anywhere), `X-Frame-Options: DENY`, `nosniff`, and a
        `default-src 'none'` CSP whose only executable script is the nonce'd one.
      security: []
      parameters:
        - name: code
          in: query
          required: false
          description: >-
            Google's authorization code. Absent on a denial. Length-bounded only —
            these carry `/` and `%`, so no alphabet pattern is defensible.
          schema:
            type: string
            maxLength: 2048
        - name: state
          in: query
          required: false
          description: The nonce handed to /start, echoed back for the SPA to re-check.
          schema:
            type: string
            pattern: "^[A-Za-z0-9._~-]{16,512}$"
      responses:
        "200":
          description: >-
            The relay page. Its script postMessages `{code, state}` to the pinned
            app origin and closes the popup.
          content:
            text/html:
              schema:
                type: string
        "400":
          description: >-
            No usable code — a denial (`?error=access_denied`) or a malformed
            return. Renders the cancelled page and posts no message at all.
          content:
            text/html:
              schema:
                type: string
        "429":
          $ref: "#/components/responses/GoogleOAuthRateLimited"

  /api/connectors/google/oauth/exchange:
    post:
      operationId: exchangeGoogleOAuthCode
      summary: Trade an authorization code + PKCE verifier for Google tokens
      description: >-
        Authenticated, and the first point in the flow where a token exists at all.
        The backend forwards code + verifier + client secret to Google's token
        endpoint and returns the payload to the caller — it stores NOTHING: no KV,
        no SQL, no in-process cache. The browser is the only place a Google token
        lands. The response is field-whitelisted rather than a passthrough, so the
        `id_token` some grants carry (a JWT with the user's Google email, name and
        picture) is dropped rather than handed to the SPA. A 4xx from Google is
        surfaced with ITS OWN status and code — `invalid_grant` means reconnect,
        `PERMISSION_DENIED` means not-your-meeting — because a flattened upstream
        error cannot tell those apart. Google's error text is preserved
        field-scoped and re-scrubbed of every secret the request carried.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleOAuthExchangeRequest"
      responses:
        "200":
          description: Google's token payload, field-whitelisted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleTokenResponse"
        "400":
          description: >-
            `invalid_request` for a missing or over-long field, or Google's own
            400 (`invalid_grant`, `invalid_client`) forwarded verbatim.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleOAuthError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/GoogleOAuthUpstreamRejected"
        "429":
          $ref: "#/components/responses/GoogleOAuthRateLimited"
        "500":
          description: >-
            `internal_error`. The cause is ours and its message is not guaranteed
            token-free, so no detail is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleOAuthError"
        "502":
          $ref: "#/components/responses/GoogleOAuthUpstreamUnavailable"

  /api/connectors/google/oauth/refresh:
    post:
      operationId: refreshGoogleOAuthToken
      summary: Mint a fresh access token from a browser-held refresh token
      description: >-
        The per-sync access-token mint. The BROWSER holds the refresh token and
        hands it in on each call; nothing is written on this side, which is the
        deliberate difference from the Fireflies connector, where the server holds
        the credential and rotates it in a store. Google usually omits
        `refresh_token` on a rotation, so the caller keeps the one it sent. Same
        upstream-error posture as /exchange: a 4xx arrives as itself so the UI can
        tell reconnect from back-off, and no token reaches a log or an error
        message.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleOAuthRefreshRequest"
      responses:
        "200":
          description: >-
            A fresh access token. `refresh_token` is usually absent — that is a
            rotation that did not happen, not a failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleTokenResponse"
        "400":
          description: >-
            `invalid_request` for a missing or over-long token, or Google's
            `invalid_grant` — the refresh token was revoked or expired and the
            user must reconnect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleOAuthError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/GoogleOAuthRateLimited"
        "500":
          description: "`internal_error` — no detail, for the reason /exchange states."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleOAuthError"
        "502":
          $ref: "#/components/responses/GoogleOAuthUpstreamUnavailable"

  /api/connectors/google/oauth/revoke:
    post:
      operationId: revokeGoogleOAuthToken
      summary: Revoke a Google token upstream on disconnect
      description: >-
        Upstream revocation, so a disconnect actually ends Google's grant instead
        of only forgetting the token locally. A failure is SURFACED, never
        swallowed — a revoke that silently did not happen is a lie to the user
        about what they just disconnected. Stateless like the rest of the group;
        the token arrives in the body, is used once, and is never stored or logged.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleOAuthRevokeRequest"
      responses:
        "200":
          description: Revoked upstream.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: revoked
        "400":
          description: "`invalid_request`, or Google's own 400 forwarded."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleOAuthError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/GoogleOAuthRateLimited"
        "500":
          description: "`internal_error` — no detail, for the reason /exchange states."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleOAuthError"
        "502":
          $ref: "#/components/responses/GoogleOAuthUpstreamUnavailable"

  /api/connectors/meetings:
    get:
      operationId: listConnectorMeetings
      summary: List the signed-in address's backend-ingested meetings (cohort only)
      description: >-
        The cohort's read API. Mounted only when the dark backend-ingest flag is
        armed, and 404 for every address that is not enrolled — a signed-in user
        outside the cohort cannot tell the surface exists. The tenant is ALWAYS the
        session address: no route here accepts an address, an account id or a token.
        STRICTLY SIDE-EFFECT-FREE — this GET writes nothing, stamps nothing and
        sweeps nothing. Fails closed: an unreadable archive answers 503, never an
        empty list that would render as "you have no meetings".
      parameters:
        - name: source
          in: query
          required: false
          schema:
            type: string
            enum: [fireflies]
        - name: limit
          in: query
          required: false
          description: >-
            1–200, default 50. Out of range is a 400 (`invalid_limit`), never a
            silent clamp.
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: cursor
          in: query
          required: false
          description: >-
            The `nextCursor` of the previous page. A cursor whose row is gone
            (retention swept it between pages) is a 400 (`invalid_cursor`), never a
            silent restart at page 1.
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{1,64}$"
        - name: reconciled
          in: query
          required: false
          description: >-
            The browser reconcile queue. `false` returns only the rows this space
            has not copied into the user's own storage yet, `true` only the rows it
            has; omitted returns both. Any other value is a 400
            (`invalid_reconciled`) — a silently ignored filter would hand the
            browser the whole archive to re-copy on every run. Filtering happens
            before paging, so `cursor` addresses the filtered set.
          schema:
            type: string
            enum: ["true", "false"]
      responses:
        "200":
          description: The caller's own meetings, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorMeetingList"
        "400":
          description: "`invalid_limit`, `invalid_cursor` or `invalid_reconciled`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: >-
            The flag is dark or the address is not in the cohort. Deliberately
            indistinguishable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorError"
        "503":
          $ref: "#/components/responses/ConnectorUnavailable"

  /api/connectors/meetings/{source}/{sourceId}:
    get:
      operationId: readConnectorMeeting
      summary: Read one backend-ingested meeting's content (cohort only)
      description: >-
        Decrypted inside the TEE and returned to its owner. Also strictly
        side-effect-free. A meeting id that belongs to another address is simply
        `not_found`; the id is never echoed back on the 404, and no internal error
        text ever reaches the caller.
      parameters:
        - name: source
          in: path
          required: true
          schema:
            type: string
            enum: [fireflies]
        - name: sourceId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{1,64}$"
      responses:
        "200":
          description: >-
            The meeting. Either half may be absent — a summary stored without a
            transcript is a complete row, not an error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorMeetingContent"
        "400":
          description: "`invalid_meeting_id` — refused before any store call."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: >-
            No such meeting for THIS address, an unknown source, a dark flag, or a
            non-cohort address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorError"
        "503":
          $ref: "#/components/responses/ConnectorUnavailable"

  /api/connectors/meetings/{source}/{sourceId}/reconciled:
    post:
      operationId: markConnectorMeetingReconciled
      summary: Stamp a meeting as copied into the user's own space (cohort only)
      description: >-
        The reconcile-ack, and the ONE mutating route of the meetings surface. The
        browser calls it AFTER the user-space write succeeded (storage-before-ack),
        so a stamp always trails a durable write and never leads it. Idempotent — a
        lost response is retried and the retry is a success. The server copy is
        RETAINED: reconciling does not shorten retention, because a second device
        that has not reconciled still has to be able to read the meeting.
      parameters:
        - name: source
          in: path
          required: true
          schema:
            type: string
            enum: [fireflies]
        - name: sourceId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{1,64}$"
      responses:
        "200":
          description: Stamped (or already stamped).
          content:
            application/json:
              schema:
                type: object
                required: [reconciled, source, sourceId]
                properties:
                  reconciled:
                    type: boolean
                    const: true
                  source:
                    type: string
                  sourceId:
                    type: string
        "400":
          description: "`invalid_meeting_id`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: >-
            No such meeting for this address, a dark flag, or a non-cohort address.
            Nothing is stamped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorError"
        "503":
          description: >-
            The stamp did not land. Reported as a failure rather than a
            `reconciled: true` the store never made.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorError"

  /api/transcriber/meetings:
    get:
      operationId: listTranscriberMeetings
      summary: The signed-in address's transcriber meetings, newest first
      description: >-
        Settings → Transcriber. Mounted only when TRANSCRIPTION_API_URL and
        TRANSCRIPTION_API_KEY are set (otherwise 404, and the card says so). The
        backend proxies the TinyCloud Private Transcription API with a project key
        the browser never sees; the tenant is ALWAYS the session address. Each
        row's status is refreshed upstream on read; a row whose upstream read
        failed is returned as `{id, unavailable: true}` rather than dropped.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The meetings
          content:
            application/json:
              schema:
                type: object
                required: [meetings]
                properties:
                  meetings:
                    type: array
                    items:
                      oneOf:
                        - $ref: "#/components/schemas/TranscriberMeeting"
                        - $ref: "#/components/schemas/TranscriberUnavailableMeeting"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/TranscriberUnavailable"
    post:
      operationId: createTranscriberMeeting
      summary: Send a notetaker bot to a meeting link
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [meeting_url]
              properties:
                meeting_url:
                  type: string
                  format: uri
                bot_name:
                  type: string
                  maxLength: 64
                language:
                  type: string
                  description: BCP-47-ish, e.g. `en` or `en-US`.
      responses:
        "201":
          description: "The meeting, with status queued"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriberMeeting"
        "400":
          description: >-
            `invalid_meeting_url` (refused before upstream is called), or the
            upstream taxonomy code (e.g. `unsupported_platform`) with a message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriberError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/TranscriberUnavailable"

  /api/transcriber/meetings/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: "^[A-Za-z0-9_-]{1,64}$"
    get:
      operationId: getTranscriberMeeting
      summary: One meeting (owner only; anyone else's id is not_found)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The meeting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriberMeeting"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/TranscriberNotFound"
        "503":
          $ref: "#/components/responses/TranscriberUnavailable"
    delete:
      operationId: deleteTranscriberMeeting
      summary: Forget the meeting here and delete it upstream (transcript included)
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Gone
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/TranscriberNotFound"
        "503":
          $ref: "#/components/responses/TranscriberUnavailable"

  /api/transcriber/meetings/{id}/stop:
    post:
      operationId: stopTranscriberMeeting
      summary: Ask the bot to leave (idempotent)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The new status
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id:
                    type: string
                  status:
                    $ref: "#/components/schemas/TranscriberMeetingStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/TranscriberNotFound"
        "503":
          $ref: "#/components/responses/TranscriberUnavailable"

  /api/transcriber/meetings/{id}/transcript:
    get:
      operationId: getTranscriberTranscript
      summary: The speaker-attributed transcript, or 202 while it is still being prepared
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The transcript
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriberTranscript"
        "202":
          description: Not ready yet
          content:
            application/json:
              schema:
                type: object
                required: [meeting_id, status]
                properties:
                  meeting_id:
                    type: string
                  status:
                    $ref: "#/components/schemas/TranscriberMeetingStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/TranscriberNotFound"
        "503":
          $ref: "#/components/responses/TranscriberUnavailable"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Backend session token returned by SIWE verification.

  schemas:
    TranscriberMeetingStatus:
      type: string
      enum:
        - queued
        - joining
        - waiting_for_admission
        - in_progress
        - processing
        - completed
        - failed
        - cancelled
    TranscriberMeeting:
      type: object
      required: [id, status, platform, meeting_url, created_at]
      properties:
        id:
          type: string
        status:
          $ref: "#/components/schemas/TranscriberMeetingStatus"
        platform:
          type: string
        meeting_url:
          type: string
        bot:
          type: object
          properties:
            name:
              type: string
            joined_at:
              type: [string, "null"]
        created_at:
          type: string
        started_at:
          type: [string, "null"]
        ended_at:
          type: [string, "null"]
        error:
          type: [object, "null"]
          properties:
            type:
              type: string
            code:
              type: string
            message:
              type: string
    TranscriberUnavailableMeeting:
      type: object
      required: [id, unavailable]
      properties:
        id:
          type: string
        unavailable:
          type: boolean
          const: true
    TranscriberTranscript:
      type: object
      required: [meeting_id, status]
      properties:
        meeting_id:
          type: string
        status:
          $ref: "#/components/schemas/TranscriberMeetingStatus"
        language:
          type: string
        duration_seconds:
          type: number
        speakers:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
        segments:
          type: array
          items:
            type: object
            required: [id, speaker_id, speaker_name, start, end, text]
            properties:
              id:
                type: string
              speaker_id:
                type: string
              speaker_name:
                type: string
              start:
                type: number
              end:
                type: number
              text:
                type: string
        text:
          type: string
    TranscriberError:
      type: object
      required: [error]
      properties:
        error:
          type: string
        message:
          type: string
    ApiError:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string

    PaywallError:
      type: object
      required: [error, message, tier]
      properties:
        error:
          type: string
          enum: [model_not_allowed, credit_budget_exceeded]
        message:
          type: string
        tier:
          type: string
          enum: [free, plus, pro]
        requiredTier:
          type: string
          enum: [plus, pro]
          description: Present for model_not_allowed — the tier needed for the model.
        usage:
          $ref: "#/components/schemas/UsageInfo"

    Manifest:
      type: object
      required: [manifest_version, app_id, name, defaults, permissions]
      properties:
        manifest_version:
          type: integer
          const: 1
        app_id:
          type: string
        name:
          type: string
        description:
          type: string
        defaults:
          type: boolean
          const: false
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
      additionalProperties: true

    Permission:
      type: object
      required: [service, path, actions]
      properties:
        service:
          type: string
        space:
          type: string
        path:
          type: string
        actions:
          type: array
          items:
            type: string
        skipPrefix:
          type: boolean
        description:
          type: string

    ServerInfo:
      type: object
      required: [did, status, name, expiry, permissions, policyHash]
      properties:
        did:
          type: string
        status:
          type: string
        name:
          type: string
        expiry:
          type: string
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        policyHash:
          type: string
          pattern: "^[a-f0-9]{64}$"

    DelegationStatus:
      type: string
      enum: [active, expired, none, stale]

    DelegationResponse:
      type: object
      required: [status, expiresAt]
      properties:
        status:
          $ref: "#/components/schemas/DelegationStatus"
        expiresAt:
          type:
            - string
            - "null"
          format: date-time
        verified:
          type: boolean
          description: >-
            Whether the stored delegation's `att` has been cryptographically verified. Present
            and `false` on every `active` response today: the §9.2 verification chokepoint does
            not exist yet, so `active` means stored, unexpired and addressed to this backend —
            the resources, delegator and expiry behind it all come from the bundle's unsigned
            top-level fields. Additive on purpose; the `status` enum is unchanged.

    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string

    ChatRequest:
      type: object
      required: [messages]
      properties:
        model:
          type: string
          description: "RedPill model ID (e.g. openai/gpt-5-mini). Defaults to REDPILL_DEFAULT_MODEL."
        messages:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ChatMessage"

    ModelInfo:
      type: object
      required: [id, allowed, creditsPerKInput, creditsPerKOutput, multiplier]
      properties:
        id:
          type: string
        allowed:
          type: boolean
          description: Whether the calling user's tier may call this model.
        requiredTier:
          type: string
          enum: [plus, pro]
          description: Lowest tier that can call this model, present only when not allowed.
        creditsPerKInput:
          type: number
          description: Credits charged per 1,000 input tokens (ladder-snapped; spec §2.2).
        creditsPerKOutput:
          type: number
          description: Credits charged per 1,000 output tokens (ladder-snapped; spec §2.2).
        multiplier:
          type: number
          description: Picker-badge multiplier relative to REDPILL_DEFAULT_MODEL's output rate (spec §2.4).

    ModelsResponse:
      type: object
      required: [models]
      properties:
        models:
          type: array
          items:
            $ref: "#/components/schemas/ModelInfo"

    BackendSelfAttestation:
      type: object
      required: [quote, event_log, report_data, identity, info]
      properties:
        quote:
          type: string
          description: TDX quote returned by the dstack guest agent.
        event_log:
          type: string
          description: Verbatim dstack event log used for RTMR replay.
        report_data:
          type: string
          pattern: "^[a-f0-9]{64}$"
          description: SHA-256(prefix || backend address || nonce), before dstack zero-padding.
        identity:
          type: object
          required: [did, address, nonce, nonce_signature]
          properties:
            did:
              type: string
            address:
              type: string
              pattern: "^0x[0-9a-fA-F]{40}$"
            nonce:
              type: string
              pattern: "^[0-9a-f]{64}$"
            nonce_signature:
              type: string
              description: EIP-191 signature over tinychat-backend-attest-v1:<nonce>.
        info:
          type: object
          required: []
          properties:
            app_id:
              type: string
            instance_id:
              type: string
            compose_hash:
              type: string
            app_compose:
              type: string
            os_image_hash:
              type: string

    TierInfo:
      type: object
      required: [id, name, priceMonthly, priceYearly, creditBudget, budgetWindow, modelPatterns]
      properties:
        id:
          type: string
          enum: [free, plus, pro]
        name:
          type: string
        priceMonthly:
          type:
            - integer
            - "null"
          description: Display price in integer cents (divide by 100 for dollars). Null for free.
        priceYearly:
          type:
            - integer
            - "null"
          description: Display price in integer cents (divide by 100 for dollars). Null for free.
        creditBudget:
          type: integer
          description: >-
            Credit allowance per budget window. Free is per UTC day; paid tiers
            are per anchored week (7 days from the subscriber's billing-cycle
            anchor). Resolved with CREDIT_BUDGET_FREE / CREDIT_BUDGET_PLUS_WEEKLY
            / CREDIT_BUDGET_PRO_WEEKLY env overrides.
        budgetWindow:
          type: string
          enum: [day, week]
        modelPatterns:
          type: array
          items:
            type: string

    RateInfo:
      type: object
      required: [id, creditsPerKInput, creditsPerKOutput, multiplier]
      properties:
        id:
          type: string
        creditsPerKInput:
          type: number
        creditsPerKOutput:
          type: number
        multiplier:
          type: number
          description: Picker-badge multiplier relative to the baseline model's output rate.

    RatesResponse:
      type: object
      required: [baseline, models]
      properties:
        baseline:
          type: string
          description: Model id used as the multiplier baseline (REDPILL_DEFAULT_MODEL).
        models:
          type: array
          items:
            $ref: "#/components/schemas/RateInfo"

    BillingConfig:
      type: object
      required: [paywallEnabled, tiers]
      properties:
        paywallEnabled:
          type: boolean
        tiers:
          type: array
          items:
            $ref: "#/components/schemas/TierInfo"

    UsageInfo:
      type: object
      required: [used, limit, resetsAt]
      properties:
        used:
          type: integer
        limit:
          type: integer
        resetsAt:
          type: string
          format: date-time
          description: >-
            Next budget-window boundary. Free: the next UTC day boundary. Paid:
            the next anchored-week boundary (subscriber's billing-cycle anchor
            plus an integer number of 7-day periods).

    SubscriptionInfo:
      type: object
      required: [status, interval, currentPeriodEnd, anchor]
      properties:
        status:
          type: string
        interval:
          type:
            - string
            - "null"
          enum: [monthly, yearly, null]
        currentPeriodEnd:
          type:
            - string
            - "null"
          format: date-time
        anchor:
          type:
            - string
            - "null"
          format: date-time
          description: >-
            Stripe billing-cycle anchor (subscription-stable across renewals).
            Paid tiers' weekly windows are measured as 7-day periods from this
            instant. Null for free tier.

    BillingStatus:
      type: object
      required: [tier, usage, subscription]
      properties:
        tier:
          type: string
          enum: [free, plus, pro]
        usage:
          $ref: "#/components/schemas/UsageInfo"
        subscription:
          oneOf:
            - $ref: "#/components/schemas/SubscriptionInfo"
            - type: "null"

    CheckoutRequest:
      type: object
      required: [tier, interval]
      properties:
        tier:
          type: string
          enum: [plus, pro]
        interval:
          type: string
          enum: [monthly, yearly]

    CheckoutResponse:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri

    # ── Connector webhooks ──────────────────────────────────────────────
    ConnectorError:
      type: object
      description: >-
        Connector-route error body. Only `error` is guaranteed — the public
        delivery route deliberately carries no detail beyond the code.
      required: [error]
      properties:
        error:
          type: string
        message:
          type: string

    ConnectorDelivery:
      type: object
      description: >-
        The provider payload. Both the current (`eventType`/`meetingId`) and legacy
        (`event`/`meeting_id`) key spellings are accepted. `timestamp` is checked
        against the ±24 h freshness window when present and parseable; the legacy
        shape carries none and stays indefinitely replayable — a recorded
        consequence.
      additionalProperties: true
      properties:
        eventType:
          type: string
          enum: ["Transcription completed", "meeting.transcribed", "meeting.summarized"]
        event:
          type: string
        meetingId:
          type: string
          pattern: "^[A-Za-z0-9_-]{1,64}$"
        meeting_id:
          type: string
          pattern: "^[A-Za-z0-9_-]{1,64}$"
        timestamp:
          type: string

    ConnectorWebhookConfig:
      type: object
      required: [enabled, disabledAt, source, url, secret, hasSecret, createdAt]
      properties:
        enabled:
          type: boolean
          description: >-
            False whenever a durable disabled marker stands, even over a surviving
            config — a teardown crash artifact the drain classifies as revoked, and
            the card must agree.
        disabledAt:
          type: [string, "null"]
          format: date-time
        source:
          type: [string, "null"]
        url:
          type: [string, "null"]
          description: >-
            The delivery URL the user pastes into their provider dashboard. Its origin is
            pinned by CONNECTOR_WEBHOOK_PUBLIC_ORIGIN, not derived from the request's Host
            header; unpinned, the host is request-derived and the scheme is forced to https
            for any routable host.
        secret:
          type: [string, "null"]
          description: >-
            Per-user signing secret, derived from the token — never the HMAC master.
            Returned ONLY by a mint/rotate `POST /config`; `null` on `GET /config` and on a
            no-op POST. §3.8/T11 show it once behind a reveal, and it cannot be rotated without
            rotating the token, so it does not ride a poll.
        hasSecret:
          type: boolean
          description: Whether a delivery secret exists, so the card renders without re-reading it.
        createdAt:
          type: [string, "null"]
          format: date-time

    ConnectorWebhookEnabled:
      allOf:
        - $ref: "#/components/schemas/ConnectorWebhookConfig"
        - type: object
          required: [status, rotated]
          properties:
            status:
              type: string
              const: enabled
            rotated:
              type: boolean
              description: True when a new token was minted, invalidating the previous URL.

    ConnectorPendingItem:
      type: object
      required: [meetingId, kind, receivedAt, attempts, nextAttemptAt]
      properties:
        meetingId:
          type: string
          pattern: "^[A-Za-z0-9_-]{1,64}$"
        kind:
          type: string
          enum: [transcript, summary]
        receivedAt:
          type: string
          format: date-time
        attempts:
          type: integer
        nextAttemptAt:
          type: string
          format: date-time
        lastError:
          type: string
          description: Short code only — never a payload fragment.

    ConnectorDeadItem:
      allOf:
        - $ref: "#/components/schemas/ConnectorPendingItem"
        - type: object
          required: [deadAt]
          properties:
            deadAt:
              type: string
              format: date-time

    ConnectorWebhookPending:
      type: object
      required:
        [enabled, disabledAt, source, deliveriesRateLimited, count, pending, deadCount, dead]
      properties:
        enabled:
          type: boolean
        disabledAt:
          type: [string, "null"]
          format: date-time
        source:
          type: [string, "null"]
        deliveriesRateLimited:
          type: boolean
          description: >-
            True while the caller's per-token delivery bucket is tripped. A tripped
            bucket is a card state, never silence.
        count:
          type: integer
        pending:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorPendingItem"
        deadCount:
          type: integer
        dead:
          type: array
          description: Dead-letter, capped at 50, surfaced so "why didn't this arrive" is answerable.
          items:
            $ref: "#/components/schemas/ConnectorDeadItem"
        surfaceBlocked:
          type: string
          enum:
            [
              revoked,
              ledger_unavailable,
              delegation_unusable,
              drain_aborted,
              drain_unreported,
              backend_ingest,
            ]
          description: >-
            Present ONLY when the surfacing gate refused to hand back ids, in which case
            `count` is 0 and `pending`/`dead` are empty. Under Option C the server writes
            nothing, so surfacing an id resurrects the meeting just as surely as a write would
            (§4.7/§6.2/§12a R3) — a standing disabled marker, an unreadable or unparseable
            purge ledger, and an aborted drain all surface nothing. `delegation_unusable` is
            retained in the enum as an unwired Option-A seam and is not emitted by the shipped
            gateless drain; clients must still handle it rather than assume the set shrank.
            `backend_ingest` means this address's queue is consumed by the backend fetch worker
            rather than by the browser (the dark backend-ingest flag plus a per-address cohort
            allowlist): the browser has nothing to drain or settle, and its meetings come from
            the authenticated read API instead. It is not an error state.
            Absent on the ordinary path.
            The client renders this as a card state; treating it as "nothing pending" is the
            silence §4.4 forbids.

    ConnectorAckRequest:
      type: object
      required: [items]
      description: >-
        There is deliberately no `address` property: ownership comes from the
        session. `source` is optional and may only confirm the caller's configured
        source.
      properties:
        source:
          type: string
          enum: [fireflies]
        items:
          type: array
          minItems: 1
          maxItems: 200
          description: >-
            The identities the browser has already stored. Every element must
            validate or the whole call is rejected — an over-cap batch is a 400,
            never a silent truncation.
          items:
            type: object
            required: [meetingId, kind]
            properties:
              meetingId:
                type: string
                pattern: "^[A-Za-z0-9_-]{1,64}$"
              kind:
                type: string
                enum: [transcript, summary]
              status:
                type: string
                const: done
                description: >-
                  Optional, and only `done` is accepted. Browser-reported terminal
                  failures are not settled in this version: they stay queued until
                  retry or TTL, and no error string is accepted into logs.

    ConnectorAckResult:
      allOf:
        - $ref: "#/components/schemas/ConnectorWebhookPending"
        - type: object
          required: [status, acknowledged, alreadySettled, tombstoned]
          properties:
            status:
              type: string
              const: acknowledged
            acknowledged:
              type: integer
              description: Identities removed from the pending queue by this call.
            alreadySettled:
              type: integer
              description: >-
                Identities that were already gone — the lost-response retry, which is
                a success and not an error.
            tombstoned:
              type: integer
              description: >-
                Identities covered by the purge ledger. They are NOT settled and NOT
                counted as ingested; an acknowledgement must not re-classify purged
                work.

    ConnectorPurgeRequest:
      type: object
      required: [source, ids]
      properties:
        source:
          type: string
          enum: [fireflies]
        ids:
          type: array
          description: >-
            Purged meeting ids. Every element must validate or the whole call is
            rejected. More than 200 is accepted with a reported `dropped` count —
            only `recentIds` is capped, never the protection.
          items:
            type: string
            pattern: "^[A-Za-z0-9_-]{1,64}$"
        purgedThrough:
          type: string
          format: date-time
          description: >-
            Watermark to advance to; defaults to now. Rejected when unparseable or
            more than 24 h in the future, and never moved backwards.

    # ── Backend-ingest read API (cohort only) ───────────────────────────
    ConnectorMeetingMeta:
      type: object
      description: >-
        One stored meeting's METADATA. The transcript and the summary never ride
        this shape — they are read one meeting at a time from the content route.
        A partial row is legal and complete: `hasTranscript` / `hasSummary` say
        which half has arrived, because a summary can arrive before, or entirely
        without, its transcript.
      required: [sourceId, sizeBytes, storedAt, updatedAt, hasTranscript, hasSummary]
      properties:
        sourceId:
          type: string
          pattern: "^[A-Za-z0-9_-]{1,64}$"
        title:
          type: string
        ts:
          type: string
          description: The provider's own meeting timestamp, when it gave one.
        transcriptStoredAt:
          type: string
          format: date-time
        summaryStoredAt:
          type: string
          format: date-time
        reconciledAt:
          type: string
          format: date-time
          description: >-
            Stamped by the reconcile-ack after the browser wrote the meeting into
            the user's OWN space. The server copy is retained regardless — a
            second device still has to be able to read it.
        sizeBytes:
          type: integer
        storedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        hasTranscript:
          type: boolean
        hasSummary:
          type: boolean

    ConnectorMeetingList:
      type: object
      required: [source, meetings, nextCursor, hasMore]
      properties:
        source:
          type: string
          enum: [fireflies]
        meetings:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorMeetingMeta"
        nextCursor:
          type: [string, "null"]
          description: >-
            The last `sourceId` on this page, or null when there is no next page.
            A truncated page always says so — there is no silent truncation.
        hasMore:
          type: boolean

    ConnectorMeetingContent:
      type: object
      required: [source, sourceId, meta, content]
      properties:
        source:
          type: string
          enum: [fireflies]
        sourceId:
          type: string
          pattern: "^[A-Za-z0-9_-]{1,64}$"
        meta:
          $ref: "#/components/schemas/ConnectorMeetingMeta"
        content:
          type: object
          description: >-
            The provider halves, decrypted inside the TEE for their owner. Either
            may be absent. Only these two keys are projected — a stored value never
            becomes an arbitrary response body.
          properties:
            transcript: {}
            summary: {}

    # ── Google Meet OAuth proxy (WP-A) ─────────────────────────────────
    GoogleOAuthExchangeRequest:
      type: object
      description: >-
        The authorization code and the PKCE verifier that proves the same client
        began the dance. Both are single-use and neither is stored anywhere.
      required: [code, verifier]
      properties:
        code:
          type: string
          maxLength: 2048
          description: Google's authorization code, exactly as the callback page relayed it.
        verifier:
          type: string
          maxLength: 128
          description: >-
            The RFC 7636 verifier whose S256 hash was sent to /start. It lives in
            SPA memory for the length of the dance and is never persisted.

    GoogleOAuthRefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          maxLength: 4096
          description: >-
            The browser's own refresh token. The server does not hold a copy — it
            is presented per call and forgotten when the response is written.

    GoogleOAuthRevokeRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          maxLength: 4096
          description: The access or refresh token to revoke upstream.

    GoogleTokenResponse:
      type: object
      description: >-
        Google's token payload, FIELD-WHITELISTED on the way out. Deliberately not
        a passthrough: an `id_token` (a JWT carrying the user's Google email, name
        and picture) rides along on some grants and this connector has no business
        handing that to the SPA. Only what a sync needs is here.
      required: [access_token]
      properties:
        access_token:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer
          description: Seconds until the access token expires.
        refresh_token:
          type: string
          description: >-
            Present on the initial exchange (thanks to `access_type=offline` plus
            `prompt=consent`) and usually ABSENT on a refresh — the caller keeps
            the one it sent.
        scope:
          type: string

    GoogleOAuthError:
      type: object
      description: >-
        Google's structured failure, preserved rather than flattened. `error` is
        what the UI branches on — `invalid_grant` means reconnect,
        `PERMISSION_DENIED` means not-your-meeting, `slow_down` means back off —
        and a proxy that collapsed all three into one message could not tell them
        apart. Both strings are bounded, control-stripped and re-scrubbed of every
        secret the request carried, so no upstream body can turn into a token in a
        log line. Local sentinels: `invalid_request` (shape check), `network_error`,
        `invalid_response`, `internal_error`.
      required: [error]
      properties:
        error:
          type: string
        error_description:
          type: string
          maxLength: 200
        upstream_status:
          type: integer
          description: >-
            Google's own HTTP status, kept even when this response's status differs
            (a Google 5xx is answered 502). 0 means the request never completed.

  responses:
    TranscriberNotFound:
      description: No such meeting for this address
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TranscriberError"
    TranscriberUnavailable:
      description: The transcription API (or the index) could not be reached
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TranscriberError"
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthenticated:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    DelegationRequired:
      description: Active delegation required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    StoreError:
      description: Delegated storage operation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    UpstreamError:
      description: Upstream LLM API error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    BillingNotConfigured:
      description: Billing/Stripe is not configured on this server
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    PaymentRequired:
      description: Subscription required — model not allowed or credit budget exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PaywallError"
    ConnectorDeliveryRejected:
      description: >-
        `invalid_signature` — returned identically for an unknown source, a
        malformed or unknown token, and a bad signature, so the route is not an
        oracle for any of them.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ConnectorError"
    ConnectorRateLimited:
      description: "`rate_limited` — an IP, (ip, token) or per-token bucket is tripped."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ConnectorError"
    ConnectorUnavailable:
      description: "`unavailable` — a backend store call failed. Retry the same request."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ConnectorError"
    GoogleOAuthRateLimited:
      description: >-
        The OAuth proxy's own per-IP bucket is tripped. Separate from the global
        one on purpose, in both directions: a consent dance must not spend
        /api/chat's allowance, and an unauthenticated /start or /callback must not
        be free.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GoogleOAuthError"
    GoogleOAuthUpstreamRejected:
      description: >-
        Google refused with its own 4xx, forwarded at the SAME status —
        `PERMISSION_DENIED` (not your meeting) is the one that matters here.
        Re-consenting will not fix it; the user needs access, not a reconnect.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GoogleOAuthError"
    GoogleOAuthUpstreamUnavailable:
      description: >-
        The proxy could not complete the upstream call — a Google 5xx, a timeout,
        an unparseable body. Answered 502 rather than passed through, because the
        client should RETRY rather than send the user back through consent.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GoogleOAuthError"
