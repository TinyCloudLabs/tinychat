name: Deploy production

# The only production deploy path: backend (Phala CVM, api.tinycloud.chat) first, then web (Cloudflare Pages,
# tinycloud.chat), and web only if the backend deploy succeeded or was not requested.
#
# - Stable releases: the Release workflow dispatches this on the stable version commit (ref = the new
#   @tinychat/backend@X.Y.Z or @tinychat/frontend@X.Y.Z tag) for the units that got a stable version. Beta versions
#   and ordinary pushes to main deploy nothing to production.
# - Hotfix or redeploy: gh workflow run deploy-production.yml --ref <tag or branch> [-f backend=false] [-f web=false]
#
# Web deploys by advancing the `production` branch, which the Cloudflare Pages Git integration builds as
# production with the dashboard's build settings and variables; this workflow then waits for that build and checks
# tinycloud.chat serves it. main only gets Pages preview builds.

on:
  workflow_dispatch:
    inputs:
      backend:
        description: Deploy the backend to Phala (api.tinycloud.chat)
        type: boolean
        default: true
      web:
        description: Deploy the web app to Cloudflare Pages production (tinycloud.chat), after the backend
        type: boolean
        default: true

concurrency:
  group: tinychat-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  target:
    name: Target
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      label: ${{ steps.target.outputs.label }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Describe the deploy target
        id: target
        env:
          BACKEND: ${{ inputs.backend }}
          WEB: ${{ inputs.web }}
        run: |
          if [ "$BACKEND" != true ] && [ "$WEB" != true ]; then
            echo "::error::Nothing to deploy: set backend and/or web"
            exit 1
          fi
          # Stable release tags on this commit; anything else is a hotfix deploy of an unreleased commit.
          tags=$(git tag --points-at HEAD | grep -E '^@tinychat/(backend|frontend)@[0-9]+\.[0-9]+\.[0-9]+$' | sort | tr '\n' ' ' | sed 's/ $//' || true)
          if [ -n "$tags" ]; then
            label="$tags"
          else
            label="hotfix $(git rev-parse --short HEAD) from $GITHUB_REF_NAME"
            echo "::warning::No stable @tinychat/* release tag points at $GITHUB_SHA: this is a hotfix deploy of $GITHUB_REF_NAME"
          fi
          echo "label=$label" >> "$GITHUB_OUTPUT"
          {
            echo "## Production deploy: $label"
            echo
            echo "- Commit: \`$GITHUB_SHA\` ($GITHUB_REF)"
            echo "- Backend: $BACKEND ($(jq -r .version backend/package.json)), then web: $WEB ($(jq -r .version frontend/package.json))"
          } >> "$GITHUB_STEP_SUMMARY"

  backend:
    name: Backend
    needs: target
    if: inputs.backend
    uses: ./.github/workflows/deploy-backend-phala.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write
      statuses: write

  web:
    name: Web (Cloudflare Pages)
    needs: [target, backend]
    if: ${{ !cancelled() && inputs.web && needs.target.result == 'success' && (needs.backend.result == 'success' || needs.backend.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write # advance the production branch
      checks: read # read the Cloudflare Pages check run
    env:
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create the production deploy commit
        id: commit
        env:
          LABEL: ${{ needs.target.outputs.label }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/release/pages-production-commit.mjs --label "$LABEL" --body "Run $RUN_URL"

      # A plain push: it only fast-forwards production, and fails loudly if production moved meanwhile.
      - name: Push the production branch
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.commit.outputs.commit }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$auth" push origin "$COMMIT:refs/heads/production"

      - name: Wait for Cloudflare Pages and verify tinycloud.chat
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.commit.outputs.commit }}
          PRODUCTION_URL: ${{ vars.TINYCHAT_FRONTEND_URL || 'https://tinycloud.chat' }}
        run: node scripts/release/pages-production-verify.mjs --commit "$COMMIT" --url "$PRODUCTION_URL"
