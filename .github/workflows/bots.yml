name: Bots service

# The bots service (bots/) is a standalone package with its own lockfile: its unit tests (service auth, owner
# isolation, sandbox mounts, gateway allow/deny and budgets, turn events) and its typecheck run on every PR that
# touches it. The Docker + gVisor smoke (bots/test/smoke.sh) needs a privileged-capable Docker host and runs by hand.

on:
  pull_request:
    paths:
      - "bots/**"
      - ".github/workflows/bots.yml"

permissions:
  contents: read

concurrency:
  group: bots-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bots:
    name: Bots service tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bots
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-bots-${{ runner.os }}-${{ hashFiles('bots/bun.lock') }}
      - name: Install
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun test src

      - name: Typecheck
        run: bunx tsc --noEmit
