name: Native build inputs

# Shared by the native CI callers; releases and merge queues never select paths.
on:
  workflow_call:
    outputs:
      native:
        value: ${{ jobs.changes.outputs.native }}
      frontend:
        value: ${{ jobs.changes.outputs.frontend }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.diff.outputs.native }}
      frontend: ${{ steps.diff.outputs.frontend }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        name: Select native and WebKit inputs
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT" != pull_request ]]; then
            printf 'native=true\nfrontend=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Compare the whole PR, including both sides of renames. A failed diff fails the job.
          git diff --no-renames --name-only -z "$BASE...$HEAD" > "$RUNNER_TEMP/native-paths"
          native=false
          frontend=false
          while IFS= read -r -d '' path; do
            case "$path" in
              frontend/*|packages/*|patches/*|scripts/*|test/*|.github/*|package.json|bun.lock|bun.lockb|bunfig.toml|turbo.json|tsconfig*|.env*|.npmrc|.node-version|.tool-versions)
                native=true; frontend=true ;;
              ios/*|android/*|mobile/*|desktop/*|Cargo.toml|Cargo.lock|rust-toolchain*|.cargo/*|Podfile*|Package.resolved)
                native=true ;;
            esac
          done < "$RUNNER_TEMP/native-paths"
          printf 'native=%s\nfrontend=%s\n' "$native" "$frontend" >> "$GITHUB_OUTPUT"
          printf 'Native inputs: %s; frontend/WebKit inputs: %s\n' "$native" "$frontend" >> "$GITHUB_STEP_SUMMARY"
