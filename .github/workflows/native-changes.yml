name: Native build inputs

# Shared by the native CI callers; releases and merge queues never select paths.
on:
  workflow_call:
    inputs:
      component:
        description: Build input set (native, desktop, mobile, metal or webkit)
        type: string
        default: native
    outputs:
      native:
        value: ${{ jobs.changes.outputs.native }}
      frontend:
        value: ${{ jobs.changes.outputs.frontend }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.diff.outputs.native }}
      frontend: ${{ steps.diff.outputs.frontend }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test native build input selection
        if: github.event_name == 'pull_request'
        run: python3 .github/scripts/test-native-changes.py
      - id: diff
        name: Select native and WebKit inputs
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          COMPONENT: ${{ inputs.component }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          component=${COMPONENT:-native}
          case "$component" in native|desktop|mobile|metal|webkit) ;; *) exit 1 ;; esac
          if [[ "$EVENT" != pull_request ]]; then
            printf 'native=true\nfrontend=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Compare the whole PR, including both sides of renames. A failed diff fails the job.
          git diff --no-renames --name-only -z "$BASE...$HEAD" > "$RUNNER_TEMP/native-paths"
          native=false
          frontend=false
          while IFS= read -r -d '' path; do
            # Metal builds the Rust workspaces and their two embedded web inputs, not JS packages or browser tests.
            # WebKit builds the full screen harness (including overflow tests), not just the recorder halo.
            # Desktop and iOS ship the same frontend and workspace packages, including the generated agent guides.
            # Limit Apple PR runs to those inputs, native source, toolchain files and build/release tooling.
            if [[ "$component" == desktop || "$component" == mobile ]]; then
              case "$path" in
                frontend/*|packages/*|patches/*|agent-skills/*|agent-setup/*|scripts/build-agent-*.mjs|scripts/apply-vendor-redirects.mjs|scripts/release/*|.github/actions/*|.github/workflows/native-changes.yml|.github/scripts/test-native-changes.py|package.json|manifest.json|bun.lock|bun.lockb|bunfig.toml|.npmrc|package-lock.json|npm-shrinkwrap.json|pnpm-lock.yaml|pnpm-workspace.yaml|yarn.lock|turbo.json|tsconfig*.json|*/package.json|*/bun.lock|*/bun.lockb|*/bunfig.toml|*/package-lock.json|*/npm-shrinkwrap.json|*/pnpm-lock.yaml|*/yarn.lock|*/.npmrc)
                  native=true; frontend=true ;;
                desktop/docs/*|desktop/README.md|desktop/CHANGELOG.md|mobile/docs/*|mobile/README.md|mobile/CHANGELOG.md|mobile/android/*) ;;
                desktop/*|.cargo/*|rust-toolchain*|Cargo.toml|Cargo.lock|.github/workflows/desktop.yml|.github/workflows/desktop-build.yml|.github/workflows/desktop-release.yml)
                  if [[ "$component" == desktop ]]; then native=true; fi ;;
                ios/*|mobile/*|.github/workflows/mobile.yml|.github/workflows/ios-build.yml|.github/workflows/ios-testflight.yml)
                  if [[ "$component" == mobile ]]; then native=true; fi ;;
              esac
              continue
            fi
            case "$component" in
              metal)
                case "$path" in
                  desktop/*|.cargo/*|rust-toolchain*|Cargo.toml|Cargo.lock|package.json|bun.lock|bun.lockb|bunfig.toml|frontend/.env.production|frontend/src/capture/recorder/recordShortcut.ts|.github/workflows/transcript-eval.yml|.github/workflows/native-changes.yml|.github/scripts/test-native-changes.py)
                    native=true ;;
                esac
                continue ;;
              webkit)
                case "$path" in
                  frontend/*|test/*|packages/*|patches/*|package.json|bun.lock|bun.lockb|bunfig.toml|.npmrc|package-lock.json|npm-shrinkwrap.json|pnpm-lock.yaml|pnpm-workspace.yaml|yarn.lock|turbo.json|tsconfig*.json|*/package.json|*/bunfig.toml|*/bun.lock|*/bun.lockb|*/.npmrc|*/package-lock.json|*/npm-shrinkwrap.json|*/pnpm-lock.yaml|*/yarn.lock|.github/workflows/frontend.yml|.github/workflows/native-changes.yml|.github/scripts/test-native-changes.py)
                    native=true; frontend=true ;;
                esac
                continue ;;
            esac
            # Root files include workspace definitions, lockfiles and build/install configuration.
            # Over-include new root inputs rather than accidentally accepting a native skip.
            if [[ "$path" != */* ]]; then
              native=true; frontend=true
              continue
            fi
            case "$path" in
              packages/*|patches/*|scripts/*|test/*|.github/*|agent-skills/*|agent-setup/*|*/package.json|*/bun.lock|*/bun.lockb|*/bunfig.toml|*/package-lock.json|*/npm-shrinkwrap.json|*/pnpm-lock.yaml|*/yarn.lock|*/.npmrc)
                native=true; frontend=true ;;
              frontend/*)
                native=true; frontend=true ;;
              desktop/*|.cargo/*|ios/*|android/*|mobile/*)
                native=true ;;
            esac
          done < "$RUNNER_TEMP/native-paths"
          printf 'native=%s\nfrontend=%s\n' "$native" "$frontend" >> "$GITHUB_OUTPUT"
          printf '%s inputs: %s; frontend/WebKit inputs: %s\n' "$component" "$native" "$frontend" >> "$GITHUB_STEP_SUMMARY"
