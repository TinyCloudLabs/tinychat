name: tc876 diag
on:
  push:
    branches: [tmp/tc-876-diag]
permissions:
  contents: read
jobs:
  diag:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          cache: true
          cache-dependency-path: bun.lock
      - run: bun install --frozen-lockfile
      - run: bun run build:packages
      - working-directory: test
        run: bunx playwright install webkit
      - name: cpu stress
        run: for i in 1 2 3 4; do (yes > /dev/null &) ; done
      - name: repro
        working-directory: test
        run: LOG=1 STOP=1 N=60 SETTLE=700 bun _repro.ts 2>&1 | tee /tmp/repro.log
      - name: repro with poller
        if: ${{ !cancelled() }}
        working-directory: test
        run: POLL=1 LOG=1 STOP=1 N=40 SETTLE=700 bun _repro.ts 2>&1 | tee /tmp/repro-poll.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: repro-log
          path: /tmp/repro.log
