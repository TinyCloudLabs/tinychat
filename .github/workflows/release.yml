name: Release

# On every push to main:
#   1. tag each release unit's version on the commit that set it (<name>@<version>);
#   2. open or update the "chore(release): version packages" PR from pending changesets.
# Merging that PR bumps versions; the next run tags them. Nothing is ever published to npm:
# there is no publish-script and `changeset publish` is never run. Tags do not trigger
# deploys or desktop builds yet.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Changesets CLI v3 requires Node ^22.11 || ^24.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Check release invariants
        run: bun run release:check

      - name: Tag released versions
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: node scripts/release/tag.mjs

      - name: Open or update the Version Packages PR
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: bun run release:version
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
