name: Desktop (Exo)

# CI build of the Exo desktop app (unsigned workflow artifact only; releases are desktop-release.yml). The build
# itself lives in desktop-build.yml. Pushes to main and the weekly run also refresh the shared build cache, which
# GitHub evicts after 7 days unused.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"
  pull_request:
    paths:
      - "desktop/**"
      - "frontend/**"
      - "packages/**"
      - ".github/workflows/desktop.yml"
      - ".github/workflows/desktop-build.yml"
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "frontend/**"
      - "packages/**"
      - ".github/workflows/desktop.yml"
      - ".github/workflows/desktop-build.yml"

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-macos:
    name: Build
    uses: ./.github/workflows/desktop-build.yml
    with:
      artifact-name: exo-macos-arm64-${{ github.sha }}
