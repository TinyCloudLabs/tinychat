name: Desktop (TinyCloud Home)

# CI build of the TinyCloud Home desktop app (unsigned workflow artifact only; releases are desktop-release.yml). The build
# itself lives in desktop-build.yml: its build job (no secrets) and a dry run of its sign job (ad-hoc, no environment),
# so the release signing path runs on every desktop change. Pushes to main and the weekly run also refresh the shared
# build cache, which GitHub evicts after 7 days unused.

on:
  workflow_dispatch:
    inputs:
      smoke:
        description: Build the recorder-failpoints smoke artifact
        type: boolean
        default: false
        required: false
  schedule:
    - cron: "17 5 * * 1"
  pull_request:
    paths:
      - "desktop/**"
      - "frontend/**"
      - "packages/**"
      - ".github/workflows/desktop.yml"
      - ".github/workflows/desktop-build.yml"
      - "scripts/release/desktop-*"
      - "scripts/release/verify-desktop-signing.sh"
      # Pull requests only, last so they win: desktop notes and frontend unit tests are not in the app. The frontend
      # tsconfig excludes tests and nothing imports them, so the bundle cannot change; frontend.yml still runs them.
      # frontend/public/**/*.md ARE bundled (served assets), so only desktop/** markdown is excluded.
      - "!desktop/**/*.md"
      - "!frontend/**/*.test.ts"
      - "!frontend/**/*.test.tsx"
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "frontend/**"
      - "packages/**"
      - ".github/workflows/desktop.yml"
      - ".github/workflows/desktop-build.yml"
      - "scripts/release/desktop-*"
      - "scripts/release/verify-desktop-signing.sh"

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-macos:
    name: Build
    uses: ./.github/workflows/desktop-build.yml
    with:
      artifact-name: ${{ inputs.smoke && format('exo-smoke-macos-arm64-{0}', github.sha) || format('exo-macos-arm64-{0}', github.sha) }}
      smoke: ${{ inputs.smoke || false }}
      ipc-selftest: true
