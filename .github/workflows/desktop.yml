name: Desktop (TinyCloud One)

# CI build of the TinyCloud One desktop app (unsigned workflow artifact only; releases are desktop-release.yml). The build
# itself lives in desktop-build.yml: its build job (no secrets) and a dry run of its sign job (ad-hoc, no environment),
# so the release signing path runs on every desktop change. Pushes to main and the weekly run also refresh the shared
# build cache, which GitHub evicts after 7 days unused.

on:
  workflow_dispatch:
    inputs:
      smoke:
        description: Build the recorder-failpoints smoke artifact
        type: boolean
        default: false
        required: false
  schedule:
    - cron: "17 5 * * 1"
  pull_request:
  merge_group:
  push:
    branches: [main, "release/**"]
    tags: ["exo-desktop@*", "@tinychat/frontend@*", "@tinychat/backend@*"]

# Superseded PRs and main pushes cancel; manual, scheduled, tag, release-branch and merge-queue runs stay independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' && github.ref == 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/native-changes.yml
    with:
      component: desktop

  build-macos:
    name: Build
    needs: changes
    if: needs.changes.outputs.native == 'true'
    uses: ./.github/workflows/desktop-build.yml
    with:
      artifact-name: ${{ inputs.smoke && format('exo-smoke-macos-arm64-{0}', github.sha) || format('exo-macos-arm64-{0}', github.sha) }}
      smoke: ${{ inputs.smoke || false }}
      ipc-selftest: true

  desktop-check:
    name: Desktop checks
    if: always()
    needs: [changes, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require a successful build or an intentional non-native PR skip
        env:
          EVENT: ${{ github.event_name }}
          CHANGES: ${{ needs.changes.result }}
          NATIVE: ${{ needs.changes.outputs.native }}
          BUILD: ${{ needs.build-macos.result }}
        run: |
          [[ "$CHANGES" == success ]]
          case "$NATIVE:$EVENT" in
            true:*) [[ "$BUILD" == success ]] ;;
            false:pull_request) [[ "$BUILD" == skipped ]] ;;
            *) exit 1 ;;
          esac
