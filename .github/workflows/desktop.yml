name: Desktop (Exo)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "frontend/**"
      - "packages/**"
      - ".github/workflows/desktop.yml"

jobs:
  build-macos:
    name: macOS (Apple Silicon)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Build workspace packages
        run: bun run build:packages

      # tauri build runs the frontend production build itself
      # (beforeBuildCommand in desktop/src-tauri/tauri.conf.json).
      - name: Build Exo desktop app
        run: bun run build:desktop

      # Zip the .app with ditto to preserve symlinks/permissions;
      # upload-artifact would flatten them.
      - name: Package .app
        run: |
          cd desktop/src-tauri/target/release/bundle/macos
          ditto -c -k --sequesterRsrc --keepParent Exo.app Exo-macos-arm64.app.zip

      - name: Upload dmg + app
        uses: actions/upload-artifact@v4
        with:
          name: exo-macos-arm64-${{ github.sha }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/macos/Exo-macos-arm64.app.zip
