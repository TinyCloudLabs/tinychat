name: tmp-diag
on:
  pull_request:
    paths:
      - ".github/workflows/tmp-diag.yml"
permissions:
  contents: read
jobs:
  boot-recovery:
    name: boot-recovery on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build:packages
      - name: Machine
        run: |
          uname -a; nproc; lscpu | grep -E "Model name|^CPU\(s\)"; ldd --version | head -1; bun --revision
          bun -e 'import {Database} from "bun:sqlite"; console.log("sqlite", new Database(":memory:").query("select sqlite_version() v").get())'
      - name: webEngine.flow alone, three times
        working-directory: frontend
        run: |
          for i in 1 2 3; do bun test src/lib/voiceNotes/web/webEngine.flow.test.ts 2>&1 | grep -E "\(fail\)|^ *[0-9]+ (pass|fail)$|no such table|timed out" | sort | uniq -c; echo "--- run $i"; done
      - name: App fixtures alone (isolated), three times
        working-directory: frontend
        run: |
          for i in 1 2 3; do for f in App.manifestRevision App.resignForward; do bun test --isolate ./test-fixtures/$f.fixture.tsx 2>&1 | grep -E "\(fail\)|^ *[0-9]+ (pass|fail)$" | cut -c1-120; done; echo "--- run $i"; done
      - name: voiceNotes directory alone
        working-directory: frontend
        run: bun test src/lib/voiceNotes 2>&1 | grep -E "\(fail\)|^ *[0-9]+ (pass|fail)$" | cut -c1-160
