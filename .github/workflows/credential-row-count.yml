name: Read credential row count

# Operator-only and read-only (TC-1964). A person starts it by hand from main; nothing else triggers it. It runs in
# the production-api environment, which holds CREDENTIAL_COUNT_ADMIN_KEY, calls the backend's credential row count
# route and prints one line: the source, the HTTP status and the count (or a fixed code). The key and the response
# body are never printed. Dispatch it for another connector source with the `source` input.
#   gh workflow run credential-row-count.yml --ref main -f source=fireflies

on:
  workflow_dispatch:
    inputs:
      source:
        description: Connector source to count (lower-case letters, digits and hyphens)
        type: string
        default: fireflies

permissions:
  contents: read

concurrency:
  group: credential-row-count
  cancel-in-progress: false

jobs:
  read:
    # The environment's secret is only for main. A dispatch from any other ref is skipped before it reaches the environment.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production-api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: scripts/ops
      - name: Read the count
        env:
          CREDENTIAL_COUNT_ADMIN_KEY: ${{ secrets.CREDENTIAL_COUNT_ADMIN_KEY }}
          API_URL: ${{ vars.TINYCHAT_BACKEND_URL || 'https://api.tinycloud.chat' }}
          SOURCE: ${{ inputs.source }}
        run: bash scripts/ops/read-credential-row-count.sh
