name: Desktop release (Exo)

# Builds and publishes Exo for one exo-desktop@<version> tag. It always runs from main, so the workflow code is
# main's, never a tag's: the Release workflow dispatches it for every new exo-desktop tag with
#   gh workflow run desktop-release.yml --ref main -f tag=exo-desktop@<version>
# (the same command retries a failed release). The plan job refuses any other ref, requires the tag to point at a
# commit of main (fetched fresh) and builds exactly that commit.
# - beta (X.Y.Z-beta.N): a GitHub pre-release, never "latest";
# - stable (X.Y.Z): a published GitHub Release marked latest.
# Publishing requires a signed, notarized build: until signing lands, both channels build and then refuse to publish,
# so no unsigned Exo is ever released. The release is created as a draft only while its assets upload, then
# published by the same job; a draft left by a failed run is reused, a published release is never touched again
# (cut a new version instead).
#
# TODO(updater, PR F, right after the first signed release): add tauri-plugin-updater with
# bundle.createUpdaterArtifacts, sign Exo.app.tar.gz with TAURI_SIGNING_PRIVATE_KEY from the desktop-release
# environment, and attach latest.json to stable releases (endpoint: releases/latest/download/latest.json, which only
# works because desktop is the only thing that creates GitHub Releases).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, e.g. exo-desktop@0.2.0-beta.3 (run this workflow from main)
        type: string
        required: true

concurrency:
  group: desktop-release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      title: ${{ steps.plan.outputs.title }}
      asset-prefix: ${{ steps.plan.outputs.asset-prefix }}
    steps:
      - name: Require the release workflow from main
        env:
          EXPECTED: ${{ github.repository }}/.github/workflows/desktop-release.yml@refs/heads/main
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ] || [ "$WORKFLOW_REF" != "$EXPECTED" ]; then
            echo "::error::Desktop releases run only from main (got $GITHUB_REF, $WORKFLOW_REF). Use: gh workflow run desktop-release.yml --ref main -f tag=<exo-desktop tag>"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Plan the release
        id: plan
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git fetch --force --no-tags origin +refs/heads/main:refs/remotes/origin/main "+refs/tags/$TAG:refs/tags/$TAG"
          node scripts/release/desktop-release-plan.mjs --tag "$TAG" --notes "$RUNNER_TEMP/release-notes.md"

      - name: Refuse to touch a published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$draft" = false ]; then
            echo "::error::$TAG is already published. Published releases are never rebuilt; cut a new version."
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error

  build:
    name: Build
    needs: plan
    uses: ./.github/workflows/desktop-build.yml
    with:
      ref: ${{ needs.plan.outputs.sha }}
      artifact-name: exo-${{ needs.plan.outputs.version }}-macos-arm64

  publish:
    name: Publish
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create and publish the GitHub Release
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.plan.outputs.tag }}
      TITLE: ${{ needs.plan.outputs.title }}
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
      PREFIX: ${{ needs.plan.outputs.asset-prefix }}
    steps:
      - name: Require the planned, signed build
        env:
          PLANNED: ${{ needs.plan.outputs.version }}
          BUILT: ${{ needs.build.outputs.version }}
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          if [ "$PLANNED" != "$BUILT" ]; then
            echo "::error::Planned $PLANNED but built $BUILT"
            exit 1
          fi
          if [ "$SIGNED" != true ]; then
            echo "::error::Refusing to publish $TAG: the build is not Developer ID signed and notarized. Exo is never released unsigned, beta or stable."
            exit 1
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: exo-${{ needs.plan.outputs.version }}-macos-arm64
          path: build

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes
          path: notes

      - name: Name the release assets
        run: |
          mkdir assets
          mapfile -t dmgs < <(find build -name '*.dmg')
          mapfile -t zips < <(find build -name 'Exo-macos-arm64.app.zip')
          if [ "${#dmgs[@]}" -ne 1 ] || [ "${#zips[@]}" -ne 1 ]; then
            echo "::error::Expected one .dmg and one .app.zip, found: ${dmgs[*]} ${zips[*]}"
            exit 1
          fi
          cp "${dmgs[0]}" "assets/$PREFIX.dmg"
          cp "${zips[0]}" "assets/$PREFIX.app.zip"
          (cd assets && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      # Draft only while assets upload, so the release appears complete or not at all.
      - name: Create or reuse the draft release
        run: |
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          case "$draft" in
            none)
              flags=()
              if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$TITLE" --notes-file notes/release-notes.md "${flags[@]}"
              ;;
            true)
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file notes/release-notes.md
              ;;
            *)
              echo "::error::$TAG is already published. Published releases are never rebuilt; cut a new version."
              exit 1
              ;;
          esac

      - name: Upload assets
        run: gh release upload "$TAG" assets/* --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish
        run: |
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
          fi
          url=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)
          echo "Published $TITLE: $url" | tee -a "$GITHUB_STEP_SUMMARY"
