name: Desktop release (Exo)

# Builds and publishes Exo for one exo-desktop@<version> tag. It always runs from main, so the workflow code is
# main's, never a tag's: the Release workflow dispatches it for every new exo-desktop tag with
#   gh workflow run desktop-release.yml --ref main -f tag=exo-desktop@<version>
# (the same command retries a failed release). The plan job refuses any other ref, requires the tag to point at a
# commit of main (fetched fresh) and builds exactly that commit. Only the app source comes from the tag's commit: the
# release tooling (scripts/release) always runs from the workflow commit (github.workflow_sha), here and in
# desktop-build.yml, so an older tag never runs its own older scripts. The plan refuses a beta older than the latest
# stable exo-desktop tag on main (0.2.0-beta.3 once 0.2.0 is out): superseded betas are not published.
# - beta (X.Y.Z-beta.N): a GitHub pre-release, never "latest";
# - stable (X.Y.Z): a published GitHub Release marked latest.
# Signing follows the EXO_DESKTOP_SIGNING repository variable, read once by the plan job; it has no default:
# - required: Developer ID signed, notarized and stapled (desktop-build.yml with sign: true, secrets from the
#   desktop-release environment, which only main can deploy to); publishing requires the build's signed=true;
# - unsigned (until the Apple Developer ID exists): desktop-build.yml with sign: false, so no environment and no
#   signing secret is requested (the app is only ad-hoc sealed); the release title and notes say UNSIGNED.
# Any other value, including unset, fails the plan before anything is built. The provenance checks (main only, tag
# on main) apply in both modes. The release is created as a draft only while its assets upload, then published by
# the same job; a draft left by a failed run is reused, a published release is never touched again (cut a new
# version instead).
#
# TODO(updater, PR F, right after the first signed release): add tauri-plugin-updater with
# bundle.createUpdaterArtifacts, sign Exo.app.tar.gz with TAURI_SIGNING_PRIVATE_KEY from the desktop-release
# environment, and attach latest.json to stable releases (endpoint: releases/latest/download/latest.json, which only
# works because desktop is the only thing that creates GitHub Releases).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, e.g. exo-desktop@0.2.0-beta.3 (run this workflow from main)
        type: string
        required: true

concurrency:
  group: desktop-release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      title: ${{ steps.plan.outputs.title }}
      asset-prefix: ${{ steps.plan.outputs.asset-prefix }}
      signing: ${{ steps.plan.outputs.signing }}
    steps:
      - name: Require the release workflow from main
        env:
          EXPECTED: ${{ github.repository }}/.github/workflows/desktop-release.yml@refs/heads/main
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ] || [ "$WORKFLOW_REF" != "$EXPECTED" ]; then
            echo "::error::Desktop releases run only from main (got $GITHUB_REF, $WORKFLOW_REF). Use: gh workflow run desktop-release.yml --ref main -f tag=<exo-desktop tag>"
            exit 1
          fi

      # The release tooling: the workflow's own commit on main, never the tag's.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Plan the release
        id: plan
        env:
          TAG: ${{ inputs.tag }}
          SIGNING: ${{ vars.EXO_DESKTOP_SIGNING }}
        run: |
          git fetch --force --no-tags origin +refs/heads/main:refs/remotes/origin/main '+refs/tags/exo-desktop@*:refs/tags/exo-desktop@*'
          node scripts/release/desktop-release-plan.mjs --tag "$TAG" --notes "$RUNNER_TEMP/release-notes.md" --signing "$SIGNING"

      - name: Refuse to touch a published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$draft" = false ]; then
            echo "::error::$TAG is already published. Published releases are never rebuilt; cut a new version."
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error

  build:
    name: Build
    needs: plan
    uses: ./.github/workflows/desktop-build.yml
    with:
      ref: ${{ needs.plan.outputs.sha }}
      artifact-name: exo-${{ needs.plan.outputs.version }}-macos-arm64
      sign: ${{ needs.plan.outputs.signing == 'required' }}

  publish:
    name: Publish
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create and publish the GitHub Release
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.plan.outputs.tag }}
      TITLE: ${{ needs.plan.outputs.title }}
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
      PREFIX: ${{ needs.plan.outputs.asset-prefix }}
    steps:
      - name: Require the planned build, signed unless the plan says unsigned
        env:
          PLANNED: ${{ needs.plan.outputs.version }}
          BUILT: ${{ needs.build.outputs.version }}
          SIGNED: ${{ needs.build.outputs.signed }}
          SIGNING: ${{ needs.plan.outputs.signing }}
        run: |
          if [ "$PLANNED" != "$BUILT" ]; then
            echo "::error::Planned $PLANNED but built $BUILT"
            exit 1
          fi
          # The build must match the plan's explicit mode exactly; anything else refuses.
          case "$SIGNING:$SIGNED" in
            required:true) ;;
            unsigned:false) echo "::warning::Publishing $TAG UNSIGNED (EXO_DESKTOP_SIGNING=unsigned)." ;;
            *)
              echo "::error::Refusing to publish $TAG: EXO_DESKTOP_SIGNING=$SIGNING but the build reports signed=$SIGNED."
              exit 1
              ;;
          esac

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: exo-${{ needs.plan.outputs.version }}-macos-arm64
          path: build

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes
          path: notes

      - name: Name the release assets
        run: |
          mkdir assets
          mapfile -t dmgs < <(find build -name '*.dmg')
          mapfile -t zips < <(find build -name 'Exo-macos-arm64.app.zip')
          if [ "${#dmgs[@]}" -ne 1 ] || [ "${#zips[@]}" -ne 1 ]; then
            echo "::error::Expected one .dmg and one .app.zip, found: ${dmgs[*]} ${zips[*]}"
            exit 1
          fi
          cp "${dmgs[0]}" "assets/$PREFIX.dmg"
          cp "${zips[0]}" "assets/$PREFIX.app.zip"
          (cd assets && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      # Draft only while assets upload, so the release appears complete or not at all.
      - name: Create or reuse the draft release
        run: |
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          case "$draft" in
            none)
              flags=()
              if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$TITLE" --notes-file notes/release-notes.md "${flags[@]}"
              ;;
            true)
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file notes/release-notes.md
              ;;
            *)
              echo "::error::$TAG is already published. Published releases are never rebuilt; cut a new version."
              exit 1
              ;;
          esac

      - name: Upload assets
        run: gh release upload "$TAG" assets/* --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish
        run: |
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
          fi
          url=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)
          echo "Published $TITLE: $url" | tee -a "$GITHUB_STEP_SUMMARY"
