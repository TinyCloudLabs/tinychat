name: Frontend

# The full frontend suite, lint, and the browser harnesses (Chromium) on every
# PR that touches the frontend, the tests or the shared packages. Each harness
# captures what it checks; the exo-ui screenshots are uploaded for review.
#
# Lint covers frontend/ and test/ only: the repo-wide `bun run lint` still has
# errors in backend/ and artifacts/.
#
# WebKit runs locally (EXO_UI_ENGINE=webkit, SCROLL_ENGINE=webkit), not here,
# except the recorder halo job below: WebKit on macOS is the only place the
# halo's bitmap handoff has gone blank (TC-876).
# The model-router browser suite stays out until TC-768 resolves its three
# failures on main (since #107, stream before save).

on:
  pull_request:
    paths:
      - "frontend/**"
      - "test/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/frontend.yml"
      - "test/exo-ui/**"

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend tests, lint and browser harnesses
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Build workspace packages
        run: bun run build:packages

      - name: Build the frontend (tsc and vite)
        run: bun run build:frontend

      - name: Frontend tests
        run: bun run --cwd frontend test

      - name: Lint (frontend and test)
        run: bunx eslint frontend test

      - name: Install Chromium
        run: bun run --cwd test install:browsers:ci

      - name: Connectors scroll containment (Chromium)
        working-directory: test
        run: SCROLL_ENGINE=chromium bun test connectors-scroll.e2e.test.ts

      - name: Agent banner across navigation (Chromium)
        run: bun run --cwd test agent-banner:browser

      - name: Shell invariants (Chromium)
        run: bun run --cwd test shell-invariants:browser

      # Four viewports: phone, landscape phone, desktop and 200% text on a
      # phone (where Linux fonts have caught clipping macOS hides). The full
      # nine-viewport matrix, WebKit included, runs locally.
      - name: Exo UI screens (Chromium)
        run: EXO_UI_ENGINE=chromium EXO_UI_VIEWPORTS=phone,phone-land,desktop,text200-phone bun run --cwd test exo-ui:screens

      - name: Recorder halo forced Canvas 2D checks (Linux Chromium)
        if: ${{ !cancelled() }}
        run: EXO_UI_ENGINE=chromium EXO_UI_VIEWPORTS=phone-halo-review EXO_UI_HALO_FORCE_CANVAS=1 bun run --cwd test exo-ui:screens

      - name: Upload the Exo UI screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exo-ui-screens-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: screenshots/exo-ui/
          if-no-files-found: warn

  halo-webkit:
    name: Recorder halo (macOS WebKit)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-webkit-macos-${{ hashFiles('bun.lock', 'test/package.json') }}

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Build workspace packages
        run: bun run build:packages

      - name: Install WebKit
        working-directory: test
        run: bunx playwright install webkit

      # CPU contention like the runs that blanked a ring (stopped in the last
      # step). The stall test starts from this load.
      - name: Start CPU stress
        run: |
          for _ in 1 2 3 4 5 6; do yes > /dev/null & done
          sleep 1
          pgrep -x yes | wc -l

      # TEMPORARY A/B (removed in the next push): the same stall test on the
      # renderer as it was before the fix. Reports the blank count; the check
      # is that the test ran and printed its result line.
      - name: Stall test on the pre-fix renderer (report only)
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RENDERER: frontend/src/capture/recorder/final/halo/renderer.ts
          HALO_LOADS: "40"
          HALO_REPORT: "1"
        run: |
          cp "$RENDERER" "$RUNNER_TEMP/renderer.fixed.ts"
          git fetch --depth=1 origin "$BASE_SHA"
          git show "$BASE_SHA:$RENDERER" > "$RENDERER"
          cd test
          bun test recorder-final-halo.e2e.test.ts -t "after the main thread stalls" 2>&1 | tee "$RUNNER_TEMP/prefix.txt"
          cd ..
          cp "$RUNNER_TEMP/renderer.fixed.ts" "$RENDERER"
          test "$(grep -c '^HALO_STALL_RESULT ' "$RUNNER_TEMP/prefix.txt")" = 1
          grep -E '^ 1 pass$' "$RUNNER_TEMP/prefix.txt"

      - name: Recorder halo (WebKit, fixed renderer)
        shell: bash
        working-directory: test
        env:
          HALO_LOADS: "40"
        run: |
          bun test recorder-final-halo.e2e.test.ts 2>&1 | tee "$RUNNER_TEMP/fixed.txt"
          test "$(grep -c '^HALO_STALL_RESULT ' "$RUNNER_TEMP/fixed.txt")" = 1

      - name: Stop CPU stress
        if: ${{ always() }}
        run: killall yes || echo "no stress processes were left"

      - name: Upload the halo screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recorder-halo-webkit-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: screenshots/recorder-halo/
          if-no-files-found: warn
