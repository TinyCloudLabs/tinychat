name: Frontend

# The full frontend suite, lint, and the browser harnesses (Chromium) on every
# PR that touches the frontend, the tests or the shared packages. Each harness
# captures what it checks; the exo-ui screenshots are uploaded for review.
#
# Lint covers frontend/ and test/ only: the repo-wide `bun run lint` still has
# errors in backend/ and artifacts/.
#
# WebKit runs locally for the broad harnesses; focused horizontal-overflow and
# recorder halo regressions also run in the macOS WebKit job below.
# The model-router browser suite stays out until TC-768 resolves its three
# failures on main (since #107, stream before save).

on:
  pull_request:
  merge_group:
  push:
    branches: [main, "release/**"]
    tags: ["exo-desktop@*", "@tinychat/frontend@*", "@tinychat/backend@*"]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    uses: ./.github/workflows/native-changes.yml

  # Unit tests, lint and the build. The browser work runs in the jobs below, in
  # parallel, so no single job approaches its timeout as the harnesses grow.
  frontend:
    name: Frontend tests, lint and browser harnesses
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Build workspace packages
        run: bun run build:packages

      - name: Build the frontend (tsc and vite)
        run: bun run build:frontend

      - name: Entry chunk size budget
        run: bun frontend/scripts/entry-size-check.ts

      - name: Frontend tests
        run: bun run --cwd frontend test

      - name: Audio hash worker tests (Node DOM)
        run: bun run --cwd frontend test:audio-hash-dom

      - name: Lint (frontend and test)
        run: bunx eslint frontend test

  browser:
    name: Browser harnesses (Chromium)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.frontend == 'true'
    # Pinned: ubuntu-latest is Ubuntu 26.04, where Playwright cannot install Chromium. Unpin per TC-3071.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Build workspace packages
        run: bun run build:packages

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-linux-${{ hashFiles('bun.lock', 'test/package.json') }}
      - name: Install Chromium
        run: bun run --cwd test install:browsers:ci
      - name: Connectors scroll containment (Chromium)
        working-directory: test
        run: SCROLL_ENGINE=chromium bun test connectors-scroll.e2e.test.ts

      - name: Mobile screens fit the viewport (Chromium)
        if: ${{ !cancelled() }}
        working-directory: test
        run: bun test no-horizontal-drag.e2e.test.ts

      - name: Agent banner across navigation (Chromium)
        if: ${{ !cancelled() }}
        run: bun run --cwd test agent-banner:browser

      - name: Shell invariants (Chromium)
        if: ${{ !cancelled() }}
        run: bun run --cwd test shell-invariants:browser

      - name: Home feed page-close outbox (Chromium)
        if: ${{ !cancelled() }}
        working-directory: test
        run: bun test home-feed-outbox.e2e.test.ts

      - name: Main history read concurrency (Chromium)
        if: ${{ !cancelled() }}
        working-directory: test
        run: bun test bot-history-read.e2e.test.ts

      - name: Home feed Details layout (Chromium)
        if: ${{ !cancelled() }}
        working-directory: test
        run: bun test home-feed-details-layout.e2e.test.ts

      - name: SDK permission dialog over Main (Chromium)
        if: ${{ !cancelled() }}
        working-directory: test
        run: bun test bot-sdk-permission-dialog.e2e.test.ts

      - name: Recorder-final interaction suites (Chromium)
        if: ${{ !cancelled() }}
        working-directory: test
        run: |
          SOFT_HOME_ENGINE=chromium bun test capture-home-soft.e2e.test.ts
          EXO_UI_ENGINE=chromium bun test recorder-final-phone.e2e.test.ts
          EXO_UI_ENGINE=chromium bun test recorder-final-ribbon.e2e.test.ts
          EXO_UI_ENGINE=chromium bun test recorder-final-small-screen.e2e.test.ts

      - name: Recorder halo forced Canvas 2D checks (Linux Chromium)
        if: ${{ !cancelled() }}
        run: EXO_UI_ENGINE=chromium EXO_UI_VIEWPORTS=phone-halo-review EXO_UI_HALO_FORCE_CANVAS=1 bun run --cwd test exo-ui:screens

      - name: Upload the halo Canvas 2D screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exo-ui-screens-${{ github.event.pull_request.number }}-halo-canvas2d-${{ github.run_attempt }}
          path: screenshots/exo-ui/
          if-no-files-found: warn

  # Bun's screen harness loops the registry, not Playwright Test files. Its
  # existing theme filter partitions every viewport without dropping captures.
  screens-shards:
    name: Exo UI screen shard (Chromium, ${{ matrix.viewport }}, ${{ matrix.theme }})
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.frontend == 'true'
    # Pinned: ubuntu-latest is Ubuntu 26.04, where Playwright cannot install Chromium. Unpin per TC-3071.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        viewport: [phone, phone-land, desktop, text200-phone]
        theme: [light, dark]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Build workspace packages
        run: bun run build:packages

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-linux-${{ hashFiles('bun.lock', 'test/package.json') }}
      - name: Install Chromium
        run: bun run --cwd test install:browsers:ci

      - name: Exo UI screens (Chromium)
        working-directory: test
        env:
          EXO_UI_ENGINE: chromium
          EXO_UI_VIEWPORTS: ${{ matrix.viewport }}
          EXO_UI_THEMES: ${{ matrix.theme }}
        run: bun test exo-ui-screens.e2e.test.ts --reporter=junit --reporter-outfile=junit.xml

      - name: Upload shard screenshots and executed-test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screen-shard-${{ matrix.viewport }}--${{ matrix.theme }}-${{ github.run_attempt }}
          path: |
            screenshots/exo-ui/
            test/junit.xml
          if-no-files-found: error

  screens-coverage:
    name: Screen shard coverage (${{ matrix.viewport }})
    needs: [changes, screens-shards]
    if: ${{ always() && github.event_name == 'pull_request' && needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        viewport: [phone, phone-land, desktop, text200-phone]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Require successful shards
        env:
          SHARDS_RESULT: ${{ needs.screens-shards.result }}
        run: test "$SHARDS_RESULT" = success
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: screen-shard-${{ matrix.viewport }}--*-${{ github.run_attempt }}
          path: shard-reports
      - name: Prove executed-file and full capture coverage; merge reports
        run: |
          python3 .github/scripts/test_merge_screen_shards.py
          python3 .github/scripts/merge_screen_shards.py shard-reports merged-screens
      - name: Upload merged Exo UI screenshots and reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exo-ui-screens-${{ github.event.pull_request.number }}-${{ matrix.viewport }}-${{ github.run_attempt }}
          path: merged-screens/
          if-no-files-found: error

  screens:
    # Preserve the four required check names; intentional path/event skips pass.
    name: Exo UI screens (Chromium, ${{ matrix.viewport }})
    needs: [changes, screens-shards, screens-coverage]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        viewport: [phone, phone-land, desktop, text200-phone]
    steps:
      - name: Require complete screen coverage when selected
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
          SHARDS_RESULT: ${{ needs.screens-shards.result }}
          COVERAGE_RESULT: ${{ needs.screens-coverage.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$EVENT_NAME" = pull_request ] && [ "$FRONTEND_CHANGED" = true ]; then
            test "$SHARDS_RESULT" = success
            test "$COVERAGE_RESULT" = success
          else
            test "$SHARDS_RESULT" = skipped
            test "$COVERAGE_RESULT" = skipped
          fi

  halo-webkit:
    name: Recorder halo (macOS WebKit)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-webkit-macos-${{ hashFiles('bun.lock', 'test/package.json') }}

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Build workspace packages
        run: bun run build:packages

      - name: Install WebKit
        working-directory: test
        run: bunx playwright install webkit

      - name: Mobile screens fit the viewport (WebKit)
        working-directory: test
        env:
          NO_HORIZONTAL_ENGINE: webkit
        run: |
          NO_HORIZONTAL_BATCH=1 bun test no-horizontal-drag.e2e.test.ts
          NO_HORIZONTAL_BATCH=2 bun test no-horizontal-drag.e2e.test.ts
          NO_HORIZONTAL_BATCH=3 bun test no-horizontal-drag.e2e.test.ts
          NO_HORIZONTAL_BATCH=4 bun test no-horizontal-drag.e2e.test.ts

      # The halo test file: the centre-pixel check, then 30 fresh loads under an
      # injected main-thread stall, each sampling every ring per frame for a
      # blank (TC-876).
      - name: Recorder halo (WebKit)
        if: ${{ !cancelled() }}
        working-directory: test
        env:
          HALO_LOADS: "30"
        run: bun test recorder-final-halo.e2e.test.ts

      - name: Upload the halo screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recorder-halo-webkit-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: screenshots/recorder-halo/
          if-no-files-found: warn

  # The recorder follow-ups' interaction suites (desktop recorder, Meeting
  # sources, Capture settings and, as their slices land, notes, the desktop
  # Capture home and the web engine). bun matches files by name, so a suite
  # joins as soon as its file exists.
  followups:
    name: Recorder follow-ups e2e (Chromium)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.frontend == 'true'
    # Pinned: ubuntu-latest is Ubuntu 26.04, where Playwright cannot install Chromium. Unpin per TC-3071.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Build workspace packages
        run: bun run build:packages

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-linux-${{ hashFiles('bun.lock', 'test/package.json') }}
      - name: Install Chromium
        run: bun run --cwd test install:browsers:ci

      - name: Recorder follow-ups interaction suites (Chromium)
        working-directory: test
        run: EXO_UI_ENGINE=chromium bun test recorder-final-desktop recorder-final-notes recorder-final-saved-note recorder-final-web meeting-sources capture-settings capture-home-desktop web-voice-notes-codec mic-recovery

  webkit-check:
    name: WebKit checks
    if: always()
    needs: [changes, halo-webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful WebKit checks or an intentional unrelated PR skip
        env:
          EVENT: ${{ github.event_name }}
          CHANGES: ${{ needs.changes.result }}
          FRONTEND: ${{ needs.changes.outputs.frontend }}
          WEBKIT: ${{ needs.halo-webkit.result }}
        run: |
          [[ "$CHANGES" == success ]]
          case "$FRONTEND:$EVENT" in
            true:*) [[ "$WEBKIT" == success ]] ;;
            false:pull_request) [[ "$WEBKIT" == skipped ]] ;;
            *) exit 1 ;;
          esac
