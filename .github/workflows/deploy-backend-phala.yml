name: Deploy Backend to Phala Cloud

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "packages/**"
      - "backend/Dockerfile"
      - "docker-compose.phala.yml"
      - "phala.toml"
      - "manifest.json"
      - "package.json"
      - "bun.lock"
      - "frontend/package.json"
      - "tsconfig.base.json"
      - "turbo.json"
      - "infra/phala-ingress/**"
      - ".github/workflows/deploy-backend-phala.yml"
  workflow_dispatch:

concurrency:
  group: tinychat-backend-phala-production
  cancel-in-progress: false

env:
  DOCKER_IMAGE: ${{ vars.TINYCHAT_BACKEND_IMAGE || 'ghcr.io/tinycloudlabs/tinychat-backend' }}
  INGRESS_IMAGE: ${{ vars.TINYCHAT_INGRESS_IMAGE || 'ghcr.io/tinycloudlabs/tinychat-backend' }}
  PHALA_CVM_ID: ${{ vars.PHALA_CVM_ID }}
  PHALA_INGRESS_DOMAIN: ${{ vars.PHALA_INGRESS_DOMAIN || 'api.tinycloud.chat' }}
  PRODUCTION_API_URL: ${{ vars.TINYCHAT_BACKEND_URL || 'https://api.tinycloud.chat' }}
  PRODUCTION_FRONTEND_URL: ${{ vars.TINYCHAT_FRONTEND_URL || 'https://tinycloud.chat' }}
  REDPILL_BASE_URL: ${{ vars.REDPILL_BASE_URL || 'https://api.redpill.ai/v1' }}
  REDPILL_DEFAULT_MODEL: ${{ vars.REDPILL_DEFAULT_MODEL || 'z-ai/glm-5.2' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production-api
      url: ${{ vars.TINYCHAT_BACKEND_URL || 'https://api.tinycloud.chat' }}
    permissions:
      contents: read
      packages: write
      statuses: write
    steps:
      - uses: actions/checkout@v4

      - name: Publish pending deployment status
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api \
            --method POST \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="pending" \
            -f context="tinychat-backend - phala" \
            -f description="Phala deployment started" \
            -f target_url="$TARGET_URL"

      - name: Summarize deployment target
        run: |
          {
            echo "## Phala backend deployment"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Image: \`${DOCKER_IMAGE}:${GITHUB_SHA}\`"
            echo "- CVM ID: \`${PHALA_CVM_ID}\`"
            echo "- Public API: ${PRODUCTION_API_URL}"
            echo "- Ingress domain: \`${PHALA_INGRESS_DOMAIN}\`"
            echo "- Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check deployment configuration
        env:
          PHALA_CVM_ID: ${{ vars.PHALA_CVM_ID }}
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
          BACKEND_PRIVATE_KEY: ${{ secrets.BACKEND_PRIVATE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
          REDPILL_API_KEY: ${{ secrets.REDPILL_API_KEY }}
          AGENT_DID: ${{ vars.AGENT_DID }}
          ELIZA_SERVICE_URL: ${{ vars.ELIZA_SERVICE_URL }}
          ELIZA_SERVICE_SECRET: ${{ secrets.ELIZA_SERVICE_SECRET }}
        run: |
          missing=()
          for item in \
            PHALA_CVM_ID \
            PHALA_CLOUD_API_KEY \
            BACKEND_PRIVATE_KEY \
            CLOUDFLARE_API_TOKEN \
            CERTBOT_EMAIL \
            REDPILL_API_KEY \
            AGENT_DID \
            ELIZA_SERVICE_URL \
            ELIZA_SERVICE_SECRET; do
            if [ -z "${!item}" ]; then
              missing+=("$item")
              echo "::error title=Missing deployment config::$item is not configured"
            fi
          done

          if [ ${#missing[@]} -gt 0 ]; then
            {
              echo "### Missing deployment configuration"
              echo
              printf -- "- \`%s\`\n" "${missing[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "All required deployment config is present."

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          no-cache: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
            ${{ env.DOCKER_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=TinyChat backend

      - name: Build and push ingress image
        id: ingress-build
        uses: docker/build-push-action@v5
        with:
          context: infra/phala-ingress
          file: infra/phala-ingress/Dockerfile
          platforms: linux/amd64
          push: true
          no-cache: true
          tags: |
            ${{ env.INGRESS_IMAGE }}:ingress-${{ github.sha }}
            ${{ env.INGRESS_IMAGE }}:ingress-latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=TinyChat Phala ingress

      - name: Record pushed image
        run: |
          {
            echo
            echo "### Container image"
            echo
            echo "- Tag: \`${DOCKER_IMAGE}:${GITHUB_SHA}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Ingress tag: \`${INGRESS_IMAGE}:ingress-${GITHUB_SHA}\`"
            echo "- Ingress digest: \`${{ steps.ingress-build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pin deployed image tag
        run: |
          sed -i "s|\${TINYCHAT_BACKEND_IMAGE:-ghcr.io/tinycloudlabs/tinychat-backend:latest}|${DOCKER_IMAGE}:${GITHUB_SHA}|g" docker-compose.phala.yml
          sed -i "s|\${TINYCHAT_INGRESS_IMAGE:-ghcr.io/tinycloudlabs/tinychat-backend:ingress-latest}|${INGRESS_IMAGE}:ingress-${GITHUB_SHA}|g" docker-compose.phala.yml

      - name: Install Phala CLI
        run: |
          # Pinned: 1.1.20 (2026-07-26) broke deploys to this CVM — its updateCvm
          # path requires kms_info.encrypted_env_pubkey on the CVM record (absent
          # on CVMs created before that field existed) and has no fallback fetch
          # for centralized KMS: "CVM encrypted_env_pubkey is required for
          # centralized KMS". 1.1.19 uses the older flow that works. Re-test on
          # the next CLI release before unpinning.
          npm install -g phala@1.1.19
          phala --version || true

      - name: Capture CVM status before deploy
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
        run: |
          echo "::group::CVM status before deploy"
          phala cvms get "$PHALA_CVM_ID" --json \
            | jq '{id, name, status, app_id, instance_type, gateway, updated_at, created_at}'
          echo "::endgroup::"

      - name: Resolve Phala gateway CNAME
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
        run: |
          RAW="$(phala cvms get "$PHALA_CVM_ID" --json)"
          PHALA_GATEWAY_CNAME="$(echo "$RAW" | jq -r '.gateway.cname // empty')"
          PHALA_APP_ID="$(echo "$RAW" | jq -r '.app_id // empty')"

          if [ -z "$PHALA_GATEWAY_CNAME" ]; then
            echo "::error title=Missing Phala gateway CNAME::Could not resolve .gateway.cname for CVM ${PHALA_CVM_ID}"
            echo "$RAW" | jq '{id, name, status, app_id, gateway}'
            exit 1
          fi

          echo "PHALA_GATEWAY_CNAME=$PHALA_GATEWAY_CNAME" >> "$GITHUB_ENV"
          echo "PHALA_APP_ID=$PHALA_APP_ID" >> "$GITHUB_ENV"
          {
            echo
            echo "### Phala gateway"
            echo
            echo "- Gateway CNAME: \`$PHALA_GATEWAY_CNAME\`"
            echo "- App ID: \`$PHALA_APP_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify custom domain DNS
        run: |
          node <<'NODE'
          const dns = require("node:dns").promises;

          const domain = process.env.PHALA_INGRESS_DOMAIN;
          const expectedCname = process.env.PHALA_GATEWAY_CNAME.replace(/\.$/, "");
          const expectedTxt = `${process.env.PHALA_APP_ID}:443`;
          const txtName = `_dstack-app-address.${domain}`;

          async function main() {
            const fail = (title, message) => {
              console.error(`::error title=${title}::${message}`);
              process.exitCode = 1;
            };

            const cnameRecords = await dns.resolveCname(domain).catch(() => []);
            const txtRecords = await dns.resolveTxt(txtName).catch(() => []);
            const actualCname = cnameRecords.map((value) => value.replace(/\.$/, ""));
            const actualTxt = txtRecords.map((parts) => parts.join(""));

            console.log(`CNAME ${domain}: ${actualCname.join(", ") || "<missing>"}`);
            console.log(`TXT ${txtName}: ${actualTxt.join(", ") || "<missing>"}`);

            if (!actualCname.includes(expectedCname)) {
              fail("Phala DNS CNAME mismatch", `${domain} must CNAME to ${expectedCname}`);
            }
            if (!actualTxt.includes(expectedTxt)) {
              fail("Phala DNS TXT mismatch", `${txtName} must contain ${expectedTxt}`);
            }

            if (process.exitCode) process.exit(process.exitCode);
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

          {
            echo
            echo "### Custom domain DNS"
            echo
            echo "- CNAME target: \`${PHALA_GATEWAY_CNAME}\`"
            echo "- TXT target: \`${PHALA_APP_ID}:443\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to Phala Cloud
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
          BACKEND_PRIVATE_KEY: ${{ secrets.BACKEND_PRIVATE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
          REDPILL_API_KEY: ${{ secrets.REDPILL_API_KEY }}
          # Per-user delegated agent tools (Milestone E). All three must be set
          # for the agent/tool-calling path to turn on; unset = plain chat only.
          # AGENT_DID + ELIZA_SERVICE_URL are public (repo vars); the secret is a secret.
          AGENT_DID: ${{ vars.AGENT_DID }}
          ELIZA_SERVICE_URL: ${{ vars.ELIZA_SERVICE_URL }}
          ELIZA_SERVICE_SECRET: ${{ secrets.ELIZA_SERVICE_SECRET }}
          # Paywall / billing (docs/stripe-setup.md). Each value may live as a
          # repo SECRET or a repo VARIABLE (secrets win) — all optional until
          # go-live; unset values deploy with the paywall off.
          PAYWALL_ENABLED: ${{ secrets.PAYWALL_ENABLED || vars.PAYWALL_ENABLED || 'false' }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_PLUS_MONTHLY: ${{ secrets.STRIPE_PRICE_PLUS_MONTHLY || vars.STRIPE_PRICE_PLUS_MONTHLY }}
          STRIPE_PRICE_PLUS_YEARLY: ${{ secrets.STRIPE_PRICE_PLUS_YEARLY || vars.STRIPE_PRICE_PLUS_YEARLY }}
          STRIPE_PRICE_PRO_MONTHLY: ${{ secrets.STRIPE_PRICE_PRO_MONTHLY || vars.STRIPE_PRICE_PRO_MONTHLY }}
          STRIPE_PRICE_PRO_YEARLY: ${{ secrets.STRIPE_PRICE_PRO_YEARLY || vars.STRIPE_PRICE_PRO_YEARLY }}
          CREDIT_BUDGET_FREE: ${{ secrets.CREDIT_BUDGET_FREE || vars.CREDIT_BUDGET_FREE }}
          CREDIT_BUDGET_PLUS_WEEKLY: ${{ secrets.CREDIT_BUDGET_PLUS_WEEKLY || vars.CREDIT_BUDGET_PLUS_WEEKLY }}
          CREDIT_BUDGET_PRO_WEEKLY: ${{ secrets.CREDIT_BUDGET_PRO_WEEKLY || vars.CREDIT_BUDGET_PRO_WEEKLY }}
          # Ledger authority defaults OFF until the staged cutover is explicitly enabled.
          LEDGER_SERVICE_URL: ${{ secrets.LEDGER_SERVICE_URL || vars.LEDGER_SERVICE_URL }}
          LEDGER_SERVICE_SECRET: ${{ secrets.LEDGER_SERVICE_SECRET }}
          LEDGER_AUTHORITATIVE: ${{ secrets.LEDGER_AUTHORITATIVE || vars.LEDGER_AUTHORITATIVE || 'false' }}
          LEDGER_OUTAGE_POLICY: ${{ secrets.LEDGER_OUTAGE_POLICY || vars.LEDGER_OUTAGE_POLICY || 'bounded_k' }}
          # Connector webhooks — ships DARK: the flag defaults false, so a deploy with no
          # master/salt set mounts nothing (404) and the drain timer never starts. Every var
          # here must ALSO appear in the printf block below and in docker-compose.phala.yml:
          # allowed_envs is derived from the ENV_FILE keys and is frozen at CVM creation, so a
          # var missing from the printf block is silently dropped at injection (2026-07-07).
          # Generate the three secrets with `openssl rand -base64 32`, never reused across
          # them; startup refuses to boot on a weak value when the flag is on.
          CONNECTOR_WEBHOOKS_ENABLED: ${{ secrets.CONNECTOR_WEBHOOKS_ENABLED || vars.CONNECTOR_WEBHOOKS_ENABLED || 'false' }}
          WEBHOOK_HMAC_MASTER: ${{ secrets.WEBHOOK_HMAC_MASTER }}
          # The rotation grace key. Set only while a master rotation is draining; drop it in
          # the SAME deploy as the new master on a CONFIRMED compromise (runbook (b)).
          WEBHOOK_HMAC_MASTER_PREV: ${{ secrets.WEBHOOK_HMAC_MASTER_PREV }}
          # Keys the public log stream's `tid=`/`sig=`/`mid=`/`aid=` hashes. Its OWN secret —
          # never derived from WEBHOOK_HMAC_MASTER, rotated on its own schedule.
          LOG_HASH_SALT: ${{ secrets.LOG_HASH_SALT }}
          # The public HTTPS origin of every minted callback URL, pinned rather than derived
          # from the request's Host header. `https://host[:port]`, no path — a malformed value
          # refuses to build the companion router instead of minting dead webhooks.
          CONNECTOR_WEBHOOK_PUBLIC_ORIGIN: ${{ vars.CONNECTOR_WEBHOOK_PUBLIC_ORIGIN }}
          # W9 host-header allowlist on the public delivery route. Unset = derived from the
          # pinned origin above, so the host we ANSWER on cannot drift from the URL we hand the
          # provider. Set it only for an ingress that rewrites Host (`*` disables, loudly).
          CONNECTOR_WEBHOOK_HOST_ALLOWLIST: ${{ vars.CONNECTOR_WEBHOOK_HOST_ALLOWLIST }}
          # W9 / D4 single-instance seat. Unset = a random per-process id, which is correct for a
          # single CVM; pin it when the SAME logical instance redeploys and should reclaim its own
          # ingest lease instead of waiting out the 90 s TTL.
          CONNECTOR_INGEST_INSTANCE_ID: ${{ vars.CONNECTOR_INGEST_INSTANCE_ID }}
          # Backend-owned ingestion (W1). Ships DARK and stays dark until the operator enables
          # it deliberately: true only ARMS it — deliveries still route by a per-address cohort
          # allowlist held in the backend's own config KV, so a non-cohort address is untouched
          # Option C. Declared here now because allowed_envs is frozen at CVM creation.
          CONNECTOR_BACKEND_INGEST_ENABLED: ${{ vars.CONNECTOR_BACKEND_INGEST_ENABLED || 'false' }}
          # W2 credential custody (backend-ingest plan §6.2). Wraps every stored per-user
          # Fireflies credential; its OWN `openssl rand -base64 32` value — reusing
          # WEBHOOK_HMAC_MASTER is a hard boot error. Declared now because allowed_envs is frozen
          # at CVM creation, and it must SURVIVE redeploys: stripping it orphans every stored
          # credential (cf. the tee-node ingress-secret-strip incident).
          CONNECTOR_CREDENTIAL_MASTER: ${{ secrets.CONNECTOR_CREDENTIAL_MASTER }}
          # W4 content custody (backend-ingest plan §8.1 W4 / DECISIONS D3). Wraps every stored
          # meeting; its OWN `openssl rand -base64 32` value — reusing either master above is a
          # hard boot error. Declared now for the same allowed_envs freeze reason, and stripping
          # it on a redeploy orphans every stored meeting rather than just failing loudly.
          CONNECTOR_CONTENT_MASTER: ${{ secrets.CONNECTOR_CONTENT_MASTER }}
          # The registered Fireflies OAuth app (custody branch b1 — DECISIONS V-a-branch).
          FIREFLIES_OAUTH_CLIENT_ID: ${{ secrets.FIREFLIES_OAUTH_CLIENT_ID }}
          FIREFLIES_OAUTH_CLIENT_SECRET: ${{ secrets.FIREFLIES_OAUTH_CLIENT_SECRET }}
          FIREFLIES_OAUTH_REDIRECT_URI: ${{ vars.FIREFLIES_OAUTH_REDIRECT_URI }}
          # WP-A — the Google Meet OAuth proxy (gmeet plan §6 WP-A / §11). Ships DARK, and the
          # dark state is the ABSENCE of these repo secrets rather than a deliberate 'false':
          # unset ⇒ empty string ⇒ GOOGLE_MEET_OAUTH_ENABLED != 'true' ⇒ the five
          # /api/connectors/google/oauth/* routes are never mounted (404). Declared here now for
          # the same allowed_envs freeze reason as every var above — arming later by setting the
          # secrets must not be the deploy that first introduces the keys, or they silently
          # never arrive. Armed, the three client vars are MANDATORY: startup refuses to boot
          # the mount without them rather than serving a half-configured OAuth proxy.
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REDIRECT_URI: ${{ secrets.GOOGLE_OAUTH_REDIRECT_URI }}
          GOOGLE_MEET_OAUTH_ENABLED: ${{ secrets.GOOGLE_MEET_OAUTH_ENABLED }}
          # Tunables (repo variables). Unset = the code defaults; a non-positive value is a
          # hard boot error, never a silent revert to the default.
          CONNECTOR_DRAIN_INTERVAL_MS: ${{ vars.CONNECTOR_DRAIN_INTERVAL_MS }}
          CONNECTOR_A_FETCH_CEILING_PER_HOUR: ${{ vars.CONNECTOR_A_FETCH_CEILING_PER_HOUR }}
          CONNECTOR_A_SECRET_READ_CEILING_PER_HOUR: ${{ vars.CONNECTOR_A_SECRET_READ_CEILING_PER_HOUR }}
          # Transcriber (Settings → Transcriber; backend/src/routes/transcriber.ts). Both set ⇒
          # /api/transcriber/meetings mounts; either empty ⇒ the routes do not exist and the card
          # says so. The URL is public (repo var); the tc_live_… project key is a secret and never
          # leaves the backend. Declared in all four places for the allowed_envs freeze reason.
          TRANSCRIPTION_API_URL: ${{ vars.TRANSCRIPTION_API_URL }}
          TRANSCRIPTION_API_KEY: ${{ secrets.TRANSCRIPTION_API_KEY }}
          TRANSCRIPTION_BOT_NAME: ${{ vars.TRANSCRIPTION_BOT_NAME }}
        run: |
          ENV_FILE="$RUNNER_TEMP/phala-prod.env"
          DEPLOY_RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            printf '%s\n' "BACKEND_PRIVATE_KEY=$BACKEND_PRIVATE_KEY"
            printf '%s\n' "TINYCLOUD_HOST=https://tee.node.tinycloud.xyz"
            printf '%s\n' "FRONTEND_URL=$PRODUCTION_FRONTEND_URL"
            printf '%s\n' "REDPILL_API_KEY=$REDPILL_API_KEY"
            printf '%s\n' "REDPILL_BASE_URL=$REDPILL_BASE_URL"
            printf '%s\n' "REDPILL_DEFAULT_MODEL=$REDPILL_DEFAULT_MODEL"
            printf '%s\n' "AGENT_DID=$AGENT_DID"
            printf '%s\n' "ELIZA_SERVICE_URL=$ELIZA_SERVICE_URL"
            printf '%s\n' "ELIZA_SERVICE_SECRET=$ELIZA_SERVICE_SECRET"
            printf '%s\n' "CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN"
            printf '%s\n' "CERTBOT_EMAIL=$CERTBOT_EMAIL"
            printf '%s\n' "TINYCHAT_BACKEND_IMAGE=${DOCKER_IMAGE}:${GITHUB_SHA}"
            printf '%s\n' "TINYCHAT_INGRESS_IMAGE=${INGRESS_IMAGE}:ingress-$GITHUB_SHA"
            printf '%s\n' "TINYCHAT_BUILD_SHA=$GITHUB_SHA"
            printf '%s\n' "TINYCHAT_DEPLOY_RUN_URL=$DEPLOY_RUN_URL"
            printf '%s\n' "PORT=3001"
            printf '%s\n' "PHALA_INGRESS_DOMAIN=$PHALA_INGRESS_DOMAIN"
            printf '%s\n' "PHALA_GATEWAY_CNAME=$PHALA_GATEWAY_CNAME"
            printf '%s\n' "PAYWALL_ENABLED=${PAYWALL_ENABLED:-false}"
            printf '%s\n' "STRIPE_SECRET_KEY=$STRIPE_SECRET_KEY"
            printf '%s\n' "STRIPE_WEBHOOK_SECRET=$STRIPE_WEBHOOK_SECRET"
            printf '%s\n' "STRIPE_PRICE_PLUS_MONTHLY=$STRIPE_PRICE_PLUS_MONTHLY"
            printf '%s\n' "STRIPE_PRICE_PLUS_YEARLY=$STRIPE_PRICE_PLUS_YEARLY"
            printf '%s\n' "STRIPE_PRICE_PRO_MONTHLY=$STRIPE_PRICE_PRO_MONTHLY"
            printf '%s\n' "STRIPE_PRICE_PRO_YEARLY=$STRIPE_PRICE_PRO_YEARLY"
            printf '%s\n' "CREDIT_BUDGET_FREE=$CREDIT_BUDGET_FREE"
            printf '%s\n' "CREDIT_BUDGET_PLUS_WEEKLY=$CREDIT_BUDGET_PLUS_WEEKLY"
            printf '%s\n' "CREDIT_BUDGET_PRO_WEEKLY=$CREDIT_BUDGET_PRO_WEEKLY"
            printf '%s\n' "LEDGER_SERVICE_URL=$LEDGER_SERVICE_URL"
            printf '%s\n' "LEDGER_SERVICE_SECRET=$LEDGER_SERVICE_SECRET"
            printf '%s\n' "LEDGER_AUTHORITATIVE=${LEDGER_AUTHORITATIVE:-false}"
            printf '%s\n' "LEDGER_OUTAGE_POLICY=${LEDGER_OUTAGE_POLICY:-bounded_k}"
            printf '%s\n' "CONNECTOR_WEBHOOKS_ENABLED=${CONNECTOR_WEBHOOKS_ENABLED:-false}"
            printf '%s\n' "WEBHOOK_HMAC_MASTER=$WEBHOOK_HMAC_MASTER"
            printf '%s\n' "WEBHOOK_HMAC_MASTER_PREV=$WEBHOOK_HMAC_MASTER_PREV"
            printf '%s\n' "LOG_HASH_SALT=$LOG_HASH_SALT"
            printf '%s\n' "CONNECTOR_WEBHOOK_PUBLIC_ORIGIN=$CONNECTOR_WEBHOOK_PUBLIC_ORIGIN"
            printf '%s\n' "CONNECTOR_WEBHOOK_HOST_ALLOWLIST=$CONNECTOR_WEBHOOK_HOST_ALLOWLIST"
            printf '%s\n' "CONNECTOR_INGEST_INSTANCE_ID=$CONNECTOR_INGEST_INSTANCE_ID"
            printf '%s\n' "CONNECTOR_BACKEND_INGEST_ENABLED=${CONNECTOR_BACKEND_INGEST_ENABLED:-false}"
            printf '%s\n' "CONNECTOR_CREDENTIAL_MASTER=$CONNECTOR_CREDENTIAL_MASTER"
            printf '%s\n' "CONNECTOR_CONTENT_MASTER=$CONNECTOR_CONTENT_MASTER"
            printf '%s\n' "FIREFLIES_OAUTH_CLIENT_ID=$FIREFLIES_OAUTH_CLIENT_ID"
            printf '%s\n' "FIREFLIES_OAUTH_CLIENT_SECRET=$FIREFLIES_OAUTH_CLIENT_SECRET"
            printf '%s\n' "FIREFLIES_OAUTH_REDIRECT_URI=$FIREFLIES_OAUTH_REDIRECT_URI"
            printf '%s\n' "GOOGLE_OAUTH_CLIENT_ID=$GOOGLE_OAUTH_CLIENT_ID"
            printf '%s\n' "GOOGLE_OAUTH_CLIENT_SECRET=$GOOGLE_OAUTH_CLIENT_SECRET"
            printf '%s\n' "GOOGLE_OAUTH_REDIRECT_URI=$GOOGLE_OAUTH_REDIRECT_URI"
            printf '%s\n' "GOOGLE_MEET_OAUTH_ENABLED=${GOOGLE_MEET_OAUTH_ENABLED:-false}"
            printf '%s\n' "CONNECTOR_DRAIN_INTERVAL_MS=$CONNECTOR_DRAIN_INTERVAL_MS"
            printf '%s\n' "CONNECTOR_A_FETCH_CEILING_PER_HOUR=$CONNECTOR_A_FETCH_CEILING_PER_HOUR"
            printf '%s\n' "CONNECTOR_A_SECRET_READ_CEILING_PER_HOUR=$CONNECTOR_A_SECRET_READ_CEILING_PER_HOUR"
            printf '%s\n' "TRANSCRIPTION_API_URL=$TRANSCRIPTION_API_URL"
            printf '%s\n' "TRANSCRIPTION_API_KEY=$TRANSCRIPTION_API_KEY"
            printf '%s\n' "TRANSCRIPTION_BOT_NAME=$TRANSCRIPTION_BOT_NAME"
          } > "$ENV_FILE"

          echo "::group::Deploy environment keys"
          awk -F= '/^[A-Z0-9_]+=/ {print $1"=<set>"}' "$ENV_FILE"
          echo "::endgroup::"

          echo "Submitting Phala deploy for CVM ${PHALA_CVM_ID}..."
          phala deploy \
            --cvm-id "$PHALA_CVM_ID" \
            -c docker-compose.phala.yml \
            -e "$ENV_FILE" \
            --wait \
            --public-logs

      # `phala deploy` updates the encrypted env but NOT the CVM's registered
      # allowed_envs whitelist (frozen at CVM creation), so env vars added after
      # creation are silently dropped at injection time. This broke /api/agent
      # (web search) on 2026-07-07. Sync the whitelist to the deploy env keys.
      - name: Sync CVM allowed_envs
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
          ENV_FILE: ${{ runner.temp }}/phala-prod.env
        run: |
          mkdir -p "$RUNNER_TEMP/phala-sync"
          cp .github/scripts/phala-sync-allowed-envs.mjs "$RUNNER_TEMP/phala-sync/"
          cd "$RUNNER_TEMP/phala-sync"
          npm init -y >/dev/null
          npm install @phala/cloud@0.3.0
          node phala-sync-allowed-envs.mjs

      - name: Wait for CVM to report running
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
        run: |
          echo "Waiting for CVM to be running (up to 15 minutes)..."
          for i in {1..90}; do
            RAW=$(phala cvms get "$PHALA_CVM_ID" --json)
            STATUS=$(echo "$RAW" | jq -r '.status // "unknown"')
            NAME=$(echo "$RAW" | jq -r '.name // "unknown"')
            UPDATED_AT=$(echo "$RAW" | jq -r '.updated_at // "unknown"')
            APP_ID=$(echo "$RAW" | jq -r '.app_id // empty')
            GATEWAY_BASE_DOMAIN=$(echo "$RAW" | jq -r '.gateway.base_domain // empty')
            echo "Attempt $i/90: name='$NAME' status='$STATUS' updated_at='$UPDATED_AT'"
            if [ "$STATUS" = "running" ]; then
              echo "CVM is running."
              if [ -n "$APP_ID" ] && [ -n "$GATEWAY_BASE_DOMAIN" ]; then
                RAW_API_URL="https://${APP_ID}-3001.${GATEWAY_BASE_DOMAIN}"
                echo "PHALA_RAW_API_URL=$RAW_API_URL" >> "$GITHUB_ENV"
              fi
              {
                echo
                echo "### CVM status"
                echo
                echo "- Status: \`running\`"
                echo "- Last update: \`$UPDATED_AT\`"
                if [ -n "${RAW_API_URL:-}" ]; then
                  echo "- Raw gateway API: ${RAW_API_URL}"
                fi
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$STATUS" = "failed" ] || [ "$STATUS" = "error" ]; then
              echo "::error title=Phala CVM failed::CVM deployment failed with status '$STATUS'"
              echo "$RAW" | jq '{id, name, status, app_id, instance_type, updated_at, created_at}'
              exit 1
            fi
            sleep 10
          done

          echo "::error title=Phala CVM timeout::Timed out waiting for CVM to become running"
          phala cvms get "$PHALA_CVM_ID" --json \
            | jq '{id, name, status, app_id, instance_type, updated_at, created_at}'
          exit 1

      - name: Verify public API
        env:
          # Same expression as the deploy step's env: block — the probe must expect
          # what this deploy actually shipped, never a hard-coded assumption.
          CONNECTOR_WEBHOOKS_ENABLED: ${{ secrets.CONNECTOR_WEBHOOKS_ENABLED || vars.CONNECTOR_WEBHOOKS_ENABLED || 'false' }}
          GOOGLE_MEET_OAUTH_ENABLED: ${{ secrets.GOOGLE_MEET_OAUTH_ENABLED }}
        run: |
          probe_url() {
            local label="$1"
            local url="$2"
            local body_file err_file status exit_code

            echo "Probing $label at $url"
            for i in {1..30}; do
              body_file="$(mktemp)"
              err_file="$(mktemp)"
              set +e
              status="$(curl -sS -o "$body_file" -w "%{http_code}" --connect-timeout 5 --max-time 15 "$url" 2>"$err_file")"
              exit_code=$?
              set -e

              echo "Attempt $i/30: curl_exit=$exit_code http_status=$status"
              if [ -s "$err_file" ]; then
                sed 's/^/curl: /' "$err_file"
              fi
              if [ -s "$body_file" ]; then
                echo "Response body (first 1000 bytes):"
                head -c 1000 "$body_file"
                echo
              fi

              if [ "$exit_code" -eq 0 ] && [[ "$status" =~ ^2 ]]; then
                echo "$label probe passed."
                rm -f "$body_file" "$err_file"
                return 0
              fi

              rm -f "$body_file" "$err_file"
              sleep 10
            done

            echo "::error title=Public API probe failed::$label did not return a 2xx response"
            echo "::group::Verbose curl diagnostics for $label"
            curl -v --max-time 20 "$url" || true
            echo "::endgroup::"
            return 1
          }

          HEALTH_URL="${PRODUCTION_API_URL%/}/health"
          INFO_URL="${PRODUCTION_API_URL%/}/api/server-info"
          if ! probe_url "health" "$HEALTH_URL"; then
            if [ -n "${PHALA_RAW_API_URL:-}" ]; then
              echo "::notice title=Raw Phala gateway diagnostic::Custom domain failed; probing ${PHALA_RAW_API_URL}/health"
              probe_url "raw gateway health" "${PHALA_RAW_API_URL%/}/health" || true
            fi
            exit 1
          fi

          if ! probe_url "server-info" "$INFO_URL"; then
            if [ -n "${PHALA_RAW_API_URL:-}" ]; then
              echo "::notice title=Raw Phala gateway diagnostic::Custom domain failed; probing ${PHALA_RAW_API_URL}/api/server-info"
              probe_url "raw gateway server-info" "${PHALA_RAW_API_URL%/}/api/server-info" || true
            fi
            exit 1
          fi

          # /api/agent mounts only when AGENT_DID / ELIZA_SERVICE_URL /
          # ELIZA_SERVICE_SECRET all reach the backend. Mounted → 401
          # (auth-gated); 404 means the agent env was dropped and web
          # search is silently dead (2026-07-07 regression).
          AGENT_URL="${PRODUCTION_API_URL%/}/api/agent/session"
          echo "Probing agent route at $AGENT_URL (expect 401)"
          AGENT_STATUS=0
          for i in {1..30}; do
            AGENT_STATUS="$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 15 "$AGENT_URL" || echo 000)"
            echo "Attempt $i/30: http_status=$AGENT_STATUS"
            if [ "$AGENT_STATUS" = "401" ]; then
              break
            fi
            sleep 10
          done
          if [ "$AGENT_STATUS" != "401" ]; then
            echo "::error title=Agent route probe failed::GET /api/agent/session returned $AGENT_STATUS (expected 401). The agent router is not mounted — AGENT_DID / ELIZA_SERVICE_URL / ELIZA_SERVICE_SECRET did not reach the backend, so web search is disabled."
            exit 1
          fi
          echo "Agent route probe passed (401 = mounted, auth-gated)."

          # The connector-webhook mount canary, modeled on the agent probe above.
          # The raw delivery route mounts only when CONNECTOR_WEBHOOKS_ENABLED=true
          # AND the HMAC master / log salt reached the backend — the flag alone is
          # not enough, because startup refuses to boot the mount on a weak secret.
          #
          #   flag on  -> 401 (mounted; a junk signature on an unregistered token is
          #               the same generic invalid_signature as every other rejection)
          #   flag off -> 404 (nothing mounted — the dark-ship state)
          #
          # A 404 with the flag ON is the silently-dropped-env failure this exists to
          # catch (the 2026-07-07 class): background sync would be dead with no other
          # signal. A 401 with the flag OFF means the route shipped hot.
          WEBHOOK_URL="${PRODUCTION_API_URL%/}/api/connectors/webhooks/fireflies/probe-token"
          if [ "${CONNECTOR_WEBHOOKS_ENABLED:-false}" = "true" ]; then
            WEBHOOK_EXPECT=401
          else
            WEBHOOK_EXPECT=404
          fi
          echo "Probing connector webhook route at $WEBHOOK_URL (expect $WEBHOOK_EXPECT; flag=${CONNECTOR_WEBHOOKS_ENABLED:-false})"
          WEBHOOK_STATUS=0
          for i in {1..10}; do
            # Junk signature, junk token, minimal JSON body. Nothing here is a valid
            # delivery, so this never enqueues and never touches a real user's queue.
            # X-Requested-With satisfies the global CSRF gate (packages/server/src/csrf.ts),
            # which otherwise 403s every header-less POST BEFORE routing and masks the dark
            # arm's 404. The mounted arm is unaffected: the delivery route matches in the raw
            # window ahead of CSRF and still answers 401 to the junk signature.
            WEBHOOK_STATUS="$(curl -s -o /dev/null -w "%{http_code}" \
              --connect-timeout 5 --max-time 15 \
              -X POST "$WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -H 'X-Requested-With: XMLHttpRequest' \
              -H 'x-hub-signature: sha256=00000000000000000000000000000000000000000000000000000000deadbeef' \
              --data '{"eventType":"probe","meetingId":"deploy-probe"}' || echo 000)"
            echo "Attempt $i/10: http_status=$WEBHOOK_STATUS"
            if [ "$WEBHOOK_STATUS" = "$WEBHOOK_EXPECT" ]; then
              break
            fi
            sleep 6
          done
          if [ "$WEBHOOK_STATUS" != "$WEBHOOK_EXPECT" ]; then
            if [ "$WEBHOOK_EXPECT" = "401" ]; then
              echo "::error title=Connector webhook probe failed::POST /api/connectors/webhooks/fireflies/probe-token returned $WEBHOOK_STATUS (expected 401). CONNECTOR_WEBHOOKS_ENABLED is true but the route is not mounted — WEBHOOK_HMAC_MASTER / LOG_HASH_SALT did not reach the backend (or were rejected as weak), so background sync is silently dead."
            else
              echo "::error title=Connector webhook probe failed::POST /api/connectors/webhooks/fireflies/probe-token returned $WEBHOOK_STATUS (expected 404 while CONNECTOR_WEBHOOKS_ENABLED is not 'true'). The route is mounted on a deploy that was meant to ship dark."
            fi
            exit 1
          fi
          if [ "$WEBHOOK_EXPECT" = "401" ]; then
            echo "Connector webhook probe passed (401 = mounted, signature-gated)."
          else
            echo "Connector webhook probe passed (404 = flag off, nothing mounted)."
          fi

          # WP-A's Google Meet OAuth mount canary, modeled on the webhook probe above.
          # The five /api/connectors/google/oauth/* routes mount only when
          # GOOGLE_MEET_OAUTH_ENABLED=true AND the three client vars reached the
          # backend — the flag alone is not enough, because startup refuses to build
          # the router when any of id/secret/redirect_uri is missing.
          #
          #   flag on  -> 400 (mounted; `/start` validates `state` + `challenge` BEFORE
          #               anything else and a bare param-less GET is `invalid_request`.
          #               A valid pair would 302 to Google, which we deliberately do not
          #               send: this probe must not mint a real authorize URL.)
          #   flag off -> 404 (nothing mounted — the dark-ship state)
          #
          # `/start` is unauthenticated by design (a top-level browser navigation), so
          # the 400 arm is reachable from CI with no credential. A 404 with the flag ON
          # is the silently-dropped-env failure this exists to catch (the 2026-07-07
          # class); a 400 with the flag OFF means the OAuth proxy shipped hot.
          GOOGLE_URL="${PRODUCTION_API_URL%/}/api/connectors/google/oauth/start"
          if [ "${GOOGLE_MEET_OAUTH_ENABLED:-false}" = "true" ]; then
            GOOGLE_EXPECT=400
          else
            GOOGLE_EXPECT=404
          fi
          echo "Probing Google Meet OAuth route at $GOOGLE_URL (expect $GOOGLE_EXPECT; flag=${GOOGLE_MEET_OAUTH_ENABLED:-false})"
          GOOGLE_STATUS=0
          for i in {1..10}; do
            # No `state`, no `challenge`, no credential — this can never become a real
            # authorization attempt, and nothing here is logged or persisted.
            GOOGLE_STATUS="$(curl -s -o /dev/null -w "%{http_code}" \
              --connect-timeout 5 --max-time 15 "$GOOGLE_URL" || echo 000)"
            echo "Attempt $i/10: http_status=$GOOGLE_STATUS"
            if [ "$GOOGLE_STATUS" = "$GOOGLE_EXPECT" ]; then
              break
            fi
            sleep 6
          done
          if [ "$GOOGLE_STATUS" != "$GOOGLE_EXPECT" ]; then
            if [ "$GOOGLE_EXPECT" = "400" ]; then
              echo "::error title=Google Meet OAuth probe failed::GET /api/connectors/google/oauth/start returned $GOOGLE_STATUS (expected 400). GOOGLE_MEET_OAUTH_ENABLED is true but the routes are not mounted — GOOGLE_OAUTH_CLIENT_ID / GOOGLE_OAUTH_CLIENT_SECRET / GOOGLE_OAUTH_REDIRECT_URI did not reach the backend, so the Google Meet connector is silently dead."
            else
              echo "::error title=Google Meet OAuth probe failed::GET /api/connectors/google/oauth/start returned $GOOGLE_STATUS (expected 404 while GOOGLE_MEET_OAUTH_ENABLED is not 'true'). The OAuth proxy is mounted on a deploy that was meant to ship dark."
            fi
            exit 1
          fi
          if [ "$GOOGLE_EXPECT" = "400" ]; then
            # Mounted, so also pin the popup contract: /start must answer with
            # `Cross-Origin-Opener-Policy: unsafe-none`. Helmet's app-wide default is
            # `same-origin`, which severs `window.opener` at the popup's very first
            # response — the callback postMessage then never reaches the app and every
            # connect attempt reports "cancelled". The router-level exemption is the
            # fix; this catches the helmet default resurfacing on the popup surfaces.
            GOOGLE_COOP="$(curl -s -o /dev/null -D - \
              --connect-timeout 5 --max-time 15 "$GOOGLE_URL" \
              | tr -d '\r' | tr '[:upper:]' '[:lower:]' \
              | sed -n 's/^cross-origin-opener-policy: *//p' | head -n 1)"
            echo "Google Meet OAuth /start cross-origin-opener-policy=${GOOGLE_COOP:-<absent>}"
            if [ "$GOOGLE_COOP" != "unsafe-none" ]; then
              echo "::error title=Google Meet OAuth COOP probe failed::GET /api/connectors/google/oauth/start answered with Cross-Origin-Opener-Policy '${GOOGLE_COOP:-<absent>}' (expected 'unsafe-none'). Helmet's same-origin default severs window.opener in the OAuth popup, so the callback postMessage never reaches the app and every Google Meet connect attempt fails as 'cancelled'."
              exit 1
            fi
            echo "Google Meet OAuth probe passed (400 = mounted, param-gated; COOP=unsafe-none)."
          else
            echo "Google Meet OAuth probe passed (404 = flag off, nothing mounted)."
          fi

          {
            echo
            echo "### Public API probes"
            echo
            echo "- ${HEALTH_URL}: passed"
            echo "- ${INFO_URL}: passed"
            echo "- ${AGENT_URL}: passed (401 = agent route mounted)"
            if [ "$WEBHOOK_EXPECT" = "401" ]; then
              echo "- ${WEBHOOK_URL}: passed (401 = connector webhook route mounted)"
            else
              echo "- ${WEBHOOK_URL}: passed (404 = connector webhooks shipped dark)"
            fi
            if [ "$GOOGLE_EXPECT" = "400" ]; then
              echo "- ${GOOGLE_URL}: passed (400 = Google Meet OAuth routes mounted)"
            else
              echo "- ${GOOGLE_URL}: passed (404 = Google Meet OAuth shipped dark)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  phala-status:
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Publish Phala deployment status
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$DEPLOY_RESULT" in
            success)
              STATE=success
              DESCRIPTION="Phala deployment and API probe succeeded"
              ;;
            cancelled)
              STATE=error
              DESCRIPTION="Phala deployment cancelled"
              ;;
            skipped)
              STATE=error
              DESCRIPTION="Phala deployment skipped"
              ;;
            *)
              STATE=failure
              DESCRIPTION="Phala deployment or API probe failed"
              ;;
          esac

          gh api \
            --method POST \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context="tinychat-backend - phala" \
            -f description="$DESCRIPTION" \
            -f target_url="$TARGET_URL"
