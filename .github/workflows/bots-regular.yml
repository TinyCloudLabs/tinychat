name: Regular bots runtime

# The regular runtime (bots-regular/) is a standalone package that reuses the bots service's code (bots/src), so it
# runs on every PR that touches either. Its tests use sandboxes on the runner (real bridges, a stand-in agent); the
# real Google Cloud check (bots-regular/scripts/real-cluster-check.ts) is opt-in and runs by hand.

on:
  pull_request:
    paths:
      - "bots-regular/**"
      - "bots/**"
      - ".github/workflows/bots-regular.yml"

permissions:
  contents: read

concurrency:
  group: bots-regular-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bots-regular:
    name: Regular bots runtime tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-bots-regular-${{ runner.os }}-${{ hashFiles('bots/bun.lock', 'bots-regular/bun.lock') }}
      - name: Install
        run: |
          (cd bots && bun install --frozen-lockfile)
          (cd bots-regular && bun install --frozen-lockfile)

      - name: Unit tests
        working-directory: bots-regular
        run: bun test src

      - name: Typecheck
        working-directory: bots-regular
        run: bunx tsc --noEmit
