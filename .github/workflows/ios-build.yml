name: iOS build (Exo)

# The one Exo iOS release build, called by mobile.yml (CI: an unsigned dry run on every iOS change) and
# ios-testflight.yml (signed, checked and uploaded to TestFlight), so CI exercises the release path even before any
# Apple account exists. Two jobs, so the App Store Connect key is never on a runner that runs project or third-party
# build code:
#
# - archive (no environment, no secret, ever): the production frontend (`bun run build:frontend`, .env.production)
#   bundled by `cap sync ios` with EXO_DEV_SERVER_URL unset, archived unsigned (CODE_SIGNING_ALLOWED=NO, no team). The
#   archive check refuses a capacitor.config.json with a server URL, a missing public/index.html or privacy manifest,
#   the wrong bundle id or versions, the Debug-only smoke probe, and any trace of the Debug-only location spike
#   (TC-524: location usage strings, the location background mode, its code or CoreLocation). The checked .xcarchive
#   (ditto-zipped, so the executable bits survive) is handed to the sign job as a short-lived artifact; archive.log is
#   uploaded for debugging.
# - sign (sign: true: the `ios-release` environment; otherwise a dry run with no environment): checks out only
#   scripts/release at the workflow commit and runs no project code. In a dry run it only downloads, unpacks and
#   re-checks the archive, so CI proves the hand-off. Signed: "Verify signing provenance" first, then the API key is
#   written and `xcodebuild -exportArchive` signs the app and its frameworks for App Store distribution with Xcode's
#   cloud-managed certificate (-allowProvisioningUpdates creates the distribution certificate and App Store profile on
#   first use; the team comes from ExportOptions.plist's teamID). scripts/release/ios-signing.sh verify-ipa then
#   requires an App Store signature from APPLE_TEAM_ID before anything leaves the runner: mode `validate` asks App
#   Store Connect to validate that .ipa; mode `upload` sends exactly that .ipa (`altool --upload-app`, its SHA-256
#   re-checked first). Neither the .ipa nor any signing log is uploaded as an artifact (the repository is public);
#   signing output goes to the job log only, where secrets are masked. Any failed check fails the build; there is no
#   unsigned fallback.
#
# Signing at archive time instead would need a development certificate whose private key an ephemeral runner never
# has, so every run would mint a new one until Apple's limit, plus a registered device for the development profile.
#
# Versions: scripts/release/ios-bundle-versions.mjs. CFBundleShortVersionString is the product version in
# frontend/package.json without the beta suffix (0.2.0-beta.2 -> 0.2.0); CFBundleVersion is the caller's build
# number (TestFlight: the run number). Both reach Info.plist as MARKETING_VERSION / CURRENT_PROJECT_VERSION.

on:
  workflow_call:
    inputs:
      build-number:
        description: CFBundleVersion (TestFlight passes the run number)
        type: string
        required: true
      sign:
        description: Sign for App Store distribution and send to App Store Connect (ios-testflight.yml on main only)
        type: boolean
        default: false
      mode:
        description: "With sign: upload (to TestFlight) or validate (App Store Connect validates, nothing is uploaded)"
        type: string
        default: validate
    outputs:
      version:
        description: frontend/package.json version that was built
        value: ${{ jobs.archive.outputs.version }}
      short-version:
        description: CFBundleShortVersionString of the build
        value: ${{ jobs.archive.outputs.short-version }}
      build-number:
        description: CFBundleVersion of the build
        value: ${{ jobs.archive.outputs.build-number }}
      signed:
        description: true only when the exported .ipa passed every App Store signing check
        value: ${{ jobs.sign.outputs.signed }}
      uploaded:
        description: true only when the verified .ipa was uploaded to App Store Connect
        value: ${{ jobs.sign.outputs.uploaded }}

permissions:
  contents: read

jobs:
  archive:
    name: iOS release archive (unsigned, no secrets)
    # Pinned like the desktop build: macos-26 runner, Xcode 26.6 (App Store uploads need a current SDK).
    runs-on: macos-26
    # No environment: this job runs bun install, the Vite build, cap sync and xcodebuild with every build phase and
    # Swift package, and no secret is in reach of any of them.
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    timeout-minutes: 60
    outputs:
      version: ${{ steps.versions.outputs.version }}
      short-version: ${{ steps.versions.outputs.short-version }}
      build-number: ${{ steps.versions.outputs.build-number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.9"

      - name: Require pinned Xcode
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          mkdir -p "$RUNNER_TEMP/ios-logs"
          echo "ARCHIVE=$RUNNER_TEMP/Exo.xcarchive" >> "$GITHUB_ENV"
          echo "LOGS=$RUNNER_TEMP/ios-logs" >> "$GITHUB_ENV"

      - name: Install JS deps
        run: bun install --frozen-lockfile

      # VITE_EXO_CHANNEL tells the bundled frontend its channel (TC-840): the archive strips
      # "-beta.N" from CFBundleShortVersionString, so App.getInfo() alone would call a beta "stable".
      - name: Build workspace packages and the production frontend
        run: |
          version=$(node -p 'require("./frontend/package.json").version')
          case "$version" in
            *-beta.*) export VITE_EXO_CHANNEL=beta ;;
            *) export VITE_EXO_CHANNEL=stable ;;
          esac
          bun run build:packages && bun run build:frontend

      # Bundles frontend/dist into App/public; without EXO_DEV_SERVER_URL there is no server.url (no live reload).
      - name: Sync Capacitor
        run: env -u EXO_DEV_SERVER_URL bun run --cwd mobile sync ios

      - name: Bundle versions
        id: versions
        env:
          BUILD_NUMBER: ${{ inputs.build-number }}
        run: node scripts/release/ios-bundle-versions.mjs --build-number "$BUILD_NUMBER"

      # Unsigned and without a team: the sign job's export signs it (team from ExportOptions.plist).
      - name: Archive Exo for iOS
        working-directory: mobile/ios/App
        env:
          SHORT_VERSION: ${{ steps.versions.outputs.short-version }}
          BUILD_NUMBER: ${{ steps.versions.outputs.build-number }}
        run: |
          if ! xcodebuild archive -project App.xcodeproj -scheme App -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$ARCHIVE" \
            MARKETING_VERSION="$SHORT_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" >"$LOGS/archive.log" 2>&1; then
            grep -E 'error:' "$LOGS/archive.log" | head -40
            tail -60 "$LOGS/archive.log"
            echo "::error::xcodebuild archive failed (full log: archive.log in the logs artifact)"
            exit 1
          fi
          grep -E '^\*\* |warning: ' "$LOGS/archive.log" | sort -u | head -40

      - name: Check the archive
        env:
          SHORT_VERSION: ${{ steps.versions.outputs.short-version }}
          BUILD_NUMBER: ${{ steps.versions.outputs.build-number }}
        run: |
          app="$ARCHIVE/Products/Applications/App.app"
          plist="$app/Info.plist"
          fail() { echo "::error::$1"; exit 1; }
          value() { /usr/libexec/PlistBuddy -c "Print :$1" "$plist" 2>/dev/null; }
          [ "$(value CFBundleIdentifier)" = xyz.tinycloud.exo ] || fail "CFBundleIdentifier is $(value CFBundleIdentifier)"
          [ "$(value CFBundleShortVersionString)" = "$SHORT_VERSION" ] || fail "CFBundleShortVersionString is $(value CFBundleShortVersionString), expected $SHORT_VERSION"
          [ "$(value CFBundleVersion)" = "$BUILD_NUMBER" ] || fail "CFBundleVersion is $(value CFBundleVersion), expected $BUILD_NUMBER"
          appex="$app/PlugIns/ExoWidgets.appex"
          [ -d "$appex" ] || fail "ExoWidgets.appex is missing"
          widget_plist="$appex/Info.plist"
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$widget_plist")" = xyz.tinycloud.exo.widgets ] || fail "ExoWidgets has the wrong bundle ID"
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$widget_plist")" = "$BUILD_NUMBER" ] || fail "ExoWidgets has the wrong build number"
          [ "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$widget_plist")" = com.apple.widgetkit-extension ] || fail "ExoWidgets is not a WidgetKit extension"
          [ "$(value NSSupportsLiveActivities)" = true ] || fail "NSSupportsLiveActivities is not true"
          plutil -lint "$appex/PrivacyInfo.xcprivacy" || fail "ExoWidgets privacy manifest is missing or invalid"
          [ "$(value CAPACITOR_DEBUG)" != true ] || fail "CAPACITOR_DEBUG is true in a Release build"
          value NSMicrophoneUsageDescription >/dev/null || fail "NSMicrophoneUsageDescription is missing"
          plutil -extract UIBackgroundModes json -o - "$plist" | jq -e 'index("audio") != null' >/dev/null || fail "UIBackgroundModes lacks audio"
          plutil -lint "$app/PrivacyInfo.xcprivacy" || fail "PrivacyInfo.xcprivacy is missing or invalid"
          [ "$(plutil -extract NSPrivacyTracking raw "$app/PrivacyInfo.xcprivacy")" = false ] || fail "NSPrivacyTracking is not false"
          test -f "$app/public/index.html" || fail "the bundled web app (public/index.html) is missing"
          jq -e '(.server.url // null) == null' "$app/capacitor.config.json" >/dev/null || fail "capacitor.config.json has a server.url: a dev server build, not the bundled app"
          if grep -a -q EXO_SMOKE "$app/App"; then fail "the Release binary contains the Debug-only smoke probe"; fi
          # Health spike (TC-525): HealthKit code and entitlements are Debug-only until the App ID has the capability.
          if otool -L "$app/App" | grep -q HealthKit; then fail "the Release binary links HealthKit (mobile/docs/health-spike.md)"; fi
          # TC-524: the location spike is Debug-only. A Release with location keys or code needs App Review's
          # location justification and new privacy answers first (mobile/docs/location-spike.md).
          for key in NSLocationWhenInUseUsageDescription NSLocationAlwaysAndWhenInUseUsageDescription NSLocationAlwaysUsageDescription; do
            if value "$key" >/dev/null; then fail "the Release Info.plist has $key (the location spike is Debug-only)"; fi
          done
          plutil -extract UIBackgroundModes json -o - "$plist" | jq -e 'index("location") == null' >/dev/null || fail "UIBackgroundModes has location in a Release build"
          if grep -a -q EXO_LOCATION_SPIKE "$app/App"; then fail "the Release binary contains the Debug-only location spike"; fi
          if otool -L "$app/App" | grep -q CoreLocation.framework; then fail "the Release binary links CoreLocation (the location spike is Debug-only)"; fi
          echo "Exo $(value CFBundleShortVersionString) ($(value CFBundleVersion)), $(value CFBundleIdentifier), $(du -sh "$app" | cut -f1)"
          ls "$app/Frameworks"
          {
            echo "### Exo iOS $(value CFBundleShortVersionString) ($(value CFBundleVersion))"
            echo
            echo "Release archive of \`$(git rev-parse --short HEAD)\` with the bundled production frontend, privacy manifest and no dev server URL."
          } >> "$GITHUB_STEP_SUMMARY"

      # ditto keeps the bundle's symlinks, permissions and extended attributes (upload-artifact would drop them).
      - name: Package the archive
        run: ditto -c -k --sequesterRsrc --keepParent "$ARCHIVE" "$RUNNER_TEMP/Exo.xcarchive.zip"

      # Unsigned, built by this public repository's code, so nothing in it is secret. Overwritten by a full re-run;
      # "re-run failed jobs" signs this one again.
      - name: Hand the archive to the sign job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exo-ios-xcarchive
          if-no-files-found: error
          overwrite: true
          retention-days: 3
          path: ${{ runner.temp }}/Exo.xcarchive.zip

      # No secret exists in this job, so its log can be public.
      - name: Upload the archive log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exo-ios-archive-${{ inputs.build-number }}-logs
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14
          path: ${{ runner.temp }}/ios-logs

  sign:
    name: ${{ inputs.sign && format('Sign and {0} (ios-release)', inputs.mode) || 'Sign (dry run, no secrets)' }}
    needs: archive
    runs-on: macos-26
    # Signing secrets live only in this environment (deployment branches: main; add a required reviewer, it holds an
    # App Store Connect Admin key: mobile/README.md, "iOS release"). This job checks out nothing but scripts/release
    # at the workflow commit and runs no project code: no bun, no Capacitor, no xcodebuild build.
    environment: ${{ inputs.sign && 'ios-release' || '' }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      MODE: ${{ inputs.mode }}
    timeout-minutes: 30
    outputs:
      signed: ${{ steps.verify.outputs.signed || 'false' }}
      uploaded: ${{ steps.upload.outputs.uploaded || 'false' }}
    steps:
      # The only checkout: the release tooling from the workflow's own commit, with history for the provenance check.
      - name: Check out the release tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: scripts/release
          fetch-depth: ${{ inputs.sign && '0' || '1' }}
          persist-credentials: false

      # Before any secret is referenced: only main's ios-testflight.yml, signing an archive of a commit of main.
      - name: Verify signing provenance
        if: inputs.sign
        env:
          EXPECTED: ${{ github.repository }}/.github/workflows/ios-testflight.yml@refs/heads/main
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          fail() { echo "::error::Refusing to sign: $1"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] || [ "$GITHUB_REF" != refs/heads/main ] || [ "$WORKFLOW_REF" != "$EXPECTED" ]; then
            fail "signing runs only in $EXPECTED dispatched on main (got $GITHUB_EVENT_NAME, $GITHUB_REF, $WORKFLOW_REF)"
          fi
          case "$MODE" in upload | validate) ;; *) fail "mode must be upload or validate, got '$MODE'" ;; esac
          git fetch --force --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$WORKFLOW_SHA" origin/main || fail "workflow commit $WORKFLOW_SHA is not on main"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || fail "the archived commit $GITHUB_SHA is not on main"
          echo "Signing the archive of $GITHUB_SHA with $WORKFLOW_REF at $WORKFLOW_SHA ($MODE)"

      - name: Check signing secrets
        if: inputs.sign
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: scripts/release/ios-signing.sh check

      - name: Require pinned Xcode
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          echo "ARCHIVE=$RUNNER_TEMP/Exo.xcarchive" >> "$GITHUB_ENV"

      - name: Download the archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: exo-ios-xcarchive
          path: ${{ runner.temp }}/xcarchive-download

      # The archive job already checked its contents; this proves the hand-off kept the bundle intact.
      - name: Unpack the archive
        env:
          SHORT_VERSION: ${{ needs.archive.outputs.short-version }}
          BUILD_NUMBER: ${{ needs.archive.outputs.build-number }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          ditto -x -k "$RUNNER_TEMP/xcarchive-download/Exo.xcarchive.zip" "$RUNNER_TEMP"
          app="$ARCHIVE/Products/Applications/App.app"
          plist="$app/Info.plist"
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = xyz.tinycloud.exo ] || fail "the archive is not xyz.tinycloud.exo"
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = "$SHORT_VERSION" ] || fail "the archive is not version $SHORT_VERSION"
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" = "$BUILD_NUMBER" ] || fail "the archive is not build $BUILD_NUMBER"
          test -x "$app/App" || fail "App.app/App lost its executable bit in the hand-off"
          test -f "$ARCHIVE/Info.plist" || fail "the .xcarchive has no Info.plist"
          echo "Exo $SHORT_VERSION ($BUILD_NUMBER) archive unpacked: $(du -sh "$ARCHIVE" | cut -f1)"

      # Written only now, on a runner that never ran a build script.
      - name: Write the App Store Connect API key
        if: inputs.sign
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          key=$(scripts/release/ios-signing.sh write-key "$RUNNER_TEMP/private_keys")
          echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"

      # A throwaway default keychain for the export's signing identity, removed at the end.
      - name: Create a temporary keychain
        if: inputs.sign
        run: |
          keychain="$RUNNER_TEMP/exo-signing.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$keychain"
          echo "EXO_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      # The team is ExportOptions.plist's teamID (the archive has none). Output goes to the masked job log only.
      - name: Export and sign for the App Store
        if: inputs.sign
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$ARCHIVE" -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -allowProvisioningUpdates \
            -authenticationKeyPath "$APPLE_API_KEY_PATH" -authenticationKeyID "$APPLE_API_KEY" -authenticationKeyIssuerID "$APPLE_API_ISSUER"

      - name: Verify the App Store signature
        id: verify
        if: inputs.sign
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ipa=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)
          [ -n "$ipa" ] || { echo "::error::the export produced no .ipa"; exit 1; }
          ls -lh "$ipa"
          scripts/release/ios-signing.sh verify-ipa "$ipa"
          {
            echo "ipa=$ipa"
            echo "sha256=$(shasum -a 256 "$ipa" | cut -d' ' -f1)"
            echo "signed=true"
          } >> "$GITHUB_OUTPUT"

      # App Store Connect's server-side checks without uploading (run from RUNNER_TEMP so altool finds
      # private_keys/AuthKey_<id>.p8).
      - name: Validate with App Store Connect
        if: inputs.sign && inputs.mode == 'validate'
        env:
          IPA: ${{ steps.verify.outputs.ipa }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          cd "$RUNNER_TEMP"
          xcrun altool --validate-app -f "$IPA" -t ios --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"

      # Exactly the .ipa verify-ipa passed: same path, same SHA-256. Never a second export.
      - name: Upload to TestFlight
        id: upload
        if: inputs.sign && inputs.mode == 'upload'
        env:
          SIGNED: ${{ steps.verify.outputs.signed }}
          IPA: ${{ steps.verify.outputs.ipa }}
          IPA_SHA256: ${{ steps.verify.outputs.sha256 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ "$SIGNED" != true ]; then
            echo "::error::Refusing to upload: the build did not pass the App Store signing checks. Exo is never uploaded unsigned."
            exit 1
          fi
          if [ -z "$IPA_SHA256" ] || [ "$(shasum -a 256 "$IPA" | cut -d' ' -f1)" != "$IPA_SHA256" ]; then
            echo "::error::Refusing to upload: $IPA is not the .ipa that passed verify-ipa"
            exit 1
          fi
          cd "$RUNNER_TEMP"
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"
          echo "uploaded=true" >> "$GITHUB_OUTPUT"

      - name: Remove the API key, keychain and export
        if: always() && inputs.sign
        run: |
          rm -rf "$RUNNER_TEMP/private_keys" "$RUNNER_TEMP/export"
          if [ -n "${EXO_KEYCHAIN:-}" ]; then security delete-keychain "$EXO_KEYCHAIN" || true; fi
