name: Changeset

# Every PR must add a changeset (`bunx changeset`, or `bunx changeset add --empty` when nothing ships),
# and changesets may only name the release units.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: changeset-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changeset:
    name: Changeset
    # The Version Packages PR consumes changesets rather than adding one.
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_REF: origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Changesets CLI v3 requires Node ^22.11 || ^24.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Changesets status
        run: bunx changeset status --since="$BASE_REF"

      - name: Release invariants and required changeset
        run: node scripts/release/check.mjs --since "$BASE_REF"

      - name: Release script tests
        run: node --test scripts/__tests__/release.test.mjs
