name: Mobile (Exo)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "mobile/**"
      - "frontend/src/lib/voiceNotes/**"
      - "frontend/src/chat/VoiceNotesSection.tsx"
      - "frontend/src/lib/health/**"
      - "frontend/src/chat/HealthSpikeSection.tsx"
      - "frontend/src/lib/location/**"
      - "frontend/src/chat/LocationSpikeSection.tsx"
      - ".github/workflows/mobile.yml"
      - ".github/workflows/ios-build.yml"
      - ".github/workflows/ios-testflight.yml"
      - "scripts/release/ios-*"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "frontend/**"
      - "packages/**"
      - ".github/workflows/mobile.yml"
      - ".github/workflows/ios-build.yml"
      - ".github/workflows/ios-testflight.yml"
      - "scripts/release/ios-*"

permissions:
  contents: read

jobs:
  android:
    name: Android (debug APK)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # gradle-wrapper.jar must be a published Gradle wrapper; gradle-wrapper.properties pins the distribution's SHA-256.
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.9"

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Build workspace packages and frontend
        run: bun run build:packages && bun run build:frontend

      - name: Sync Capacitor
        run: bun run --cwd mobile sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exo-android-debug-${{ github.sha }}
          if-no-files-found: error
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    name: iOS (simulator build and smoke test)
    # Same pin as the iOS release build (ios-build.yml) and desktop: macos-26 runner, Xcode 26.6.
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.9"

      - name: Require pinned Xcode
        run: test -d "$DEVELOPER_DIR"

      # A first boot takes minutes on the runner; let it run while the app builds.
      - name: Start booting an iOS Simulator
        run: mobile/scripts/ios-simulator-smoke.sh boot "$RUNNER_TEMP/ios-smoke"

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Build workspace packages and frontend
        run: bun run build:packages && bun run build:frontend

      - name: Sync Capacitor
        run: bun run --cwd mobile sync ios

      # Debug build: CAPACITOR_DEBUG logging and the EXO_SMOKE probe in ExoBridgeViewController.
      - name: Build for iOS Simulator
        working-directory: mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

      - name: Zip simulator app
        run: |
          cd mobile/ios/App/build/Build/Products/Debug-iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent App.app Exo-iphonesimulator.app.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exo-ios-simulator-${{ github.sha }}
          if-no-files-found: error
          path: mobile/ios/App/build/Build/Products/Debug-iphonesimulator/Exo-iphonesimulator.app.zip

      # Boots a simulator, installs and launches the app with the mic granted, and fails unless it stays up with
      # the bundled web app mounted and the VoiceNotes plugin answering over the bridge.
      - name: Smoke test on an iOS Simulator
        id: smoke
        timeout-minutes: 15
        run: mobile/scripts/ios-simulator-smoke.sh run mobile/ios/App/build/Build/Products/Debug-iphonesimulator/App.app "$RUNNER_TEMP/ios-smoke"

      - name: Upload smoke screenshot and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exo-ios-smoke-${{ github.sha }}
          if-no-files-found: warn
          path: ${{ runner.temp }}/ios-smoke

      # Health spike (TC-525), never fails the job. With no Apple team there is no provisioning profile, so the question
      # is whether an ad-hoc signed ("Sign to Run Locally") simulator build, which embeds the Debug configuration's
      # HealthKit entitlements, can authorize HealthKit and read. Rebuilds the same Debug build signed, then
      # mobile/scripts/ios-health-probe.sh drives the Health plugin and answers the Health sheet with AXe.
      - name: "HealthKit spike: ad-hoc signed simulator build"
        id: health-build
        if: always() && steps.smoke.outcome != 'skipped'
        continue-on-error: true
        working-directory: mobile/ios/App
        run: |
          if ! xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=YES CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= build >"$RUNNER_TEMP/health-build.log" 2>&1; then
            grep -E 'error:' "$RUNNER_TEMP/health-build.log" | head -40
            tail -40 "$RUNNER_TEMP/health-build.log"
            exit 1
          fi
          grep -E 'Signing Identity|entitlements|xcent' "$RUNNER_TEMP/health-build.log" | sort -u | head -20

      - name: "HealthKit spike: authorize, write samples, read 7 days"
        if: always() && steps.health-build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        run: |
          brew install cameroncooke/axe/axe >/dev/null 2>&1 || echo "AXe unavailable: nothing will answer the Health sheet"
          mobile/scripts/ios-health-probe.sh mobile/ios/App/build/Build/Products/Debug-iphonesimulator/App.app \
            "$RUNNER_TEMP/ios-health" "$RUNNER_TEMP/ios-smoke/device.txt"

      - name: "HealthKit spike: upload probe output"
        if: always() && steps.health-build.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exo-ios-health-${{ github.sha }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/ios-health
            ${{ runner.temp }}/health-build.log

  # The TestFlight build (ios-build.yml) minus signing: Release archive of the production frontend, versions,
  # privacy manifest and bundle checks, then the sign job's dry run (no environment, no secrets): it downloads and
  # unpacks the archive from the release tooling checkout. ios-testflight.yml adds only the export, signature check
  # and upload in that job.
  ios-release:
    name: iOS release
    uses: ./.github/workflows/ios-build.yml
    with:
      build-number: ${{ github.run_number }}
