name: Mobile (Exo)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "mobile/**"
      - "frontend/src/lib/voiceNotes/**"
      - "frontend/src/chat/VoiceNotesSection.tsx"
      - ".github/workflows/mobile.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "frontend/**"
      - "packages/**"
      - ".github/workflows/mobile.yml"

jobs:
  android:
    name: Android (debug APK)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.9"

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Build workspace packages and frontend
        run: bun run build:packages && bun run build:frontend

      - name: Sync Capacitor
        run: bun run --cwd mobile sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exo-android-debug-${{ github.sha }}
          if-no-files-found: error
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    name: iOS (simulator build, unsigned)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.9"

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Build workspace packages and frontend
        run: bun run build:packages && bun run build:frontend

      - name: Sync Capacitor
        run: bun run --cwd mobile sync ios

      # Compile check only: no signing identity on the runner. Device builds
      # and TestFlight need an App Store Connect key (not wired yet).
      - name: Build for iOS Simulator
        working-directory: mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

      - name: Upload simulator app
        run: |
          cd mobile/ios/App/build/Build/Products/Debug-iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent App.app Exo-iphonesimulator.app.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exo-ios-simulator-${{ github.sha }}
          if-no-files-found: error
          path: mobile/ios/App/build/Build/Products/Debug-iphonesimulator/Exo-iphonesimulator.app.zip
