name = "tinychat"
pages_build_output_dir = "frontend/dist"
compatibility_date = "2026-05-12"

# This file is the source of truth for the Pages project's environment variables:
# Pages Git builds receive these [vars] as build environment variables, and
# variables set in the Cloudflare dashboard are ignored. Vite bakes VITE_*
# values in at build time; anything not set here comes from
# frontend/.env.production, which every build reads, mobile builds included.
#
# Top-level [vars] apply to preview builds. Production builds use
# [env.production.vars] instead; vars are not inherited, so every production
# value is listed there.
[vars]
VITE_OPENKEY_HOST = "https://openkey.so"
VITE_BACKEND_URL = "https://api.tinycloud.chat"
# One Apps with One's new navigation on previews and production web (TC-3650).
VITE_ONE_APPS = "true"
VITE_ONE_NAV = "true"
# Add an app is still being worked out: previews only, never production.
VITE_ONE_ADD_APP = "true"

[env.production.vars]
VITE_OPENKEY_HOST = "https://openkey.so"
VITE_BACKEND_URL = "https://api.tinycloud.chat"
VITE_ONE_APPS = "true"
VITE_ONE_NAV = "true"
VITE_GRANOLA_CONNECTOR_ENABLED = "true"
VITE_FIREFLIES_SERVER_IMPORT_ENABLED = "true"
