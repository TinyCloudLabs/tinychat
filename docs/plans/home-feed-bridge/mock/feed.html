<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,">
<title>Home feed · Mock 5</title>
<style>
/* Home's zinc palette (frontend/src/index.css), light first, dark from the phone's setting. */
:root {
  --bg: #ffffff; --fg: #09090b; --fg2: #3f3f46; --muted: #63636c; --s2: #f4f4f5; --line: #e4e4e7; --line2: #d4d4d8;
  --raised: #ffffff; --raised-line: #c9c9d1; --raised-shadow: 0 1px 2px rgb(0 0 0 / .05), 0 12px 28px -12px rgb(0 0 0 / .28);
  --primary: #18181b; --on-primary: #fafafa; --selected: rgb(24 24 27 / .07); --ring: #18181b;
  --need-bg: #fef3c7; --need-fg: #8a3a06; --need-text: #a4480a; --need-dot: #d97706;
  --done-bg: #dcfce7; --done-fg: #166534; --done-text: #15803d; --new: #2563eb;
  /* One colour per project, everywhere: Bridge, Home feed, Website, Personal. */
  --p0b: #dbeafe; --p0f: #1e40af; --p1b: #cffafe; --p1f: #155e75; --p2b: #fae8ff; --p2f: #86198f; --p3b: #ffe4e6; --p3f: #9f1239;
  --scrim: rgb(9 9 11 / .45);
  --serif: "Literata Variable", Literata, Georgia, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --quick: 150ms; --fast: 220ms; --ease: cubic-bezier(0.22, 1, 0.36, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #09090b; --fg: #fafafa; --fg2: #d4d4d8; --muted: #a1a1aa; --s2: #222228; --line: #27272a; --line2: #3f3f46;
    --raised: #16161b; --raised-line: #45454f; --raised-shadow: 0 14px 34px -10px rgb(0 0 0 / .7);
    --primary: #fafafa; --on-primary: #18181b; --selected: rgb(250 250 250 / .09); --ring: #d4d4d8;
    --need-bg: #2f2a12; --need-fg: #f0d98a; --need-text: #f5c451; --need-dot: #f5c451;
    --done-bg: #10301c; --done-fg: #86e0a6; --done-text: #6fd894; --new: #60a5fa;
    --p0b: rgb(59 130 246 / .18); --p0f: #a5c8ff; --p1b: rgb(6 182 212 / .16); --p1f: #7fe3f3; --p2b: rgb(217 70 239 / .16); --p2f: #f2b5fb; --p3b: rgb(244 63 94 / .16); --p3f: #fdb0bb;
    --scrim: rgb(0 0 0 / .6);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.45 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; overflow-wrap: break-word; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; text-align: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
#app { max-width: 480px; margin: 0 auto; padding: 10px 16px calc(32px + env(safe-area-inset-bottom)); }
.ic { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 44px; padding: 0 16px; border: 1px solid var(--line2); border-radius: 12px; background: var(--bg); font-weight: 500; font-size: 15.5px; white-space: nowrap; transition: background var(--quick); }
.btn:active { background: var(--s2); }
.btn:disabled { opacity: .45; }
.btn.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.btn.wide { width: 100%; }
.btn .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--need-dot); }
.msgbtn { max-width: 100%; background: transparent; color: var(--fg2); font-size: 15px; padding: 10px 14px 10px 12px; white-space: normal; text-align: left; line-height: 1.3; }
.msgbtn .ic { width: 17px; height: 17px; }
.link { display: inline-flex; align-items: center; min-height: 44px; padding: 0 8px; border-radius: 10px; font-size: 15px; color: var(--fg2); text-decoration: underline; text-decoration-color: var(--line2); text-underline-offset: 4px; }
.link:active { background: var(--s2); }
.link[aria-expanded="true"] { color: var(--fg); text-decoration-color: currentColor; }
.link:disabled { opacity: .4; }

/* Header */
.mocklabel { margin: 0; font-size: 12.5px; color: var(--muted); }
.titlerow { display: flex; align-items: center; gap: 8px; margin: 10px 0 2px; }
.h1 { flex: 1; margin: 0; font: 650 34px/1.1 var(--serif); letter-spacing: -.01em; }
.count { margin: 0; color: var(--muted); font-size: 15.5px; }
.count b { color: var(--fg); font-weight: 600; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 14px 0 4px; }
.seg { display: inline-flex; padding: 2px; border: 1px solid var(--line2); border-radius: 13px; background: var(--bg); }
.seg button { min-height: 44px; min-width: 62px; padding: 0 12px; border-radius: 11px; font-size: 15px; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--s2); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line2); }

/* Section headings */
.sec { display: flex; align-items: baseline; justify-content: space-between; margin: 26px 2px 4px; font-size: 12.5px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.sec b { font-weight: 650; color: var(--fg); }
.proj { margin: 14px 2px 0; padding-bottom: 2px; font-size: 13px; font-weight: 600; color: var(--fg2); display: flex; align-items: center; gap: 8px; }
.proj::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.empty { margin: 8px 2px 4px; color: var(--muted); font-size: 15px; }

/* Agent mark and platform chip */
.av { display: inline-grid; place-items: center; flex: none; width: 36px; height: 36px; border-radius: 50%; color: #fff; font-weight: 650; font-size: 15px; line-height: 1; user-select: none; }
.av.sm { width: 30px; height: 30px; font-size: 13px; }
.av.lg { width: 48px; height: 48px; font-size: 19px; }
.plat { display: inline-flex; align-items: center; gap: 5px; max-width: 100%; border: 1px solid var(--line2); border-radius: 999px; padding: 1px 8px 1px 6px; font-size: 12px; font-weight: 500; line-height: 18px; color: var(--fg); white-space: nowrap; vertical-align: middle; }
.plat.txt { padding: 1px 8px; color: var(--fg2); }
.plat .pm { display: inline-flex; width: 13px; height: 13px; flex: none; }
.plat .pm svg { width: 100%; height: 100%; display: block; fill: currentColor; }

/* Context: project tag, kind, fact chips */
.ctx { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; min-width: 0; font-size: 12.5px; color: var(--fg2); }
.ptag { display: inline-flex; align-items: center; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 650; line-height: 20px; white-space: nowrap; }
.ptag.p0 { background: var(--p0b); color: var(--p0f); } .ptag.p1 { background: var(--p1b); color: var(--p1f); }
.ptag.p2 { background: var(--p2b); color: var(--p2f); } .ptag.p3 { background: var(--p3b); color: var(--p3f); }
.kind { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; white-space: nowrap; }
.kind .ic { width: 14px; height: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.fchip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 9px; border: 1px solid var(--line2); border-radius: 999px; font-size: 12.5px; font-weight: 500; line-height: 20px; color: var(--fg); white-space: nowrap; }
.fchip .ic { width: 13px; height: 13px; color: var(--need-text); }
.ctx .fchip { padding: 0 8px; font-size: 12px; line-height: 18px; }
.follows { margin: 10px 0 0; font-size: 13.5px; color: var(--muted); }

/* Previews of the thing being decided */
.pv { margin-top: 12px; }
.pv-facts { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 10px 12px; background: var(--s2); border-radius: 12px; font-size: 14px; font-weight: 500; }
.pv-facts span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.pv-facts .ic { color: var(--done-text); stroke-width: 2.6; }
.pv-thumbs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0; }
.pv-thumbs figure { margin: 0; min-width: 0; }
.pv-thumbs svg { display: block; width: 100%; height: auto; border-radius: 10px; background: var(--s2); color: var(--muted); }
.pv-thumbs figcaption { margin-top: 4px; font-size: 13.5px; font-weight: 600; }
.pv-draft { display: block; width: 100%; padding: 8px 12px; border-left: 3px solid var(--line2); border-radius: 4px 12px 12px 4px; background: var(--s2); text-align: left; }
.pv-draft .to { display: block; font-size: 12.5px; font-weight: 650; color: var(--muted); }
.pv-draft .tx { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin-top: 2px; font-size: 14.5px; color: var(--fg); }
.pv-draft[aria-expanded="true"] .tx { display: block; }
.pv-amount { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.pv-amount b { font: 650 30px/1.15 var(--serif); }
.pv-amount span { font-size: 14px; color: var(--fg2); }
.pv-progress .track { height: 6px; border-radius: 3px; background: var(--s2); overflow: hidden; }
.pv-progress .fill { display: block; height: 100%; border-radius: 3px; }
.pv-progress span { display: block; margin-top: 6px; font-size: 13.5px; font-weight: 500; color: var(--fg2); }
.pv-time { display: flex; align-items: center; gap: 10px; font: 650 24px/1.2 var(--serif); }
.pv-time s { color: var(--muted); font-weight: 500; }
.pv-time .ic { width: 18px; height: 18px; color: var(--muted); }

/* Status words */
.chip { flex: none; border-radius: 999px; padding: 3px 10px; font-size: 12.5px; font-weight: 600; white-space: nowrap; line-height: 18px; }
.chip.need { background: var(--need-bg); color: var(--need-fg); }
.chip.wait, .chip.off { border: 1px solid var(--line2); color: var(--fg2); padding: 2px 9px; }
.chip.done { background: var(--done-bg); color: var(--done-fg); }
.chip.later { background: var(--s2); color: var(--muted); }
.st { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.st::before { content: ""; width: 8px; height: 8px; border-radius: 50%; flex: none; box-sizing: border-box; }
.st.need { color: var(--need-text); } .st.need::before { background: var(--need-dot); }
.st.wait, .st.off { color: var(--fg2); } .st.wait::before { border: 1.5px solid var(--muted); }
.st.off::before { border: 1.5px dashed var(--muted); }
.st.done { color: var(--done-text); } .st.done::before { background: var(--done-text); }
.st.later { color: var(--muted); } .st.later::before { background: var(--line2); }
.st.inl { margin-left: 2px; }
.cc { display: inline-flex; align-items: center; gap: 3px; font-size: 12.5px; font-weight: 600; color: var(--fg2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.cc .ic { width: 14px; height: 14px; }
.newdot { display: inline-block; width: 9px; height: 9px; margin-right: 7px; border-radius: 50%; background: var(--new); vertical-align: 1px; }

/* Rows */
.row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 10px 2px; border-top: 1px solid var(--line); text-align: left; border-radius: 0; transition: background var(--quick); }
.row:active { background: var(--s2); }
.row .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.row .ctx { margin-bottom: 1px; }
.row .t1 { display: block; font-size: 15.5px; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .t2 { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; font-size: 13px; color: var(--muted); }
.row .t2 b { color: var(--fg2); font-weight: 600; }
.row .t3 { font-size: 13.5px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row.quiet .t1 { color: var(--muted); font-weight: 500; }
.row .tm { flex: none; align-self: flex-start; font-size: 12.5px; color: var(--muted); padding-top: 2px; }
.row.ctxrow .av { align-self: flex-start; margin-top: 24px; }
.it:has(> .card) + .it > .row, .it:has(> .proj) + .it > .row, .it:has(> .sec) + .it > .row, .row.first { border-top-color: transparent; }
.it { scroll-margin-top: 8px; }
.it.sticky { position: sticky; top: 0; z-index: 5; }
.it.tl { margin-top: 10px; display: flex; flex-direction: column; }

/* The open card: one raised surface */
.card { position: relative; margin: 10px 0 14px; padding: 16px; background: var(--raised); border: 1.5px solid var(--raised-line); border-radius: 20px; box-shadow: var(--raised-shadow); scroll-margin-top: 12px; }
.card.focus { min-height: calc(100vh - 250px); min-height: calc(100svh - 250px); margin-top: 6px; }
.ctop { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 12px; }
.ch { display: flex; align-items: flex-start; gap: 8px; }
.agentbtn { display: flex; align-items: center; gap: 10px; flex: 0 1 auto; min-width: 0; min-height: 44px; margin: -4px; padding: 4px; border-radius: 12px; text-align: left; transition: background var(--quick); }
.agentbtn:active { background: var(--s2); }
.who { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.who .n { display: flex; flex-wrap: wrap; align-items: center; gap: 3px 8px; }
.who .n b { font-size: 16px; font-weight: 650; }
.who .r { font-size: 13px; color: var(--muted); }
.ttl { font: 650 22px/1.25 var(--serif); margin: 14px 0 6px; letter-spacing: -.005em; }
.ttl + .chips { margin-top: 2px; }
.body { margin: 0 0 4px; color: var(--fg2); font-size: 15.5px; }
.quote { margin: 10px 0 0; padding: 10px 12px; border-left: 3px solid var(--line2); background: var(--s2); border-radius: 4px 12px 12px 4px; font-size: 15px; color: var(--fg); }
.sugg { margin: 12px 0 0; padding: 10px 12px; background: var(--s2); border-radius: 12px; font-size: 14.5px; color: var(--fg2); }
.sugg b { color: var(--fg); font-weight: 600; }
.due { display: flex; gap: 8px; align-items: flex-start; margin: 10px 0 0; font-size: 14.5px; color: var(--fg); }
.due .ic { width: 17px; height: 17px; margin-top: 2px; color: var(--need-text); }
.note-box { margin: 0 0 12px; padding: 10px 12px; border: 1px dashed var(--line2); border-radius: 12px; font-size: 14.5px; color: var(--fg2); }
.note-box b { color: var(--fg); font-weight: 600; }
.lbl { margin: 16px 0 0; font-size: 12px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

/* Options look like choices */
.opt { position: relative; display: flex; align-items: flex-start; gap: 12px; width: 100%; min-height: 52px; margin-top: 8px; padding: 12px; background: var(--s2); border: 1.5px solid transparent; border-radius: 12px; text-align: left; overflow: hidden; transition: opacity var(--fast), background var(--quick), border-color var(--quick); }
button.opt:active { border-color: var(--line2); }
.opt .rd { flex: none; width: 20px; height: 20px; margin-top: 1px; border-radius: 50%; border: 2px solid var(--muted); display: grid; place-items: center; }
.opt .rd.on { border-color: var(--primary); }
.opt .rd.on::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); }
.opt .ot { flex: 1; min-width: 0; }
.opt .ol { font-weight: 600; font-size: 16px; }
.opt .od { display: block; margin-top: 2px; font-size: 14.5px; color: var(--muted); }
.opt .tag { display: inline-block; margin-left: 6px; padding: 0 8px; border: 1px solid var(--line2); border-radius: 999px; background: var(--raised); font-size: 12px; font-weight: 500; color: var(--fg2); vertical-align: 2px; line-height: 18px; }
.opt .thumb { flex: none; width: 58px; height: 35px; color: var(--muted); }
.opt.on { border-color: var(--primary); background: var(--selected); align-items: center; }
.opt.on .od { color: var(--fg); font-weight: 500; }
.opt.dim { opacity: .4; }
.opt.ro { background: transparent; border: 1px dashed var(--line2); min-height: 0; padding: 10px 12px; }
.opt.ro .ol { font-weight: 500; color: var(--fg2); }
.undo { flex: none; min-height: 44px; padding: 0 16px; border: 1px solid var(--line2); border-radius: 10px; background: var(--raised); font-weight: 600; font-size: 15px; }
.undo:active { background: var(--s2); }
.bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--primary); transform-origin: left center; animation: drain 4s linear forwards; }
@keyframes drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }

/* Writing: one button, then one line */
.reply { margin-top: 16px; }
.rbox { display: flex; align-items: flex-end; gap: 8px; }
textarea { flex: 1; min-width: 0; min-height: 48px; max-height: 168px; resize: none; padding: 12px; font: 16px/1.4 var(--sans); color: var(--fg); background: var(--bg); border: 1px solid var(--line2); border-radius: 12px; }
textarea:focus-visible { outline: 2px solid var(--ring); outline-offset: 0; }
textarea:disabled { opacity: .5; }
.send { min-height: 48px; }
.sending { position: relative; padding: 10px 12px; border: 1.5px solid var(--primary); background: var(--selected); border-radius: 12px; overflow: hidden; }
.sending .stext { display: block; font-size: 15px; }
.sending .srow { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 4px; font-size: 14px; font-weight: 500; }

/* Small actions and panels */
.foot { display: flex; flex-wrap: wrap; gap: 2px; margin: 14px -8px 0; padding-top: 6px; border-top: 1px solid var(--line); }
.panel { margin-top: 8px; padding: 12px; background: var(--s2); border-radius: 12px; font-size: 14.5px; }
.panel .pl { display: block; margin: 0 0 6px; font-weight: 600; font-size: 14.5px; }
.panel .pl.gap { margin-top: 12px; }
.panel textarea { width: 100%; background: var(--raised); }
.picks { display: flex; flex-wrap: wrap; gap: 8px; }
.pick { min-height: 44px; padding: 0 14px; border: 1px solid var(--line2); border-radius: 12px; background: var(--raised); font-size: 15px; font-weight: 500; }
.pick:active { background: var(--bg); }
.pick[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.kv { margin: 0; }
.kv > div { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; padding: 8px 0; border-top: 1px solid var(--line2); }
.kv > div:first-child { border-top: 0; padding-top: 0; }
.kv dt { flex: none; color: var(--muted); }
.kv dd { margin: 0; min-width: 0; text-align: right; }
.det .kv > div { display: grid; grid-template-columns: 118px 1fr; gap: 10px; }
.det .kv dd { text-align: left; }
.ev { margin: 10px 0 0; padding: 10px 0 0; border-top: 1px solid var(--line2); }
.ev ul { margin: 0; padding-left: 18px; }
.ev li { margin: 2px 0; }

/* Folded card: what you did, and the steps */
.fs { display: flex; gap: 10px; align-items: flex-start; margin-top: 14px; }
.fs .ck { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; margin-top: 1px; }
.fs .ck svg, .steps .ok i svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 3.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.fs b { display: block; font-size: 17px; font-weight: 650; }
.fs .fsub { display: block; font-size: 14px; color: var(--muted); margin-top: 1px; }
.steps { list-style: none; margin: 12px 0 0; padding: 0 0 0 32px; font-size: 15px; }
.steps.mini { padding: 0; margin: 4px 0 0; font-size: 13px; }
.steps li { display: flex; align-items: center; gap: 9px; padding: 3px 0; color: var(--muted); }
.steps li.ok { color: var(--fg); font-weight: 500; }
.steps i { flex: none; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--muted); display: grid; place-items: center; }
.steps.mini i { width: 15px; height: 15px; }
.steps .ok i { border: 0; background: var(--primary); color: var(--on-primary); animation: pop var(--fast) var(--ease); }
.steps.mini .ok i svg { width: 10px; height: 10px; }
.steps time { margin-left: auto; font-size: 13px; font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
.steps.mini time { margin-left: 0; }
@keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.orig { margin-top: 8px; }
.orig ul { list-style: none; margin: 8px 0 0; padding: 0; }
.orig li { padding: 6px 0; border-top: 1px solid var(--line2); color: var(--muted); }
.orig li.chosen { color: var(--fg); font-weight: 600; }
.orig li span { display: block; font-weight: 400; font-size: 13.5px; color: var(--muted); }

/* Messages */
.thread { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 88%; }
.msg.me { align-self: flex-end; text-align: right; }
.bub { display: inline-block; text-align: left; padding: 9px 12px; border-radius: 16px; font-size: 15px; background: var(--raised); border: 1px solid var(--line2); white-space: pre-wrap; }
.msg.me .bub { background: var(--s2); border-color: transparent; }

function init() {

    openId: "ship", sheet: null, cards: {}, events: [], drafts: {}, pend: {}, compose: new Set(), seq: 0, laterSeq: 0,
    focus: { queue: [], pos: 0, last: null, answered: 0 }, enter: new Set(),

    const st = S.cards[c.id] = { posted: ago(c.ago), phase: c.kind === "update" ? "update" : "ask", chosen: null, steps: {}, later: null, remind: false, details: false, showCard: false, fresh: false, draftOpen: false };
    if (c.answered) {

      Object.assign(st, { phase: "done", chosen: o.id, steps: { sent: t, received: t + 20000, done: t + 60000 } });
      addEvent({ agent: c.agent, who: "me", kind: "choice", text: o.label, card: c.id, at: t });

function addEvent(e) { const ev = { id: ++S.seq, kind: "msg", card: null, ...e }; S.events.push(ev); return ev; }

/* =====================================================================

   ===================================================================== */
const shown = (c) => S.project === "all" || c.project === S.project;

}

/* =====================================================================

  Object.assign(st, { phase: "waiting", chosen: o.id, steps: { sent: t }, later: null, remind: false, details: false, showCard: false, fresh: false });
  addEvent({ agent: to.id, who: "me", kind: "choice", text: o.label, card: id, at: t });
  later(TIMING.receivedMs, () => {
    st.steps.received = Date.now();
    addEvent({ agent: to.id, who: "agent", by: to.id, text: o.got, card: id, at: Date.now() });
    render();
  });
  later(TIMING.receivedMs + TIMING.doneMs, () => {
    st.steps.done = Date.now();
    st.phase = "done";
    addEvent({ agent: to.id, who: "agent", by: to.id, text: o.done, card: id, at: Date.now() });
    render();
  });
  if (!quiet) moveOn(id);
}
/**
 * A comment. It goes to the agent (or the main agent for a disconnected one) and stays in the conversation: it never
 * answers the card, moves it, or changes the count. The agent receives it, then replies a few seconds later.
 */
function sendMessage(key, text) {
  const cardId = key.startsWith("card:") ? key.slice(5) : null, c = cardId && cardOf(cardId);
  const to = c ? writeTo(c.agent) : agentOf(key.slice(6)), t = Date.now();
  const ev = addEvent({ agent: to.id, who: "me", text, card: cardId, at: t, to: to.id, steps: { sent: t }, cmt: true });
  later(TIMING.receivedMs, () => { ev.steps.received = Date.now(); render(); });
  later(TIMING.answerMs, () => {
    addEvent({ agent: to.id, who: "agent", by: to.id, text: (c && c.reply) || to.reply, card: cardId, at: Date.now(), cmt: true });
    if (c) {
      const away = S.view !== "feed" || S.openId !== cardId || (S.mode === "focus" && S.focus.queue[S.focus.pos] !== cardId);
      if (away) S.cards[cardId].fresh = true;
    }
    render();
  });
}
function autoNext(id) {
  if (S.view !== "feed" || S.mode !== "list" || S.openId !== id || S.sheet) return;
  if ((S.drafts["card:" + id] || "").trim() || S.pend["card:" + id] || S.pend["pick:" + id] || S.compose.has("card:" + id)) return;
  const n = nextAfter(id);
  if (!n) return;
  openNext(n, id);
}
function openNext(n, fromId) {
  S.openId = n;
  S.cards[n].fresh = false;
  S.enter.add("c-" + n);
  render();
  // Keep the row just left in sight above the next card, so its progress can be seen.
  const prev = fromId && itemEl("c-" + fromId);
  scrollToKey(prev && prev.nextElementSibling === itemEl("c-" + n) ? "c-" + fromId : "c-" + n);
}

/* =====================================================================
   Other actions
   ===================================================================== */
function closeEmptyComposers(exceptKey) {
  for (const k of [...S.compose]) if (k !== exceptKey && !(S.drafts[k] || "").trim()) S.compose.delete(k);
}
function openCard(id) {
  if (S.openId === id) return;
  flushAll();
  closeEmptyComposers();
  S.openId = id;
  S.cards[id].fresh = false;
  S.enter.add("c-" + id);
  render({ anchor: "c-" + id });
  scrollToKey("c-" + id, "if-needed");
}
function advanceFocus(skip) {
  const f = S.focus;
  f.pos += 1;
  closeEmptyComposers();
  syncFocusOpen();
  const id = f.queue[f.pos];
  S.enter.add(id && askable(id) ? "f-" + id : "f-end");
  render({ anchor: false });
  const bar = itemEl(f.last && !skip ? "f-last" : "f-bar") || itemEl("f-end");
  if (bar && bar.getBoundingClientRect().top < 0) bar.scrollIntoView({ block: "start", behavior: reduceMotion() ? "auto" : "smooth" });
}
function remindAt(id, when) {
  const st = S.cards[id], n = nextAfter(id);
  st.later = { when, note: (S.drafts["note:" + id] || "").trim(), seq: ++S.laterSeq };
  st.remind = false;
  toast(`Later · ${when}`);
  if (S.mode === "focus") { advanceFocus(true); return; }
  closeEmptyComposers();
  S.openId = n;
  if (n) { S.cards[n].fresh = false; S.enter.add("c-" + n); }
  render({ anchor: n ? "c-" + id : undefined });
  if (n) scrollToKey("c-" + n);
}
function go(view, agentId) {
  flushAll();
  closeEmptyComposers(view === "agent" ? "agent:" + agentId : undefined);
  S.history.push({ view: S.view, agentId: S.agentId, y: scrollY });
  S.sheet = null;
  S.view = view;
  S.agentId = agentId || null;
  render({ anchor: false });
  window.scrollTo(0, view === "agent" ? document.documentElement.scrollHeight : 0);
}
function back() {
  flushAll();
  closeEmptyComposers();
  const b = S.history.pop() || { view: "feed", y: 0 };
  S.view = b.view;
  S.agentId = b.agentId;
  render({ anchor: false });
  window.scrollTo(0, b.y);
}
function setMode(m) {
  if (S.view !== "feed") { S.view = "feed"; S.history = []; }
  if (m === S.mode) { render(); return; }
  flushAll();
  closeEmptyComposers();
  S.mode = m;
  if (m === "focus") { S.focus.last = null; buildQueue(); }
  render({ anchor: false });
  if (m === "focus") window.scrollTo(0, 0);
  else if (S.openId) scrollToKey("c-" + S.openId);
}
function cardRef(id) {
  flushAll();
  closeEmptyComposers();
  S.view = "feed"; S.history = []; S.mode = "list"; S.sheet = null;
  if (!shown(cardOf(id))) S.project = "all";
  S.openId = id;
  S.cards[id].fresh = false;
  S.enter.add("c-" + id);
  render({ anchor: false });
  scrollToKey("c-" + id);
}
function startOver() {
  init();
  sheetShown = "x";
  $("#app").innerHTML = "";
  $("#toast").classList.remove("on");
  render({ anchor: false });
  window.scrollTo(0, 0);
}

const ACTIONS = {
  open: (d) => openCard(d.id),
  choose: (d) => startCount("pick:" + d.id, { kind: "choice", card: d.id, option: d.opt }),
  undo: (d) => undo(d.k),
  compose: (d) => { S.compose.add(d.k); render(); focusComposer(d.k); },
  gomsg: (d) => { S.compose.add("agent:" + d.id); go("agent", d.id); focusComposer("agent:" + d.id); },
  send: (d) => {
    const text = (S.drafts[d.k] || "").trim();
    if (!text) return;
    S.drafts[d.k] = "";
    startCount(d.k, { kind: "reply", text });
  },
  remind: (d) => { const st = S.cards[d.id]; st.remind = !st.remind; render(); if (st.remind) { const t = document.getElementById("note-" + d.id); if (t) t.focus({ preventScroll: true }); } },
  remindAt: (d) => remindAt(d.id, d.when),
  details: (d) => { S.cards[d.id].details = !S.cards[d.id].details; render(); },
  showcard: (d) => { S.cards[d.id].showCard = !S.cards[d.id].showCard; render(); },
  draft: (d) => { S.cards[d.id].draftOpen = !S.cards[d.id].draftOpen; render(); },
  agent: (d) => { S.sheet = { type: "agent", id: d.id }; render(); },
  conv: (d) => { if (S.view === "agent" && S.agentId === d.id) { S.sheet = null; render(); } else go("agent", d.id); },
  agents: () => go("agents"),
  back: () => back(),
  filter: () => { S.sheet = { type: "filter" }; render(); },
  closeSheet: () => { S.sheet = null; render(); },
  group: () => { S.group = !S.group; if (S.mode === "focus") buildQueue(); render({ anchor: false }); },
  project: (d) => { S.project = d.p; if (S.mode === "focus") buildQueue(); render({ anchor: false }); },
  mode: (d) => setMode(d.m),
  ctx: (d) => { S.ctx = d.v === "context"; render(); },
  skip: () => advanceFocus(true),
  again: () => { S.focus.last = null; S.openId = null; buildQueue(); render({ anchor: false }); },
  cardref: (d) => cardRef(d.id),
  startOver: () => startOver(),
};
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el.dataset); }
});
document.addEventListener("input", (e) => {
  const t = e.target;
  if (!t.matches || !t.matches("textarea[data-draft]")) return;
  S.drafts[t.dataset.draft] = t.value;
  grow(t);
  const b = t.parentElement.querySelector("button.send");
  if (b) b.disabled = b.hasAttribute("data-locked") || !t.value.trim();
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.sheet) { S.sheet = null; render(); } });
setInterval(() => { if (!Object.keys(S.pend).length) render(); }, 60000); // keep "12 min" honest

init();
render({ anchor: false });
</script>
</body>
</html>
