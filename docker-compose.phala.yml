 string(kvm.tag) ?? \\\"\\\" }\\n    if !is_string(kvm.bare) && !includes([\\\"agent\\\",\\\"agent-chat\\\",\\\"assemblyai-hosted\\\",\\\"attestation\\\",\\\"auth\\\",\\\"billing\\\",\\\"calendar-autojoin\\\",\\\"chat\\\",\\\"connector-content\\\",\\\"connector-credential\\\",\\\"connector-drain\\\",\\\"connector-fetch\\\",\\\"connector-ingest\\\",\\\"connector-meetings\\\",\\\"connector-obs\\\",\\\"connector-queue\\\",\\\"connector-retention\\\",\\\"connector-teardown\\\",\\\"connector-webhook\\\",\\\"credit-gate\\\",\\\"credits\\\",\\\"delegation\\\",\\\"delegations\\\",\\\"exo\\\",\\\"express\\\",\\\"google-oauth\\\",\\\"ledger-flusher\\\",\\\"ledger-gate\\\",\\\"ledger-rehydrate\\\",\\\"private-cloud\\\",\\\"relay\\\",\\\"startup\\\",\\\"storage-lane\\\",\\\"transcriber\\\",\\\"transcript-delivery\\\"], comp) { abort }\\n    code_keys = [\\\"op\\\",\\\"result\\\",\\\"outcome\\\",\\\"reason\\\",\\\"code\\\",\\\"kind\\\",\\\"state\\\",\\\"form\\\",\\\"purpose\\\",\\\"bucket\\\",\\\"mode\\\",\\\"policy\\\",\\\"arm\\\",\\\"route\\\",\\\"priority\\\",\\\"client\\\",\\\"configuration_outage\\\",\\\"window_kind\\\",\\\"local_window\\\",\\\"through_source\\\",\\\"action\\\"]\\n    int_keys = [\\\"age_ms\\\",\\\"already\\\",\\\"attempts\\\",\\\"bytes\\\",\\\"cap\\\",\\\"ceiling\\\",\\\"claimed\\\",\\\"cleared\\\",\\\"cohort\\\",\\\"concurrency\\\",\\\"content_removed\\\",\\\"content_write_failures\\\",\\\"count\\\",\\\"cred_failures\\\",\\\"cred_ops\\\",\\\"dead_lettered\\\",\\\"deferred\\\",\\\"deliveries\\\",\\\"delivery_errors\\\",\\\"depth\\\",\\\"discovered\\\",\\\"dlq_depth\\\",\\\"dlq_unreadable\\\",\\\"dropped\\\",\\\"errors\\\",\\\"evicted_last_window\\\",\\\"failed\\\",\\\"fetch_fail\\\",\\\"fetch_ok\\\",\\\"hops\\\",\\\"item_count\\\",\\\"k\\\",\\\"lag_ms\\\",\\\"missing\\\",\\\"ms\\\",\\\"nudged\\\",\\\"overflow_drops\\\",\\\"queue_dropped\\\",\\\"reads\\\",\\\"reconciled\\\",\\\"removed\\\",\\\"rows\\\",\\\"scans\\\",\\\"seconds\\\",\\\"settled\\\",\\\"size\