services:
  tinychat-backend:
    image: ${TINYCHAT_BACKEND_IMAGE:-ghcr.io/tinycloudlabs/tinychat-backend:latest}
    platform: linux/amd64
    # Autojoin requires stop-and-drain replacement: never run two backend writers.
    # The HTTP server and scheduler drain together before process exit.
    stop_grace_period: 130s
    # TC-1012: no host `ports:`. Publishing 3001 let the Phala gateway serve the
    # backend at <app_id>-3001.<gateway>, bypassing dstack-ingress. The ingress
    # reaches it over the compose network (TARGET_ENDPOINT below).
    environment:
      NODE_ENV: production
      PORT: "3001"
      BACKEND_PRIVATE_KEY: ${BACKEND_PRIVATE_KEY}
      TINYCLOUD_HOST: ${TINYCLOUD_HOST:-https://tee.node.tinycloud.xyz}
      FRONTEND_URL: ${FRONTEND_URL:-https://tinycloud.chat}
      REDPILL_API_KEY: ${REDPILL_API_KEY:-}
      REDPILL_BASE_URL: ${REDPILL_BASE_URL:-https://api.redpill.ai/v1}
      REDPILL_DEFAULT_MODEL: ${REDPILL_DEFAULT_MODEL:-z-ai/glm-5.2}
      # Per-user delegated agent tools (Milestone E). All three must be set for
      # the agent/tool-calling path to turn on; unset = agent path stays off and
      # only plain chat is served (see backend/src/index.ts).
      AGENT_DID: ${AGENT_DID:-}
      ELIZA_SERVICE_URL: ${ELIZA_SERVICE_URL:-}
      ELIZA_SERVICE_SECRET: ${ELIZA_SERVICE_SECRET:-}
      # Task routing defaults off; enabled with an empty list admits all accounts.
      ELIZA_TASKS_ENABLED: ${ELIZA_TASKS_ENABLED:-false}
      ELIZA_TASKS_TEST_ACCOUNTS: ${ELIZA_TASKS_TEST_ACCOUNTS:-}
      # Optional meeting rollout; empty allowlists admit no accounts or models.
      MEETING_CONTENT_RETRIEVAL_ENABLED: ${MEETING_CONTENT_RETRIEVAL_ENABLED:-false}
      MEETING_CONTENT_TEST_ACCOUNTS: ${MEETING_CONTENT_TEST_ACCOUNTS:-}
      MEETING_CONTENT_MODELS: ${MEETING_CONTENT_MODELS:-}
      # Optional one-time, log-only count of stored connector credential rows. Empty = off.
      CREDENTIAL_ROW_COUNT_SOURCES: ${CREDENTIAL_ROW_COUNT_SOURCES:-}
      # Explicit stream policy is required when agent chat is enabled. Startup validates
      # these settings; empty values keep agent-disabled deployments possible, with no defaults.
      AGENT_STREAM_HEARTBEAT_MS: ${AGENT_STREAM_HEARTBEAT_MS:-}
      AGENT_STREAM_TURN_TIMEOUT_MS: ${AGENT_STREAM_TURN_TIMEOUT_MS:-}
      AGENT_STREAM_DRAIN_GRACE_MS: ${AGENT_STREAM_DRAIN_GRACE_MS:-}
      TINYCHAT_BUILD_SHA: ${TINYCHAT_BUILD_SHA:-}
      TINYCHAT_DEPLOY_RUN_URL: ${TINYCHAT_DEPLOY_RUN_URL:-}
      # Paywall / billing (see docs/stripe-setup.md). Defaults keep the paywall
      # OFF and Stripe unconfigured — safe until go-live values are provided.
      PAYWALL_ENABLED: ${PAYWALL_ENABLED:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PLUS_MONTHLY: ${STRIPE_PRICE_PLUS_MONTHLY:-}
      STRIPE_PRICE_PLUS_YEARLY: ${STRIPE_PRICE_PLUS_YEARLY:-}
      STRIPE_PRICE_PRO_MONTHLY: ${STRIPE_PRICE_PRO_MONTHLY:-}
      STRIPE_PRICE_PRO_MONTHLY_LEGACY: ${STRIPE_PRICE_PRO_MONTHLY_LEGACY:-}
      STRIPE_PRICE_PRO_YEARLY: ${STRIPE_PRICE_PRO_YEARLY:-}
      CREDIT_BUDGET_FREE: ${CREDIT_BUDGET_FREE:-}
      CREDIT_BUDGET_PLUS_WEEKLY: ${CREDIT_BUDGET_PLUS_WEEKLY:-}
      CREDIT_BUDGET_PRO_WEEKLY: ${CREDIT_BUDGET_PRO_WEEKLY:-}
      AGENT_CHAT_BUDGET_STOP_MODE: ${AGENT_CHAT_BUDGET_STOP_MODE:-}
      AGENT_CHAT_BUDGET_PREFLIGHT: ${AGENT_CHAT_BUDGET_PREFLIGHT:-}
      EXO_CAPABILITIES_ENABLED: ${EXO_CAPABILITIES_ENABLED:-}
      # Ledger authority defaults OFF (shadow disabled) until rollout values are provided.
      LEDGER_SERVICE_URL: ${LEDGER_SERVICE_URL:-}
      LEDGER_SERVICE_SECRET: ${LEDGER_SERVICE_SECRET:-}
      LEDGER_AUTHORITATIVE: ${LEDGER_AUTHORITATIVE:-false}
      LEDGER_OUTAGE_POLICY: ${LEDGER_OUTAGE_POLICY:-bounded_k}
      # Connector webhooks ship dark: the flag defaults false, so the public route is not
      # mounted (404), the authenticated companions 404 and the drain timer never starts.
      # Turning it on requires WEBHOOK_HMAC_MASTER and LOG_HASH_SALT — each generated with
      # `openssl rand -base64 32`, never reused — or the backend refuses to boot.
      CONNECTOR_WEBHOOKS_ENABLED: ${CONNECTOR_WEBHOOKS_ENABLED:-false}
      WEBHOOK_HMAC_MASTER: ${WEBHOOK_HMAC_MASTER:-}
      # Rotation grace key (§4.2/§7.6): set only while a master rotation is draining.
      WEBHOOK_HMAC_MASTER_PREV: ${WEBHOOK_HMAC_MASTER_PREV:-}
      # Its own secret — never derived from WEBHOOK_HMAC_MASTER; keys the public log hashes.
      LOG_HASH_SALT: ${LOG_HASH_SALT:-}
      # The public HTTPS origin of every minted callback URL. Pinned, not derived from the
      # request's Host header: a wrong host or scheme mints a webhook that never delivers.
      CONNECTOR_WEBHOOK_PUBLIC_ORIGIN: ${CONNECTOR_WEBHOOK_PUBLIC_ORIGIN:-}
      # W9 host-header allowlist on the public delivery route (findings §6 control 6). Unset =
      # derived from the origin above; `*` disables it for an ingress that rewrites Host.
      CONNECTOR_WEBHOOK_HOST_ALLOWLIST: ${CONNECTOR_WEBHOOK_HOST_ALLOWLIST:-}
      # W9 / D4: the single-instance ingest seat. Unset = a random per-process id; pin it so a
      # redeploy of the same logical instance reclaims its own lease without waiting out the TTL.
      CONNECTOR_INGEST_INSTANCE_ID: ${CONNECTOR_INGEST_INSTANCE_ID:-}
      # Backend-owned ingestion (W1) — dark by default. true only ARMS the feature; which
      # addresses it applies to is a separate per-address cohort allowlist in the backend's own
      # config KV. Every non-cohort address keeps the shipped browser-drain path exactly.
      CONNECTOR_BACKEND_INGEST_ENABLED: ${CONNECTOR_BACKEND_INGEST_ENABLED:-false}
      # W2 credential custody. Required when backend ingestion is ARMED and for Calendar autojoin;
      # it wraps stored Fireflies and Google credentials. An invalid configured key fails boot;
      # an absent key keeps Calendar autojoin unavailable and does not affect browser-only Google.
      # Its own `openssl rand -base64 32` value — reusing WEBHOOK_HMAC_MASTER is a hard error.
      # It MUST survive CVM redeploys: a redeploy that strips it orphans every stored credential.
      CONNECTOR_CREDENTIAL_MASTER: ${CONNECTOR_CREDENTIAL_MASTER:-}
      # W4 content custody. Same gate, one invariant further: it wraps every stored MEETING.
      # Its own `openssl rand -base64 32` value — reusing either master above is a hard error.
      # It MUST survive CVM redeploys: a redeploy that strips it orphans every stored meeting.
      CONNECTOR_CONTENT_MASTER: ${CONNECTOR_CONTENT_MASTER:-}
      # The registered Fireflies OAuth app (custody branch b1). Required with the flag armed.
      FIREFLIES_OAUTH_CLIENT_ID: ${FIREFLIES_OAUTH_CLIENT_ID:-}
      FIREFLIES_OAUTH_CLIENT_SECRET: ${FIREFLIES_OAUTH_CLIENT_SECRET:-}
      FIREFLIES_OAUTH_REDIRECT_URI: ${FIREFLIES_OAUTH_REDIRECT_URI:-}
      # Google Meet OAuth proxy (WP-A) — dark by default: unset flag = the five
      # /api/connectors/google/oauth/* routes are never mounted (404). Armed, the three client
      # vars below are mandatory and the backend refuses to build the router without them.
      # Browser and Mac Google clients are separate. Autojoin consent additionally stores
      # encrypted Google credentials when transcription + CONNECTOR_CREDENTIAL_MASTER are set.
      GOOGLE_MEET_OAUTH_ENABLED: ${GOOGLE_MEET_OAUTH_ENABLED:-false}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_DESKTOP_CLIENT_ID: ${GOOGLE_OAUTH_DESKTOP_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      # TC-581: share a colliding calendar capture with accepted invitees. Off unless exactly "true".
      CALENDAR_AUTOJOIN_SHARING: ${CALENDAR_AUTOJOIN_SHARING:-false}
      # Unset = code defaults (5 min drain, 20/hour per address on each Option-A ceiling).
      CONNECTOR_DRAIN_INTERVAL_MS: ${CONNECTOR_DRAIN_INTERVAL_MS:-}
      CONNECTOR_A_FETCH_CEILING_PER_HOUR: ${CONNECTOR_A_FETCH_CEILING_PER_HOUR:-}
      CONNECTOR_A_SECRET_READ_CEILING_PER_HOUR: ${CONNECTOR_A_SECRET_READ_CEILING_PER_HOUR:-}
      # Transcriber (Settings → Transcriber). Both set ⇒ /api/transcriber/meetings mounts;
      # either empty ⇒ the routes do not exist. The key never leaves this process.
      TRANSCRIPTION_API_URL: ${TRANSCRIPTION_API_URL:-}
      TRANSCRIPTION_API_KEY: ${TRANSCRIPTION_API_KEY:-}
      TRANSCRIPTION_BOT_NAME: ${TRANSCRIPTION_BOT_NAME:-}
      # Explicit first-party request-ID propagation classification; empty denies forwarding.
      REQUEST_ID_FIRST_PARTY_ORIGINS: ${REQUEST_ID_FIRST_PARTY_ORIGINS:-}
      # TC-641 server transcript writer. Keep OFF until TC-825 fixes node SQL
      # exact-database scoping. Before enabling, configure the webhook secret
      # on both PTX and tinychat; unsigned webhook calls receive 503.
      TRANSCRIPT_SERVER_DELIVERY_ENABLED: ${TRANSCRIPT_SERVER_DELIVERY_ENABLED:-false}
      TRANSCRIPT_SERVER_DELIVERY_ADDRESSES: ${TRANSCRIPT_SERVER_DELIVERY_ADDRESSES:-}
      TRANSCRIPTION_WEBHOOK_URL: ${TRANSCRIPTION_WEBHOOK_URL:-}
      TRANSCRIPTION_WEBHOOK_SECRET: ${TRANSCRIPTION_WEBHOOK_SECRET:-}
      TRANSCRIPT_DELIVERY_SWEEP_MS: ${TRANSCRIPT_DELIVERY_SWEEP_MS:-}
      TRANSCRIPT_DELIVERY_MAX_WRITES_PER_MIN: ${TRANSCRIPT_DELIVERY_MAX_WRITES_PER_MIN:-}
      # Exo private cloud transcription. URL, key and tenant key must be set together.
      PRIVATE_CLOUD_TRANSCRIPTION_API_URL: ${PRIVATE_CLOUD_TRANSCRIPTION_API_URL:-}
      PRIVATE_CLOUD_TRANSCRIPTION_API_KEY: ${PRIVATE_CLOUD_TRANSCRIPTION_API_KEY:-}
      PRIVATE_CLOUD_TRANSCRIPTION_TENANT_KEY: ${PRIVATE_CLOUD_TRANSCRIPTION_TENANT_KEY:-}
      # Keep the existing AssemblyAI API key path. Hosted uploads remain off until a separate
      # approval restores ASSEMBLYAI_HOSTED_HANDLE_KEY to the container environment.
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY:-}
      ASSEMBLYAI_HOSTED_SPOOL_DIR: /var/lib/tinychat/assemblyai
      ASSEMBLYAI_HOSTED_FRESH_INSTALL: ${ASSEMBLYAI_HOSTED_FRESH_INSTALL:-}
      ASSEMBLYAI_HOSTED_ADMIN_KEY: ${ASSEMBLYAI_HOSTED_ADMIN_KEY:-}
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock:ro
      - assemblyai-data:/var/lib/tinychat/assemblyai
    restart: unless-stopped
    # TC-1978: ship console lines through the filtering `vector` sidecar below. The sidecar is deliberately NOT a
    # dependency: nonblocking UDP never delays or stops the backend, and a missing or crashed sidecar loses logs only.
    # With the gelf driver the host Docker daemon keeps no local copy (cache-disabled), so `docker logs` is empty.
    labels:
      tc.logship: tinychat-backend
    logging:
      driver: gelf
      options:
        gelf-address: udp://127.0.0.1:12201
        gelf-compression-type: none
        labels: tc.logship
        mode: non-blocking
        max-buffer-size: 4m
        cache-disabled: "true"

  dstack-ingress:
    image: ${TINYCHAT_INGRESS_IMAGE:-ghcr.io/tinycloudlabs/tinychat-backend:ingress-latest}
    ports:
      - "443:443"
    depends_on:
      - tinychat-backend
    environment:
      DOMAIN: ${PHALA_INGRESS_DOMAIN:-api.tinycloud.chat}
      TARGET_ENDPOINT: http://tinychat-backend:3001
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      GATEWAY_DOMAIN: ${PHALA_GATEWAY_CNAME}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL}
      SET_CAA: "true"
      DNS_PROVIDER: cloudflare
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - cert-data:/etc/letsencrypt
    restart: unless-stopped

  # TC-1978: the log shipper (same pinned image and shape as tinycloud-node's). It receives the backend's GELF/UDP
  # lines on the host loopback and passes only what log-shipper/sanitize.vrl classifies into fixed-code fields. Both
  # configs below are generated by `node log-shipper/build.mjs sync-compose` (a test fails if they drift).
  #   VECTOR_CONFIG_JSON: the whole boundary plus a LOCAL sink that prints the same filtered stream to this container's
  #     stdout; Docker keeps it rotated (json-file, 2 x 5 MB, see below), so `docker logs` on this service is the local view.
  #   VECTOR_SHIP_JSON: the log service sink. Loaded only when BETTERSTACK_SOURCE_TOKEN (sealed env; GitHub environment
  #     secret BETTERSTACK_SOURCE_TOKEN) and a valid BETTERSTACK_INGEST_HOST (repo variable
  #     TINYCHAT_BETTERSTACK_INGEST_HOST) are both present; otherwise the sidecar runs local-only and prints one fixed line.
  # Never `exit` here with the restart policy below, and never a dependency of the backend.
  vector:
    restart: unless-stopped
    image: timberio/vector:0.59.0-alpine@sha256:0e36bc2a290039e9b6a5e92f04bd2f133223506f72d09682c1df16c015172b7a
    init: true
    user: 10001:10001
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.5
    ports:
      - 127.0.0.1:12201:12201/udp
    networks:
      - logship
    tmpfs:
      - /var/lib/vector:rw,noexec,nosuid,size=8m,uid=10001,gid=10001,mode=0700
    environment:
      BETTERSTACK_SOURCE_TOKEN: ${BETTERSTACK_SOURCE_TOKEN:-}
      BETTERSTACK_INGEST_HOST: ${BETTERSTACK_INGEST_HOST:-}
      VECTOR_CONFIG_JSON: "{\"data_dir\":\"/var/lib/vector\",\"sources\":{\"gelf_in\":{\"type\":\"socket\",\"mode\":\"udp\",\"address\":\"0.0.0.0:12201\",\"max_length\":262144,\"receive_buffer_bytes\":8388608,\"framing\":{\"method\":\"chunked_gelf\",\"chunked_gelf\":{\"decompression\":\"Auto\"}},\"decoding\":{\"codec\":\"bytes\"}}},\"transforms\":{\"gelf_envelope\":{\"type\":\"remap\",\"inputs\":[\"gelf_in\"],\"source\":\"packet = string(.message) ?? \\\"\\\"\\nif length(packet) > 262144 {\\n  . = {\\\"reason\\\": \\\"oversized\\\"}\\n} else {\\n  outer, err = parse_json(packet)\\n  if err != null || !is_object(outer) || (outer.version != \\\"1.1\\\" && outer.version != \\\"1.0\\\") {\\n    . = {\\\"reason\\\": \\\"malformed_envelope\\\"}\\n  } else if exists(outer.partial_message) || exists(outer._partial_message) {\\n    . = {\\\"reason\\\": \\\"partial\\\"}\\n  } else {\\n    label = get(outer, [\\\"_tc.logship\\\"]) ?? null\\n    . = {\\\"_tc.logship\\\": label, \\\"message\\\": outer.short_message, \\\"gl\\\": outer.level}\\n  }\\n}\",\"drop_on_error\":true,\"drop_on_abort\":true},\"logship_gate\":{\"type\":\"remap\",\"inputs\":[\"gelf_envelope\"],\"source\":\"if exists(.reason) {\\n  . = {\\\"reason\\\": .reason}\\n} else {\\n  label = string(get(., [\\\"_tc.logship\\\"]) ?? null) ?? \\\"\\\"\\n  raw = .message\\n  reason = \\\"\\\"\\n  if label == \\\"\\\" { reason = \\\"unlabelled\\\" }\\n  else if label != \\\"tinychat-backend\\\" { reason = \\\"unexpected_label\\\" }\\n  else if !is_string(raw) { reason = \\\"malformed_envelope\\\" }\\n  else if length(string!(raw)) > 4096 { reason = \\\"oversized\\\" }\\n  if reason != \\\"\\\" {\\n    . = {\\\"reason\\\": reason}\\n  } else {\\n    . = {\\\"line\\\": string!(raw), \\\"gl\\\": int(.gl) ?? 6}\\n  }\\n}\",\"drop_on_error\":true,\"drop_on_abort\":true},\"gate_route\":{\"type\":\"route\",\"inputs\":[\"logship_gate\"],\"route\":{\"candidate\":\"exists(.line)\",\"rejected\":\"exists(.reason)\"}},\"allowlist\":{\"type\":\"remap\",\"inputs\":[\"gate_route.candidate\"],\"source\":\"# Only the fresh object built below can leave the process boundary. The raw line, the GELF envelope and every\\n# key or value that did not pass its typed check are never copied into it.\\n#\\n# Input: .line (one console line, 1..4096 bytes) and .gl (GELF level: 3 = stderr, 6 = stdout).\\n# A line ships only if it matches one of four shapes; anything else aborts and is counted by the gate, content-free.\\n#   1. a registered fixed message (diagnostics.json): shipped as its fixed event_code, the rest of the line dropped\\n#   2. `[tag] key=value ...` (or the bare `credential_row_count key=value ...`): allow-listed keys with typed values\\n#   3. an indented object field line from a multi-line object print, for the few fields declared below\\n#   4. an error line `<Name>Error: ...`: shipped as the error class only\\nline = string!(.line)\\ngl = int(.gl) ?? 6\\nlevel = if gl <= 3 { \\\"warn\\\" } else { \\\"info\\\" }\\nout = {}\\n\\nevent_code = \\\"\\\"\\ncomponent = \\\"\\\"\\nreg_level = \\\"info\\\"\\nregistry = [[\\\"[chat] failed to\\\",\\\"chat_failed_to\\\",\\\"chat\\\",\\\"error\\\"],[\\\"SIGINT received.\\\",\\\"process_shutdown_sigint\\\",\\\"process\\\",\\\"info\\\"],[\\\"[billing] invalid\\\",\\\"billing_invalid\\\",\\\"billing\\\",\\\"warn\\\"],[\\\"SIGTERM received.\\\",\\\"process_shutdown_sigterm\\\",\\\"process\\\",\\\"info\\\"],[\\\"[chat] stream error:\\\",\\\"chat_stream_error\\\",\\\"chat\\\",\\\"error\\\"],[\\\"[express] route error\\\",\\\"express_route_error\\\",\\\"express\\\",\\\"error\\\"],[\\\"[exo] wake route error\\\",\\\"exo_wake_route_error\\\",\\\"exo\\\",\\\"error\\\"],[\\\"[relay] failed to read\\\",\\\"relay_failed_to_read\\\",\\\"relay\\\",\\\"error\\\"],[\\\"[exo] wake not recorded\\\",\\\"exo_wake_not_recorded\\\",\\\"exo\\\",\\\"error\\\"],[\\\"[relay] failed to reach\\\",\\\"relay_failed_to_reach\\\",\\\"relay\\\",\\\"error\\\"],[\\\"[agent-chat] turn budget\\\",\\\"agent_chat_turn_budget\\\",\\\"agent-chat\\\",\\\"info\\\"],[\\\"[auth] verification failed:\\\",\\\"auth_verification_failed\\\",\\\"auth\\\",\\\"error\\\"],[\\\"[agent-chat] task accounting\\\",\\\"agent_chat_task_accounting\\\",\\\"agent-chat\\\",\\\"info\\\"],[\\\"[exo] job record not written\\\",\\\"exo_job_record_not_written\\\",\\\"exo\\\",\\\"error\\\"],[\\\"[agent-chat] stream lifecycle\\\",\\\"agent_chat_stream_lifecycle\\\",\\\"agent-chat\\\",\\\"info\\\"],[\\\"[exo] job state update failed\\\",\\\"exo_job_state_update_failed\\\",\\\"exo\\\",\\\"error\\\"],[\\\"[agent-chat] meeting retrieval\\\",\\\"agent_chat_meeting_retrieval\\\",\\\"agent-chat\\\",\\\"info\\\"],[\\\"[chat] REDPILL_DEFAULT_MODEL=\\\\\\\"\\\",\\\"chat_redpill_default_model\\\",\\\"chat\\\",\\\"warn\\\"],[\\\"[exo] retention sweep removed=\\\",\\\"exo_retention_sweep_removed\\\",\\\"exo\\\",\\\"info\\\"],[\\\"[billing] failed to load rates:\\\",\\\"billing_failed_to_load_rates\\\",\\\"billing\\\",\\\"error\\\"],[\\\"[delegation] activation failed:\\\",\\\"delegation_activation_failed\\\",\\\"delegation\\\",\\\"error\\\"],[\\\"[billing] failed to load status:\\\",\\\"billing_failed_to_load_status\\\",\\\"billing\\\",\\\"error\\\"],[\\\"[ledger-flusher] outbox at cap (\\\",\\\"ledger_flusher_outbox_at_cap\\\",\\\"ledger-flusher\\\",\\\"warn\\\"],[\\\"[exo] grant holder listing failed\\\",\\\"exo_grant_holder_listing_failed\\\",\\\"exo\\\",\\\"error\\\"],[\\\"[exo] request record not consumed\\\",\\\"exo_request_record_not_consumed\\\",\\\"exo\\\",\\\"error\\\"],[\\\"Failed to start TinyChat backend:\\\",\\\"process_start_failed\\\",\\\"process\\\",\\\"error\\\"],[\\\"[connector-webhook] enable failed:\\\",\\\"connector_webhook_enable_failed\\\",\\\"connector-webhook\\\",\\\"warn\\\"],[\\\"[connector-webhook] handler error:\\\",\\\"connector_webhook_handler_error\\\",\\\"connector-webhook\\\",\\\"warn\\\"],[\\\"[exo] retention sweep pass failed:\\\",\\\"exo_retention_sweep_pass_failed\\\",\\\"exo\\\",\\\"warn\\\"],[\\\"[connector-webhook] enqueue failed:\\\",\\\"connector_webhook_enqueue_failed\\\",\\\"connector-webhook\\\",\\\"warn\\\"],[\\\"[exo] job write failed; record held\\\",\\\"exo_job_write_failed_record_held\\\",\\\"exo\\\",\\\"error\\\"],[\\\"[exo] wake verification unavailable\\\",\\\"exo_wake_verification_unavailable\\\",\\\"exo\\\",\\\"error\\\"],[\\\"[ledger-flusher] flush failed (HTTP\\\",\\\"ledger_flusher_flush_failed_http\\\",\\\"ledger-flusher\\\",\\\"warn\\\"],[\\\"[connector-webhook] teardown failed:\\\",\\\"connector_webhook_teardown_failed\\\",\\\"connector-webhook\\\",\\\"warn\\\"],[\\\"[startup] hosted AssemblyAI enabled.\\\",\\\"startup_hosted_assemblyai_enabled\\\",\\\"startup\\\",\\\"info\\\"],[\\\"[startup] hosted AssemblyAI is off (\\\",\\\"startup_hosted_assemblyai_is_off\\\",\\\"startup\\\",\\\"warn\\\"],[\\\"[transcriber] completion wake failed\\\",\\\"transcriber_completion_wake_failed\\\",\\\"transcriber\\\",\\\"warn\\\"],[\\\"[transcriber] index read failed err=\\\",\\\"transcriber_index_read_failed_err\\\",\\\"transcriber\\\",\\\"warn\\\"],[\\\"[attestation] self-attestation failed\\\",\\\"attestation_self_attestation_failed\\\",\\\"attestation\\\",\\\"error\\\"],[\\\"[connector-webhook] exo clear failed:\\\",\\\"connector_webhook_exo_clear_failed\\\",\\\"connector-webhook\\\",\\\"warn\\\"],[\\\"[credits] missing pricing for model \\\\\\\"\\\",\\\"credits_missing_pricing_for_model\\\",\\\"credits\\\",\\\"warn\\\"],[\\\"[transcriber] index write failed err=\\\",\\\"transcriber_index_write_failed_err\\\",\\\"transcriber\\\",\\\"warn\\\"],[\\\"[agent-chat] task usage enqueue failed\\\",\\\"agent_chat_task_usage_enqueue_failed\\\",\\\"agent-chat\\\",\\\"error\\\"],[\\\"[connector-webhook] drain kick failed:\\\",\\\"connector_webhook_drain_kick_failed\\\",\\\"connector-webhook\\\",\\\"warn\\\"],[\\\"[ledger-flusher] interval flush error:\\\",\\\"ledger_flusher_interval_flush_error\\\",\\\"ledger-flusher\\\",\\\