[package]
name = "call-prompt"
version = "0.1.0"
edition = "2021"
publish = false
description = "Offer to record when a call starts: the call-app table, the prompt's state machine and a CoreAudio process reader for the TinyCloud One desktop recorder"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.151"

# Standalone on purpose: not a member of desktop/Cargo.toml's workspace (its
# manifest and lock trigger the transcript-eval jobs) and not of src-tauri's.
[workspace]
