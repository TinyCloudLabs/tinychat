[package]
name = "exo-desktop"
version = "0.3.0-beta.4"
description = "Exo — TinyCloud chat desktop app (exo.tinycloud.xyz)"
edition = "2021"
publish = false

# Standalone package: the tinychat repo has no root Cargo workspace.
[workspace]

[lib]
name = "exo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Transcription (anarlog, MIT layer) -------------------------------------
# Local meeting capture + on-device Whisper, reused from fastrepl/anarlog's
# MIT-licensed Tauri plugins. This is a first-class desktop feature, included
# by default despite its large native dependency graph.
# Plugin permissions are injected at runtime from
# capabilities-transcription/ (see src/lib.rs and ../README.md).
[dependencies.tauri-plugin-transcription]
git = "https://github.com/fastrepl/anarlog"
rev = "864ddc1f692116d128eea2692fd72b0a51007768"
optional = true

[dependencies.tauri-plugin-local-stt]
git = "https://github.com/fastrepl/anarlog"
rev = "864ddc1f692116d128eea2692fd72b0a51007768"
optional = true
# GPU backends are per-platform Cargo features on tauri-plugin-local-stt:
# metal/coreml (macOS), cuda/directml/vulkan/openblas (Windows/Linux).
# `metal` implies `whisper-cpp` — the in-process Whisper server this app uses.
features = ["metal"]

# The transcription plugin's `setup` reads `app.state::<Arc<dyn AudioProvider>>`,
# so the host must manage `ActualAudio` before the plugin registers. The anarlog
# app does exactly this (apps/desktop/src-tauri/src/lib.rs).
[dependencies.audio-actual]
git = "https://github.com/fastrepl/anarlog"
rev = "864ddc1f692116d128eea2692fd72b0a51007768"
optional = true

# `vault_base()` (session audio + settings) is read from the StartupSnapshot
# state that only tauri-plugin-settings::init() manages, and the local-stt
# models dir resolves through the same plugin.
[dependencies.tauri-plugin-settings]
git = "https://github.com/fastrepl/anarlog"
rev = "864ddc1f692116d128eea2692fd72b0a51007768"
optional = true

# Debug-only smoke runner (src/smoke.rs) needs tokio::time; the private cloud
# uploader (src/cloud) uses it for its idle watchdog.
[dependencies.tokio]
version = "1"
features = ["time"]
optional = true

# --- Private cloud engine (src/cloud) ---------------------------------------
# Uploads a stopped recording to TinyCloud Private Transcription through a
# descriptor opened with openat/O_NOFOLLOW (rustix), hashed with sha2, and
# streamed by reqwest with redirects disabled. Part of the `transcription`
# feature because it only ever uploads a capture the transcription plugin made.
[dependencies.reqwest]
version = "0.13"
features = ["stream"]
optional = true

[dependencies.rustix]
version = "1"
features = ["fs"]
optional = true

[dependencies.sha2]
version = "0.10"
optional = true

[dependencies.hex]
version = "0.4"
optional = true

[dependencies.getrandom]
version = "0.3"
optional = true

[dependencies.uuid]
version = "1"
features = ["v4"]
optional = true

[dependencies.futures-util]
version = "0.3"
optional = true

# anarlog's `storage` crate hardcodes `~/Library/Application Support/anarlog`
# for release builds, which would share (or be redirected by) a real anarlog
# install's vault and models. The vendored copy keeps every build under the
# app's own bundle-identifier folder. See vendor/anarlog-storage/PROVENANCE.md.
#
# The in-process whisper.cpp server (`transcribe-whisper-local`, mounted by
# tauri-plugin-local-stt) went quiet on its event stream while receiving,
# decoding, VAD-scanning or transcribing audio, so long or mostly-silent
# recordings hit the clients' 30 s / 60 s stream-idle timeouts; it also had no
# bound on decoded temp storage. The vendored copy reports every unit of work
# as it happens (using per-frame / per-token hooks added to the vendored
# `audio-chunking` and `whisper-local`) and supports recordings up to 8 hours.
# See vendor/anarlog-transcribe-whisper-local/PROVENANCE.md.
[patch."https://github.com/fastrepl/anarlog"]
storage = { path = "../vendor/anarlog-storage" }
transcribe-whisper-local = { path = "../vendor/anarlog-transcribe-whisper-local" }
whisper-local = { path = "../vendor/anarlog-whisper-local" }
audio-chunking = { path = "../vendor/anarlog-audio-chunking" }

# The yujonglee swift-rs fork runs `swift build` with SwiftPM's default build
# system. Xcode 27's default (`swiftbuild`) prelinks targets and hides the
# SwiftRs bridge symbols from the release link; the vendored copy forces
# `--build-system native`. See vendor/swift-rs/PROVENANCE.md.
[patch."https://github.com/yujonglee/swift-rs"]
swift-rs = { path = "../vendor/swift-rs" }

[features]
default = ["transcription"]
transcription = [
    "dep:tauri-plugin-transcription",
    "dep:tauri-plugin-local-stt",
    "dep:audio-actual",
    "dep:tauri-plugin-settings",
    "dep:tokio",
    "dep:reqwest",
    "dep:rustix",
    "dep:sha2",
    "dep:hex",
    "dep:getrandom",
    "dep:uuid",
    "dep:futures-util",
]

# macOS 27 dyld rejects some stripped proc-macro dylibs with a misaligned
# LINKEDIT string pool (rust-lang/rust#157750). Keep build-time crates unstripped
# until the toolchain fixes the alignment bug.
[profile.release.build-override]
strip = "none"
