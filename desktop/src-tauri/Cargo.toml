[package]
name = "exo-desktop"
version = "0.1.0"
description = "Exo — TinyCloud chat desktop app (exo.tinycloud.xyz)"
edition = "2021"
publish = false

# Standalone package: the tinychat repo has no root Cargo workspace.
[workspace]

[lib]
name = "exo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Transcription (anarlog, MIT layer) -------------------------------------
# Local meeting capture + on-device Whisper, reused from fastrepl/anarlog's
# MIT-licensed Tauri plugins. Feature-gated because they pull in a large crate
#   cargo tauri dev --features transcription
# Plugin permissions are injected at runtime from
# capabilities-transcription/ (see src/lib.rs and ../README.md).
[dependencies.tauri-plugin-transcription]
git = "https://github.com/fastrepl/anarlog"
rev = "864ddc1f692116d128eea2692fd72b0a51007768"
optional = true

[dependencies.tauri-plugin-local-stt]
git = "https://github.com/fastrepl/anarlog"
rev = "864ddc1f692116d128eea2692fd72b0a51007768"
optional = true
# GPU backends are per-platform Cargo features on tauri-plugin-local-stt:
# metal/coreml (macOS), cuda/directml/vulkan/openblas (Windows/Linux).
# `metal` implies `whisper-cpp` — the in-process Whisper server this app uses.
features = ["metal"]

# The transcription plugin's `setup` reads `app.state::<Arc<dyn AudioProvider>>`,
# so the host must manage `ActualAudio` before the plugin registers. The anarlog
# app does exactly this (apps/desktop/src-tauri/src/lib.rs).
[dependencies.audio-actual]
git = "https://github.com/fastrepl/anarlog"
rev = "864ddc1f692116d128eea2692fd72b0a51007768"
optional = true

# `vault_base()` (session audio + settings) is read from the StartupSnapshot
# state that only tauri-plugin-settings::init() manages, and the local-stt
# models dir resolves through the same plugin.
[dependencies.tauri-plugin-settings]
git = "https://github.com/fastrepl/anarlog"
rev = "864ddc1f692116d128eea2692fd72b0a51007768"
optional = true

# Debug-only smoke runner (src/smoke.rs) needs tokio::time.
[dependencies.tokio]
version = "1"
features = ["time"]
optional = true

# anarlog's `storage` crate hardcodes `~/Library/Application Support/anarlog`
# for release builds, which would share (or be redirected by) a real anarlog
# install's vault and models. The vendored copy keeps every build under the
# app's own bundle-identifier folder. See vendor/anarlog-storage/PROVENANCE.md.
[patch."https://github.com/fastrepl/anarlog"]
storage = { path = "../vendor/anarlog-storage" }

# The yujonglee swift-rs fork assumes the pre-Xcode-16.3 SwiftPM layout
# (<build-path>/<arch>-apple-macosx/<config>), but current SwiftPM writes
# products to <build-path>/out/Products/<Config> — "native static library
# `apple-speech-swift` not found" on link. Vendored + one extra link-search line.
# See vendor/swift-rs/PROVENANCE.md.
[patch."https://github.com/yujonglee/swift-rs"]
swift-rs = { path = "../vendor/swift-rs" }

[features]
default = []
transcription = [
    "dep:tauri-plugin-transcription",
    "dep:tauri-plugin-local-stt",
    "dep:audio-actual",
    "dep:tauri-plugin-settings",
    "dep:tokio",
]
