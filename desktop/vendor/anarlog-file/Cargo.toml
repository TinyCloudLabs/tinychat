[package]
name = "file"
version = "0.1.0"
edition = "2024"

[dependencies]
anlg-download-interface = { git = "https://github.com/fastrepl/anarlog", rev = "864ddc1f692116d128eea2692fd72b0a51007768", package = "download-interface" }

base64 = "0.22.1"
crc32fast = "1.4.2"
thiserror = "2"

futures-util = "0.3.31"
reqwest = { version = "0.13", features = ["multipart", "stream"] }
tokio = { version = "1", features = ["rt", "macros", "fs", "time"] }
tokio-util = "0.7"
tracing = "0.1"

[dev-dependencies]
anlg-s3 = { git = "https://github.com/fastrepl/anarlog", rev = "864ddc1f692116d128eea2692fd72b0a51007768", package = "s3" }
dirs = "6.0.0"
tempfile = "3"
testcontainers-modules = { version = "0.12.1", features = ["minio"] }
wiremock = "0.6"
