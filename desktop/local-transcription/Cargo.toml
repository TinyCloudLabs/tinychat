[package]
name = "exo-local-transcription"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anlg-mp3 = { package = "mp3", git = "https://github.com/fastrepl/anarlog", rev = "864ddc1f692116d128eea2692fd72b0a51007768" }
hound = "3.5"
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
