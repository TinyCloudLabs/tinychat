<!doctype html>
<!--
  Cloudflare Pages serves the nearest 404.html, with status 404, for a file that does not exist. This one covers
  /assets/*: a page left open across a deploy asks for chunks the new build no longer has, and a real 404 makes its
  import fail cleanly instead of receiving the app's index.html as JavaScript. There is no top-level 404.html, so
  every other path still gets Pages' single-page-app fallback (the app's index.html).
-->
<html lang="en"><head><meta charset="utf-8"><title>Not found</title></head><body>Not found.</body></html>
